<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson info</title>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F9FA">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 10px; display: flex; align-items: center; gap: 10px; flex: none"><a href="LearnNavy.dc.html" aria-label="Close lesson" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; display: flex; gap: 5px" role="img" aria-label="{{fText}}"><sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 5px; border-radius: 999px; background: {{b.c}}"></span></sc-for></span></div><div style="padding: 20px 24px 0; flex: none"><span style="font-size: 13px; color: #5B6577">{{kicker}}</span></div><h1 style="margin: 6px 24px 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; flex: none">{{title}}</h1><p style="margin: 10px 24px 0; font-size: 16px; line-height: 1.6; color: #334155; flex: none">{{lead}}</p><sc-if value="{{hasRows}}" hint-placeholder-val="{{ false }}"><div style="margin: 16px 24px 0; padding: 6px 16px 10px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; flex: none"><p style="margin: 8px 0 4px; font-size: 13px; color: #5B6577">{{exTitle}}</p><sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">{{r.a}}</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C; white-space: nowrap">{{r.b}}</span></div></sc-for></div></sc-if><sc-if value="{{chart}}" hint-placeholder-val="{{ false }}"><div style="margin: 16px 24px 0; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; flex: none; "><div style="display: flex; align-items: flex-end; gap: 14px; height: 140px"><span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; height: 100%"><span style="font-family: 'Geist Mono', monospace; font-size: 14px">₦50,000</span><span style="width: 100%; height: 70px; border-radius: 10px 10px 4px 4px; background: #C0C6D0"></span><span style="font-size: 12px; color: #5B6577">Last year</span></span><span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; height: 100%"><span style="font-family: 'Geist Mono', monospace; font-size: 14px">₦60,000</span><span style="width: 100%; height: 96px; border-radius: 10px 10px 4px 4px; background: #10B981"></span><span style="font-size: 12px; color: #5B6577">This year</span></span></div><p style="margin: 12px 0 0; font-size: 13px; color: #5B6577">Same basket of goods, 20% more naira.</p></div></sc-if><div style="margin: 12px 24px 0; padding: 14px 16px; border-radius: 16px; background: #EAF6EF; border: 1px solid #E5E7EB; flex: none; border-color: #CFE9DB"><span style="display: flex; gap: 10px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg><span style="font-size: 14px; line-height: 1.5; color: #334155"><b style="font-weight: 600; color: #0B192C">Why it matters:</b> {{tip}}</span></span></div><a href="AskFinvoraNavy.dc.html" style="margin: 14px 24px 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E5E7EB; text-decoration: none; color: #0B192C; flex: none"><span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: #0B192C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">Ask Finvora about {{topic}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a><div style="margin-top: auto; padding: 16px 24px 26px; display: flex; gap: 10px; flex: none"><a href="{{next}}" style="flex: 1; height: 54px; border-radius: 14px; background: #0B192C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Continue</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-lessons */  F() { return window.FV; }
  L() { return this.F() ? this.F().lesson() : { title: '', c: null, index: 0 }; }
  flow(kind) {
    const F = this.F(); if (!F) return { fText: '', bars: [], next: 'LessonDoneNavy.dc.html', n: 1, total: 1 };
    const v = F.flowVals(kind), n = +v.fN, t = +v.fTotal;
    return { fText: v.fText, next: v.nextHref, n, total: t, bars: Array.from({ length: t }, (_, i) => ({ c: i < n - 1 ? '#10B981' : i === n - 1 ? '#0B192C' : '#E2E5EA' })) };
  }
  constructor(p) { super(p); if (window.FV && !/[?&]keep=1/.test(location.search)) window.FV.startRun(); }
  renderVals() {
    const L = this.L(), c = L.c, fl = this.flow('info');
    if (!c) return Object.assign(fl, { kicker: 'Interest · Read', title: 'Prices rise, money buys less', lead: 'Inflation is how fast prices go up. When inflation is 20%, something that cost ₦50,000 last year costs about ₦60,000 now.', chart: true, hasRows: false, rows: [], exTitle: '', tip: 'money left in a box loses value each year. Saving and investing help you keep up.', topic: L.title.toLowerCase() });
    return Object.assign(fl, { kicker: L.title + ' · Read', title: L.title, lead: c.lead, chart: false, hasRows: !!(c.rows && c.rows.length), exTitle: c.exTitle || '', rows: (c.rows || []).map(([a, b]) => ({ a, b })), tip: c.tip || '', topic: L.title.toLowerCase() });
  }
}
</script>
</body>
</html>

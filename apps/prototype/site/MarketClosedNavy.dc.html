<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; ">
<div aria-hidden="true" style="flex: 1; padding: 64px 24px 0"><h1 style="margin: 0; font-size: 26px; font-weight: 600">{{title}}</h1><p style="margin: 8px 0 0; font-size: 15px; color: #5B6577">{{sub}}</p><span style="display: block; margin-top: 14px; height: 120px; border-radius: 12px; background: #E8EBEF"></span><span style="display: block; margin-top: 14px; height: 54px; border-radius: 12px; background: #E8EBEF"></span><span style="display: block; margin-top: 14px; height: 54px; border-radius: 12px; background: #E8EBEF"></span><span style="display: block; margin-top: 14px; height: 54px; border-radius: 12px; background: #E8EBEF"></span></div><div style="position: absolute; inset: 0; background: rgba(11,11,15,.45)"></div><div role="dialog" aria-modal="true" aria-label="The NGX is closed" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 0"><span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #D5D9E0"></span><div style="margin-top: 18px"><span style="width: 44px; height: 44px; border-radius: 999px; background: #FBF0E2; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span></div><h2 style="margin: 14px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">The NGX is closed</h2><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #5B6577">Trading is 10:00 to 14:30, Monday to Friday. Your practice order will fill at the next open, {{next}}.</p><div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px"><a href="PracticeNavy.dc.html" onClick="{{place}}" style="height: 52px; flex: none; border-radius: 12px; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; background-color: #0B192C">Place order for open</a><a href="{{back}}" style="height: 52px; flex: none; border-radius: 12px; border: 1px solid #D5D9E0; font-weight: 500; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; ">Cancel</a></div></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-practice */
  S() { return window.FV && window.FV.SIM; }
  n(k) { return '₦' + (k / 100).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  ch(p) { return (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%'; }
  up(p) { return p >= 0; }
  ab(t) { return t.slice(0, 3); }
  tk() { const m = /[?&]t=([A-Z]+)/.exec(location.search); return m ? m[1] : 'ZENITHBANK'; }
  renderVals() {
    const S = this.S(); if (!S) return {}; const t = this.tk(), c = S.company(t), side = (/side=(buy|sell)/.exec(location.search) || [])[1] || 'buy', q = +((/[?&]q=(\d+)/.exec(location.search) || [])[1] || 1);
    return { title: (side === 'buy' ? 'Buy ' : 'Sell ') + c.name, sub: q.toLocaleString('en-NG') + ' shares · ' + this.n(S.price(t)), next: S.nextOpen(), back: (side === 'buy' ? 'TradeNavy' : 'PracticeSellNavy') + '.dc.html?t=' + t + '&q=' + q, place: () => S.queue(side, t, q) };
  }
}
</script>
</body>
</html>

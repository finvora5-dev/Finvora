<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finvora Plus</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finvora"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; padding: 10px 24px 28px">
  <div style="margin: -10px -24px 0; padding: 10px 24px 0"><a href="MeNavy.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a></div>
  <span style="margin-top: 16px; font-size: 12px; color: #047857; font-weight: 600; text-transform: uppercase; letter-spacing: .06em">Finvora Plus</span>
  <h1 style="margin: 8px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2">Go deeper on every company</h1>
  <ul style="margin: 24px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 15px">
    <sc-for list="{{f}}" as="x" hint-placeholder-count="5"><li style="display: flex; gap: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="m5 12 5 5 9-10"></path></svg>{{x.t}}</li></sc-for>
  </ul>
  <div role="radiogroup" aria-label="Plan" style="margin-top: 28px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
      <button role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 16px; border-radius: 14px; border: {{p.bd}}; background: {{p.bg}}; font: inherit; cursor: pointer; color: #0B192C; text-align: left">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{p.t}}</span><span style="font-size: 12px; color: #5B6577">{{p.s}}</span></span><span style="font-family: 'Geist Mono', monospace; font-size: 16px">{{p.pr}}</span>
      </button>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="#" onClick="{{pay}}" style="height: 52px; border-radius: 12px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; text-decoration: none; background-color: #0B192C">Continue to payment</a>
    <p style="margin: 0; text-align: center; font-size: 12px; color: #5B6577">Paid with Paystack. Cancel anytime in Settings.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-pay */
  constructor(p) { super(p); this.state = { g: 1 }; if (window.FV && window.FV.PAY) window.FV.PAY.remember(); }
  renderVals() {
    const pay = (e) => { e.preventDefault(); const PAY = window.FV && window.FV.PAY; if (!PAY) return; const r = PAY.start(this.state.g === 1 ? 'yearly' : 'monthly');
      if (r.ok) location.href = 'PayPendingNavy.dc.html?o=' + r.orderId; else if (r.reason === 'pending') location.href = 'PayPendingNavy.dc.html?o=' + r.orderId; else if (r.reason === 'age') location.href = 'AgeCheckNavy.dc.html?then=PlusNavy'; else location.href = 'YourPlanNavy.dc.html'; };
    const PR = (window.FV && window.FV.PAY) ? window.FV.PAY.PRICE : { monthly: 599900, yearly: 6598900 }, nn = (k) => '₦' + (k / 100).toLocaleString('en-NG', { maximumFractionDigits: 2 }); /* live-prices */
    const P = [['Monthly', 'Billed every month', nn(PR.monthly)], ['Yearly', 'One month free · 11 × ' + nn(PR.monthly), nn(PR.yearly)]];
    return { pay,
      f: ['Unlimited Finvora AI questions', 'Compare companies side by side', 'Dividend history for every company', 'Full 5-year financial statements', 'Price alerts on your watchlist'].map(t => ({ t })),
      plans: P.map(([t, s, pr], i) => { const on = this.state.g === i; return { t, s, pr, on: String(on), pick: () => this.setState({ g: i }), bd: on ? '1.5px solid #0B192C' : '1px solid #D5D9E0', bg: on ? '#EEF0F3' : '#FFFFFF' }; })
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice watchlist</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B192C"><meta name="color-scheme" content="only light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="background: #0B192C; color: #FFFFFF; padding: 12px 20px 18px; flex: none"><div style="display: flex; align-items: center; gap: 4px; margin-left: -12px"><a href="PracticeNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Watchlist</h1><a href="PracticeMarketNavy.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 12px; background: #10B981; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</a></div><div style="margin-top: 12px; display: flex; gap: 10px"><span style="flex: 1; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #B6C0CF">Watching</span><span style="font-family: 'Geist Mono', monospace; font-size: 18px">{{nW}}</span></span><span style="flex: 1; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #B6C0CF">Up today</span><span style="font-family: 'Geist Mono', monospace; font-size: 18px; color: #00E676">{{nUp}}</span></span><span style="flex: 1; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #B6C0CF">Alerts on</span><span style="font-family: 'Geist Mono', monospace; font-size: 18px">{{nAl}}</span></span></div></header><section style="padding: 14px 20px 0">
  <sc-for list="{{rows}}" as="x" hint-placeholder-count="3"><a href="{{x.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 0; border-bottom: 1px solid #EDEFF2; text-decoration: none; color: #0B192C"><span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #E8EBEF; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; color: #0B192C">{{x.ab}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.name}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B6577">{{x.t}}</span><span style="margin-top: 6px; display: flex; align-items: center; gap: 8px"><span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: #DDF3E6; color: #047857; font-size: 11px; font-weight: 600; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4"></path></svg>{{x.alert}}</span></span></span><svg width="64" height="28" viewBox="0 0 64 28" aria-hidden="true"><path d="M0 9 L6 5 L12 3 L17 4 L23 3 L29 3 L35 3 L41 4 L47 3 L52 4 L58 4 L64 3" fill="none" stroke="#10B981" stroke-width="1.6" stroke-linecap="round"></path></svg><span style="width: 84px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-family: 'Geist Mono', monospace; font-size: 14px">{{x.p}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 3px 6px; border-radius: 6px; background: {{x.bg}}; color: {{x.fg}}">{{x.c}}</span></span></a></sc-for>
</section>
<section style="margin: 18px 20px 0; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; display: flex; gap: 12px; align-items: flex-start">
  <span style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #10B981; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span>
  <span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 14px; font-weight: 600">Why did Zenith Bank rise today?</strong><span style="font-size: 13px; line-height: 1.45; color: #5B6577">Ask Finvora AI for a plain-English summary of today's move.</span><a href="AskFinvoraNavy.dc.html" style="margin-top: 4px; font-size: 13px; font-weight: 600; color: #047857; text-decoration: none; min-height: 32px; display: flex; align-items: center">Ask Finvora AI →</a></span>
</section>
<p style="margin: 14px 20px 0; font-size: 12px; color: #5B6577">Simulated money. Prices delayed and illustrative.</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-markets */
  S() { return window.FV && window.FV.SIM; }
  n(k) { return '₦' + (k / 100).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  px() { const S = this.S(), v = { p: {}, c: {}, bg: {}, fg: {} }; if (!S) return v;
    S.COMPANIES.forEach((co) => { const ch = S.change(co.t); v.p[co.t] = this.n(S.price(co.t)); v.c[co.t] = (ch >= 0 ? '▲ ' : '▼ ') + Math.abs(ch).toFixed(1) + '%'; v.bg[co.t] = ch >= 0 ? '#DDF3E6' : '#FCEDEB'; v.fg[co.t] = ch >= 0 ? '#047857' : '#B9473F'; }); return v; }
  renderVals() {
    const S = this.S(), P = window.FV && window.FV.PLUS; if (!S || !P) return { rows: [] };
    let T = P.lists()[0].tickers.filter((t) => S.COMPANIES.some((c) => c.t === t)); const sug = !T.length; if (sug) T = ['ZENITHBANK', 'GTCO', 'SEPLAT'];
    return { nUp: String(sug ? 0 : T.filter((t) => S.change(t) >= 0).length), nAl: '0', nW: String(sug ? 0 : T.length), rows: T.map((t) => { const c = S.company(t), ch = S.change(t); return { href: 'PracticeCompanyNavy.dc.html?t=' + t, ab: t.slice(0, 3), name: c.name, t, alert: sug ? 'Tap to add' : 'Set alert', p: this.n(S.price(t)), c: (ch >= 0 ? '▲ ' : '▼ ') + Math.abs(ch).toFixed(1) + '%', bg: ch >= 0 ? '#DDF3E6' : '#FCEDEB', fg: ch >= 0 ? '#047857' : '#B9473F' }; }) };
  }
}
</script>
</body>
</html>

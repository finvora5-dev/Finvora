<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Course review question</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finvora"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 10px; display: flex; align-items: center; gap: 10px; flex: none"><a href="LearnNavy.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; display: flex; gap: 4px" role="img" aria-label="Question {{n}} of 8"><sc-for list="{{bars}}" as="x" hint-placeholder-count="8"><span style="flex: 1; height: 5px; border-radius: 999px; background: {{x.c}}"></span></sc-for></span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B6577">{{n}}/8</span></div><div style="padding: 20px 24px 0; flex: none"><span style="font-size: 13px; color: #5B6577">Review · {{lesson}}</span></div><h1 style="margin: 6px 24px 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; flex: none">{{q}}</h1><div role="radiogroup" aria-label="Answer" style="margin: 18px 24px 0; display: flex; flex-direction: column; gap: 10px; flex: none"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 14px; border: {{o.bd}}; background: {{o.bg}}; font: inherit; color: #0B192C; cursor: pointer; text-align: left"><span style="font-family: {{o.font}}; font-size: 17px">{{o.t}}</span><span style="width: 22px; height: 22px; flex: none; border-radius: 999px; border: {{o.dot}}; box-sizing: border-box"></span></button></sc-for></div><div style="margin-top: auto; padding: 16px 24px 26px; display: flex; gap: 10px; flex: none"><a href="#" onClick="{{check}}" aria-disabled="{{noPick}}" style="flex: 1; height: 54px; border-radius: 14px; background: {{ctaBg}}; opacity: {{op}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Check answer</a></div>
<sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17,28,45,.45)" aria-hidden="true"></div>
    <section role="dialog" aria-modal="true" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 32px rgba(17,28,45,.18)">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D5D9E0"></span>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 999px; background: {{iconBg}}; color: {{tone}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">{{icon}}</span><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 20px; font-weight: 600; color: {{tone}}">{{title}}</strong><span style="font-size: 13px; color: #5B6577">{{sub}}</span></span></div>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #334155">{{why}}</p>
      
      <a href="AskFinvoraNavy.dc.html?q={{askQ}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #E5E7EB; text-decoration: none; color: #0B192C"><span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: #0B192C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{askTitle}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="{{ctaHref}}" onClick="{{next}}" style="height: 54px; border-radius: 14px; background: #0B192C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
    </section>
  </sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-review */
  Q = [{"l": "What money does", "id": "money", "q": "Bisi keeps ₦10,000 in a savings box for next month. Which job is her money doing?", "o": ["Paying for things", "Comparing prices", "Keeping value for later", "Measuring kobo"], "r": 2, "why": "Putting money aside to use later is money keeping value."}, {"l": "What money does", "id": "money", "q": "How many kobo are in ₦25?", "o": ["25", "250", "2,500", "25,000"], "r": 2, "why": "₦1 is 100 kobo, so ₦25 × 100 = 2,500 kobo."}, {"l": "Income and expenses", "id": "income", "q": "Tunde earns ₦120,000 a month and spends ₦95,000. How much is left over?", "o": ["₦215,000", "₦25,000", "₦95,000", "₦12,000"], "r": 1, "why": "Income minus expenses is what you can save: ₦120,000 − ₦95,000 = ₦25,000."}, {"l": "Inflation", "id": "inflation", "q": "Inflation is 20%. What does ₦100,000 buy next year, in today's prices?", "o": ["About ₦120,000", "About ₦100,000", "About ₦83,000", "About ₦80,000"], "r": 2, "why": "Prices are 20% higher, so ₦100,000 buys what about ₦83,000 buys today (₦100,000 ÷ 1.2)."}, {"l": "Budgeting", "id": "budget", "q": "Ada earns ₦200,000 a month. Using 50/30/20, how much goes to savings?", "o": ["₦20,000", "₦40,000", "₦60,000", "₦100,000"], "r": 1, "why": "Savings are the 20% part: 20% of ₦200,000 is ₦40,000."}, {"l": "Budgeting", "id": "budget", "q": "Using 50/30/20, which of these is a want?", "o": ["Rent", "Electricity bill", "Weekend suya with friends", "School fees"], "r": 2, "why": "It's nice to have but not essential."}, {"l": "Simple and compound interest", "id": "interest", "q": "₦100,000 earns 10% a year, compounded yearly. How much is it after 2 years?", "o": ["₦120,000", "₦121,000", "₦110,000", "₦200,000"], "r": 1, "why": "Year 1 gives ₦110,000, and year 2 adds 10% of ₦110,000 to make ₦121,000."}, {"l": "Emergency funds", "id": "emergency", "q": "Your costs are ₦60,000 a month. How much is 3 months of emergency savings?", "o": ["₦60,000", "₦120,000", "₦180,000", "₦360,000"], "r": 2, "why": "₦60,000 × 3 = ₦180,000. Many people aim for 3 to 6 months of costs, built up a little at a time."}];
  st() { try { return JSON.parse(localStorage.getItem('fv.review.v1') || 'null') || {}; } catch (e) { return {}; } }
  put(o) { try { localStorage.setItem('fv.review.v1', JSON.stringify(Object.assign(this.st(), o))); } catch (e) {} }
  constructor(p) { super(p); const r = this.st().run; this.state = { run: r && r.i < 8 ? r : { i: 0, right: 0, missed: [] }, pick: null, res: null }; }
  renderVals() {
    const run = this.state.run, q = this.Q[run.i], p = this.state.pick, r = this.state.res, ok = !!(r && r.ok), last = run.i === 7;
    const money = q.o.every((t) => /₦|^\d/.test(t));
    return { n: String(run.i + 1), lesson: q.l, q: q.q, bars: this.Q.map((_, i) => ({ c: i < run.i ? '#10B981' : i === run.i ? '#0B192C' : '#E2E5EA' })),
      opts: q.o.map((t, i) => ({ t, on: String(p === i), font: money ? "'Geist Mono', monospace" : "'Geist', system-ui, sans-serif",
        bd: r && i === q.r ? '2px solid #10B981' : r && p === i ? '2px solid #B9473F' : p === i ? '2px solid #0B192C' : '1px solid #D5D9E0', bg: r && i === q.r ? '#EAF6EF' : r && p === i ? '#FCEFED' : '#FFFFFF',
        dot: p === i ? '6px solid #0B192C' : '1.5px solid #C0C6D0', pick: () => { if (!r) this.setState({ pick: i }); } })),
      noPick: String(p === null), ctaBg: p === null ? '#334155' : '#0B192C', op: p === null ? '.4' : '1',
      check: (e) => { e.preventDefault(); if (p === null || r) return; this.setState({ res: { ok: p === q.r } }); },
      answered: !!r, iconBg: ok ? '#DDF3E6' : '#FCEDEB', tone: ok ? '#10B981' : '#B9473F', icon: ok ? '✓' : '×',
      title: ok ? 'Correct' : 'Not quite', sub: ok ? 'Question ' + (run.i + 1) + ' of 8' : 'The right answer is ' + q.o[q.r], why: q.why,
      askTitle: 'Ask Finvora to explain this', askQ: encodeURIComponent(q.q), cta: last ? 'See my score' : ok ? 'Continue' : 'Got it, continue', ctaHref: '#',
      next: (e) => { e.preventDefault(); const nr = { i: run.i + 1, right: run.right + (ok ? 1 : 0), missed: ok ? run.missed : run.missed.concat([run.i]) };
        if (last) { const best = Math.max(this.st().best || 0, nr.right); this.put({ run: null, last: nr, best }); location.href = 'CourseReviewDoneNavy.dc.html'; return; }
        this.put({ run: nr }); this.setState({ run: nr, pick: null, res: null }); window.scrollTo(0, 0); } };
  }
}
</script>
</body>
</html>

.muted{color:#615A6E}

@keyframes d-pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@keyframes d-flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.05,1.1) rotate(-3deg)}60%{transform:scale(.97,1.03) rotate(2deg)}}
@keyframes d-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@media (prefers-reduced-motion:no-preference){
.btn,.press{transition:transform .1s ease-out,box-shadow .1s ease-out}
.bob{animation:d-bob 3s ease-in-out infinite}
.pop{animation:d-pop .45s cubic-bezier(.2,.8,.2,1) both}
.flick{animation:d-flick 1.8s ease-in-out infinite;transform-origin:50% 90%}
.wave{animation:d-wave 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 90%}
}

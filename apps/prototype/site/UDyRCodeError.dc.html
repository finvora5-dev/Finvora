<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { s: 0 }; }
  renderVals() {
    const S = [
      { tab: 'Wrong code', msg: "That code doesn't match. Check the email and try again.", tries: '2 tries left', bd: '#F04438', lock: false },
      { tab: 'Expired', msg: 'This code has expired. Codes last 10 minutes. We can send a new one.', tries: '', bd: '#F04438', lock: false },
      { tab: 'Too many tries', msg: 'Too many wrong codes. For your safety, wait 15 minutes or request a new code.', tries: '', bd: '#F04438', lock: true }];
    const c = S[this.state.s];
    return { tabs: S.map((x, i) => ({ t: x.tab, on: i === this.state.s ? 'true' : 'false', bg: i === this.state.s ? '#5B21B6' : '#FFFFFF', fg: i === this.state.s ? '#FFFFFF' : '#0E0B14', tap: () => this.setState({ s: i }) })),
      msg: c.msg, tries: c.tries, hasTries: !!c.tries, bd: c.bd, lock: c.lock, open: !c.lock };
  }
}

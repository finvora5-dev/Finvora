<div style="padding: 10px 16px 0 8px; display: flex; align-items: center; gap: 4px; flex: none"><a href="SettingsNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Your plan</h1></div><div style="padding: 18px; border: 1px solid #E5E7EB; border-radius: 16px; margin: 14px 24px 0"><span style="font-size: 12px; color: #047857; font-weight: 600; text-transform: uppercase; letter-spacing: .06em">Finvora Plus</span><div style="margin-top: 6px; font-size: 20px; font-weight: 600">{{per}}</div><div style="margin-top: 4px; font-family: 'Geist Mono', monospace; font-size: 15px">{{priceLine}}</div><span style="margin-top: 8px; display: block; font-size: 13px; color: #5B6577">{{renewLine}}</span></div><section style="padding: 18px 24px 0; flex: none"><h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #5B6577; text-transform: uppercase; letter-spacing: .06em">Payments</h2><sc-for list="{{pays}}" as="x" hint-placeholder-count="2"><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #EDEFF2; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 500">{{x.d}}</span><span style="font-size: 12px; color: #5B6577">{{x.no}}</span></span><span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: #334155; text-align: right">{{x.amt}}</span></a></sc-for></section><section style="padding: 18px 24px 0; flex: none"><sc-if value="{{monthly}}" hint-placeholder-val="{{ true }}"><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #EDEFF2; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 500">Switch to yearly</span><span style="font-size: 12px; color: #5B6577">Save ₦5,999, one month free</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a></sc-if><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #EDEFF2; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 500">Update card</span><span style="font-size: 12px; color: #5B6577">Paid with Paystack</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a><a href="CancelPlanNavy.dc.html" style="display: flex; align-items: center; min-height: 54px; text-decoration: none; font-size: 15px; color: #B9473F">Cancel Plus</a></section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-pay */
  P() { return window.FV && window.FV.PAY; }
  o() { const P = this.P(); if (!P) return null; const c = P.current(); if (c) return c; const b = window.FV.billing(); return b.orders[0] || null; }
  oid() { const m = /[?&]o=([\w-]+)/.exec(location.search); return m ? m[1] : ''; }
  n(k) { return '₦' + (k / 100).toLocaleString('en-NG', { maximumFractionDigits: 2 }); }
  d(day) { return day ? new Date(day + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
  base() { const P = this.P(), o = this.o(); if (!P || !o) return { amt: '₦5,999', planName: 'Plus monthly', orderNo: 'FV-24117' };
    return { amt: this.n(o.amountKobo), planName: 'Plus ' + o.period, orderNo: P.orderNo(o) }; }
  constructor(p) { super(p); const F = window.FV; if (F && F.billing().sub.plan !== 'plus') location.replace('PlusNavy.dc.html'); }
  renderVals() {
    const F = window.FV, P = this.P(); if (!F || !P) return { pays: [] }; const b = F.billing(), sub = b.sub, y = sub.period === 'yearly';
    return { monthly: !y, per: y ? 'Yearly' : 'Monthly', priceLine: y ? this.n(P.PRICE.yearly) + ' a year' : this.n(P.PRICE.monthly) + ' a month', renewLine: (sub.cancelled ? 'Plus ends ' : 'Renews ') + new Date((sub.renewsOn || '') + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }),
      pays: b.orders.filter((o) => o.status === 'confirmedSuccess').map((o) => ({ d: new Date(o.updatedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }), no: P.orderNo(o), amt: this.n(o.amountKobo) })) };
  }
}
</script>

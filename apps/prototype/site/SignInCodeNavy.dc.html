<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter code</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; ">
<div style="padding: 10px 16px 0 8px; display: flex; align-items: center; gap: 4px; flex: none"><a href="SignInNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><span style="flex: 1"></span></div><div style="padding: 12px 24px 0; flex: none"><h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2">Check your email</h1><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #5B6577">We sent a 6-digit code to {{email}}.</p></div><div style="margin: 24px 24px 0; position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px"><sc-for list="{{boxes}}" as="x" hint-placeholder-count="6"><span aria-hidden="true" style="height: 56px; border: {{x.bd}}; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 22px">{{x.d}}</span></sc-for><input id="code" inputmode="numeric" enterkeyhint="go" autocomplete="one-time-code" maxlength="6" aria-label="6-digit code" value="{{code}}" onInput="{{onCode}}" onKeyDown="{{onKey}}" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; padding: 0"></div><div style="padding: 12px 24px 0; display: flex; justify-content: space-between; font-size: 13px; color: #5B6577"><a href="SignInNavy.dc.html" style="display: inline-block; padding: 14px 8px; margin: -14px -8px; color: #5B6577">Change email</a><a href="#" onClick="{{resend}}" style="display: inline-block; padding: 14px 8px; margin: -14px -8px; color: #5B6577">{{resendLabel}}</a></div><div style="margin-top: auto; padding: 16px 24px 28px; display: flex; flex-direction: column; gap: 10px; flex: none"><a href="#" onClick="{{go}}" style="height: 52px; flex: none; border-radius: 12px; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; background-color: #0B192C">Verify</a></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  A() { return window.FV && window.FV.AUTH; }
  boxes(code) { return [0, 1, 2, 3, 4, 5].map((i) => ({ d: code[i] || '', bd: code[i] ? '1px solid #0B192C' : (i === code.length ? '2px solid #10B981' : '1px solid #D5D9E0') })); }
  tick() { clearTimeout(this.t); this.t = setTimeout(() => { if (this.A() && this.A().resendIn() > 0) { this.setState({ n: Date.now() }); this.tick(); } }, 1000); }
  resendLabel() { const A = this.A(), r = A ? A.resendIn() : 0; return r > 0 ? 'Resend in 0:' + String(r).padStart(2, '0') : 'Resend code'; }
  check(code) {
    const A = this.A(); if (!A || code.length < 6) return;
    const r = A.verify(code);
    if (r === 'ok') { location.href = 'GoalNavy.dc.html'; return; }
    try { sessionStorage.setItem('fv.lastCode', code); } catch (e) {}
    location.href = 'CodeErrorNavy.dc.html?why=' + r;
  }
  constructor(p) { super(p); this.state = { code: '' }; }
  componentDidMount() { this.tick(); setTimeout(() => { const c = document.getElementById('code'); if (c) c.focus(); }, 0); }
  renderVals() {
    const A = this.A(), a = A ? A.get() : {};
    return { email: a.pending || 'your email', boxes: this.boxes(this.state.code), code: this.state.code, resendLabel: this.resendLabel(),
      onCode: (e) => { const c = e.target.value.replace(/\D/g, '').slice(0, 6); this.setState({ code: c }); if (c.length === 6) this.check(c); },
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.check(this.state.code); } },
      resend: (e) => { e.preventDefault(); if (!A || A.resendIn() > 0 || !a.pending) return; A.sendCode(a.pending); this.setState({ code: '' }); this.tick(); },
      go: (e) => { e.preventDefault(); this.check(this.state.code); } };
  }
}
</script>
</body>
</html>

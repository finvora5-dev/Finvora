<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trade history</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; ">
<div style="padding: 10px 16px 0 8px; display: flex; align-items: center; gap: 4px; flex: none"><a href="PracticeNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Trade history</h1></div><p style="margin: 4px 24px 0; padding: 10px 12px; border-radius: 10px; background: #E8EBEF; font-size: 12px; color: #5B6577">Simulated money. Prices delayed and illustrative.</p><sc-for list="{{months}}" as="g" hint-placeholder-count="2"><section style="padding: 18px 24px 0; flex: none"><h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #5B6577; text-transform: uppercase; letter-spacing: .06em">{{g.m}}</h2><sc-for list="{{g.items}}" as="x" hint-placeholder-count="2"><a href="{{x.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #EDEFF2; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 500">{{x.t}}</span><span style="font-size: 12px; color: #5B6577">{{x.s}}</span></span><span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: #334155; text-align: right"><span style="color: {{x.c}}">{{x.v}}</span> <span style="margin-left: 6px">›</span></span></a></sc-for></section></sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-practice */
  S() { return window.FV && window.FV.SIM; }
  n(k) { return '₦' + (k / 100).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  ch(p) { return (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%'; }
  up(p) { return p >= 0; }
  ab(t) { return t.slice(0, 3); }
  tk() { const m = /[?&]t=([A-Z]+)/.exec(location.search); return m ? m[1] : 'ZENITHBANK'; }
  renderVals() {
    const S = this.S(); if (!S) return { months: [] }; const a = S.get(), g = {}, order = [];
    const add = (at, item) => { const m = new Date(at).toLocaleDateString('en-GB', { month: 'long' }); if (!g[m]) { g[m] = []; order.push(m); } g[m].push(item); };
    a.trades.slice().reverse().forEach((tr) => { const c = S.company(tr.ticker), d = new Date(tr.at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      add(tr.at, { t: (tr.side === 'buy' ? 'Bought ' : 'Sold ') + c.name, s: tr.quantity.toLocaleString('en-NG') + ' shares at ' + this.n(tr.priceKobo) + ' · ' + d, v: (tr.side === 'buy' ? '−' : '+') + this.n(tr.netKobo), c: tr.side === 'buy' ? '#0B192C' : '#047857', href: 'PracticeCompanyNavy.dc.html?t=' + tr.ticker }); });
    const t0 = (a.trades[0] || {}).at || new Date().toISOString();
    add(t0, { t: 'Started practice', s: new Date(t0).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }), v: this.n(a.startingCashKobo), c: '#334155', href: '#' });
    return { months: order.map((m) => ({ m, items: g[m] })) };
  }
}
</script>
</body>
</html>

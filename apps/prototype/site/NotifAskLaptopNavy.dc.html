<meta name="theme-color" content="#F8F9FA"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finvora"><meta name="color-scheme" content="light">

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; overflow: hidden">
  
  <main style="flex: 1; min-width: 0; padding: 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Get price alerts and reminders</h1><div style="display: flex; flex-direction: column; gap: 0; width: 100%"><div style="display: flex; flex-direction: column; padding: 72px 0 0; flex: none"><span style="width: 48px; height: 48px; border-radius: 999px; background: #E8EBEF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4"></path></svg></span><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #5B6577">We will tell you when a company on your watchlist moves and remind you about your next lesson. You can change this anytime in Settings.</p><div style="margin-top: 16px"></div></div><div style="margin-top: auto; padding: 16px 0 28px; display: flex; flex-direction: column; gap: 10px; flex: none"><a href="HomeNavy.dc.html" onClick="{{allow}}" style="height: 52px; flex: none; border-radius: 12px; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; background-color: #0B192C">Allow notifications</a><a href="HomeNavy.dc.html" onClick="{{later}}" style="height: 52px; flex: none; border-radius: 12px; border: 1px solid #D5D9E0; font-weight: 500; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; ">Not now</a></div></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { const A = window.FV && window.FV.AUTH, set = (on) => () => { if (A) { A.setReminder(on); window.FV.ME.setPref('price', on); window.FV.ME.setPref('daily', on); } }; return { allow: set(true), later: set(false) }; }
}
</script>
</body>
</html>

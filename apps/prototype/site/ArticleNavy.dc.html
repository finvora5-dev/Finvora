<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 10px 12px 10px 8px; display: flex; align-items: center; justify-content: space-between">

    <h1 style="margin: 8px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">{{title}}</h1>
    <p style="margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: #334155">{{def}}</p>
    <sc-if value="{{hasFig}}" hint-placeholder-val="{{ false }}"><figure aria-label="Worked example: {{title}}" style="margin: 20px 0 0; padding: 0; border: 1px solid #E5E7EB; border-radius: 16px; background: #FFFFFF; overflow: hidden">

      <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 13px; color: #5B6577">{{rule}}</span>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; padding: 10px 8px; border-radius: 12px; background: #F8F9FA; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 11px; color: #5B6577">{{l1}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 16px">{{v1}}</span></span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 18px; color: #5B6577" aria-hidden="true">{{op}}</span>
          <span style="flex: 1; padding: 10px 8px; border-radius: 12px; background: #F8F9FA; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 11px; color: #5B6577">{{l2}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 16px">{{v2}}</span></span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 18px; color: #5B6577" aria-hidden="true">=</span>
          <span style="flex: 1; padding: 10px 8px; border-radius: 12px; background: #0B192C; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 11px; color: #B6C0CF">{{l3}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 16px; color: #00E676">{{v3}}</span></span>
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #334155">{{fNote}}</p>
      </div>
    </figure></sc-if>
    <h2 style="margin: 24px 0 0; font-size: 18px; font-weight: 600">Why it matters</h2>
    <p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #334155">{{why}}</p>
    <sc-if value="{{showCo}}" hint-placeholder-val="{{ false }}"><h2 style="margin: 24px 0 0; font-size: 18px; font-weight: 600">On the NGX</h2>
    <a href="CompanyNavy.dc.html" style="margin-top: 10px; display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #E5E7EB; border-radius: 14px; text-decoration: none">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: #E8EBEF; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500">ZEN</span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Zenith Bank</span><span style="font-size: 12px; color: #5B6577">Dividend yield 8.3%</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a></sc-if>
    <a href="{{askHref}}" style="margin-top: 20px; height: 48px; border-radius: 12px; border: 1px solid #D5D9E0; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; font-size: 15px; text-decoration: none"><span role="img" aria-label="Finvora" style="width: 20px; height: 20px; flex: none; border-radius: 6px; background: #0B192C; display: flex; align-items: center; justify-content: center; "><svg width="14" height="14" viewBox="75 55 490 560" aria-hidden="true"><path fill-rule="evenodd" fill="#FFFFFF" d="M242.0 604.4C201.7 583.5 170.8 561.1 144.5 533.8C86.6 473.8 65.8 398.1 87.5 326.5C97.2 294.7 114.7 266.1 139.9 241.0C151.6 229.4 169.0 214.8 169.0 216.7C169.0 217.1 168.3 221.0 167.5 225.4C165.1 237.6 161.2 266.0 159.5 283.0C157.6 301.9 156.3 338.0 157.6 338.0C158.1 338.0 160.1 335.7 162.0 332.9C166.5 326.1 182.3 309.6 190.7 302.7C217.1 281.3 251.1 266.1 303.0 252.6C312.6 250.1 336.7 244.2 356.5 239.5C432.1 221.6 482.6 206.0 524.9 187.6L535.2 183.1L534.5 186.8C532.9 195.3 524.4 218.5 518.0 231.5C497.7 273.0 467.9 303.0 425.9 324.0C373.4 350.4 304.4 359.2 223.0 350.0C206.0 348.1 177.7 343.6 163.6 340.6L156.7 339.2L157.3 359.8C159.9 449.6 189.9 530.7 244.5 595.5C258.0 611.6 258.3 612.0 257.4 612.0C256.9 612.0 250.0 608.6 242.0 604.4Z"/><path fill-rule="evenodd" fill="#00E676" d="M295.5 216.9C276.9 215.8 237.7 211.1 231.8 209.4C228.9 208.5 229.7 206.5 236.0 198.6C252.9 177.6 281.6 158.2 313.5 146.1C316.8 144.8 320.4 143.4 321.5 142.9C325.7 141.1 357.2 130.9 367.5 128.0C369.1 127.5 378.4 124.8 388.0 122.0C397.6 119.2 406.9 116.5 408.5 116.0C410.1 115.5 414.6 114.2 418.5 113.0C422.4 111.8 426.9 110.5 428.5 110.0C436.9 107.7 458.8 100.5 474.0 95.0C480.3 92.7 486.6 90.5 488.0 90.0C491.2 89.0 520.2 77.4 525.5 75.0C527.7 74.0 531.8 72.2 534.5 71.0C537.2 69.7 544.2 66.5 549.9 63.9C555.6 61.2 560.7 59.0 561.2 59.0C563.1 59.0 557.8 78.5 551.9 93.3C517.1 181.0 426.0 225.0 295.5 216.9Z"/></svg></span>Ask Finvora AI about this</a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-library */
  constructor(p) { super(p); this.state = { n: 0 }; }
  componentDidMount() {
    const L = window.FV && window.FV.LIB; if (!L) return; const a = L.current(); L.setRead(a.slug, 10);
    this.onScroll = () => { const h = document.documentElement, max = Math.max(1, h.scrollHeight - innerHeight); L.setRead(a.slug, Math.min(100, Math.round((scrollY + innerHeight) / h.scrollHeight * 100))); };
    addEventListener('scroll', this.onScroll, { passive: true }); setTimeout(this.onScroll, 300);
  }
  componentWillUnmount() { removeEventListener('scroll', this.onScroll); }
  renderVals() {
    const L = window.FV ? window.FV.LIB : null; if (!L) return {};
    const a = L.current(), f = a.deep && a.deep.formula, saved = L.isSaved(a.slug);
    let fig = { hasFig: false };
    if (f && f.rule && f.calc) {
      const op = f.rule.indexOf('÷') >= 0 ? '÷' : f.rule.indexOf('×') >= 0 ? '×' : null;
      const sp = (x) => op ? x.split('=').map((y) => y.trim()).reduce((acc, y, i) => i === 0 ? y.split(op).map((z) => z.trim()) : acc.concat([y]), []) : [];
      const L3 = sp(f.rule), V3 = sp(f.calc);
      if (L3.length === 3 && V3.length === 3) fig = { hasFig: true, rule: L3[2] + ' = ' + L3[0] + ' ' + op + ' ' + L3[1], op, l1: L3[0], l2: L3[1], l3: L3[2], v1: V3[0], v2: V3[1], v3: V3[2], fNote: f.note || f.intro || '' };
    }
    return Object.assign({ rule: '', op: '÷', l1: '', l2: '', l3: '', v1: '', v2: '', v3: '', fNote: '' }, fig, {
      kicker: L.topicOf(a).name + ' · ' + L.minutes(a) + ' min read', title: a.title, def: a.definition, why: a.whyItMatters || (a.explanation || []).join(' '),
      showCo: a.slug === 'dividend', saved: String(saved), saveLabel: saved ? 'Saved. Remove from saved' : 'Save', saveC: saved ? '#047857' : '#0B192C',
      toggle: (e) => { e.preventDefault(); L.toggleSave(a.slug); this.setState({ n: this.state.n + 1 }); },
      askHref: 'AskFinvoraNavy.dc.html?q=' + encodeURIComponent('What is ' + a.title.toLowerCase() + '?') });
  }
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson calculation</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 10px; display: flex; align-items: center; gap: 10px; flex: none"><a href="LearnNavy.dc.html" aria-label="Close lesson" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; display: flex; gap: 5px" role="img" aria-label="{{fText}}"><sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 5px; border-radius: 999px; background: {{b.c}}"></span></sc-for></span></div><div style="padding: 20px 24px 0; flex: none"><span style="font-size: 13px; color: #5B6577">{{kicker}}</span></div><h1 style="margin: 6px 24px 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; flex: none">{{q}}</h1><sc-if value="{{hasRows}}" hint-placeholder-val="{{ false }}"><div style="margin: 16px 24px 0; padding: 6px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; flex: none; "><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 0; font-size: 14px"><span style="color: #5B6577">Amount</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">₦50,000</span></div><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">Rate</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">10% a year</span></div><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">Time</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">2 years</span></div></div></sc-if><div style="margin: 16px 24px 0; flex: none"><label for="ans" style="font-size: 13px; font-weight: 500">Your answer</label><div style="margin-top: 6px; display: flex; align-items: center; gap: 8px; height: 58px; padding: 0 16px; border-radius: 14px; border: {{fieldBd}}; background: #FFFFFF"><span style="font-family: 'Geist Mono', monospace; font-size: 22px; color: #5B6577">{{pre}}</span><input id="ans" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-describedby="calc-hint" value="{{val}}" onInput="{{onVal}}" onKeyDown="{{onKey}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-family: 'Geist Mono', monospace; font-size: 22px; color: #0B192C"></div><div style="margin-top: 10px; display: flex; gap: 8px"><button type="button" onClick="{{zeros}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D9E0; background: #FFFFFF; font: inherit; font-size: 13px; color: #0B192C; cursor: pointer">+000</button><button type="button" onClick="{{clear}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D9E0; background: #FFFFFF; font: inherit; font-size: 13px; color: #0B192C; cursor: pointer">Clear</button></div><sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}"><p id="calc-hint" style="margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: #334155">{{hint}}</p></sc-if></div><div style="margin-top: auto; padding: 16px 24px 26px; display: flex; gap: 10px; flex: none"><button type="button" onClick="{{toggleHint}}" aria-expanded="{{hintOpen}}" style="cursor: pointer; flex: none; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 1px solid #D5D9E0; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #0B192C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Hint</button><a href="#" onClick="{{check}}" aria-disabled="{{empty}}" style="flex: 1; height: 54px; border-radius: 14px; background: {{ctaBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Check answer</a></div>
<sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17,28,45,.45)" aria-hidden="true"></div>
    <section role="dialog" aria-modal="true" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 32px rgba(17,28,45,.18)">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D5D9E0"></span>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 999px; background: {{iconBg}}; color: {{tone}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">{{icon}}</span><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 20px; font-weight: 600; color: {{tone}}">{{title}}</strong><span style="font-size: 13px; color: #5B6577">{{sub}}</span></span></div>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #334155">{{why}}</p>
      
      <a href="AskFinvoraNavy.dc.html?q={{askQ}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #E5E7EB; text-decoration: none; color: #0B192C"><span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: #0B192C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{askTitle}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="{{ctaHref}}" style="height: 54px; border-radius: 14px; background: {{ctaBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
    </section>
  </sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-lessons */  F() { return window.FV; }
  L() { return this.F() ? this.F().lesson() : { title: '', c: null, index: 0 }; }
  flow(kind) {
    const F = this.F(); if (!F) return { fText: '', bars: [], next: 'LessonDoneNavy.dc.html', n: 1, total: 1 };
    const v = F.flowVals(kind), n = +v.fN, t = +v.fTotal;
    return { fText: v.fText, next: v.nextHref, n, total: t, bars: Array.from({ length: t }, (_, i) => ({ c: i < n - 1 ? '#10B981' : i === n - 1 ? '#0B192C' : '#E2E5EA' })) };
  }
  constructor(p) { super(p); this.state = { v: '', res: null, hint: false }; }
  num() { return +String(this.state.v).replace(/[^0-9.]/g, ''); }
  check() {
    if (this.state.res || !String(this.state.v).trim()) return;
    const c = this.L().c, ans = c ? c.answer : 10000, n = this.num(), ok = Math.abs(n - ans) <= 0.5;
    if (this.F()) this.F().answer('calc', ok, n);
    this.setState({ res: { ok, n } });
  }
  renderVals() {
    const L = this.L(), c = L.c, fl = this.flow('calc'), r = this.state.res, ok = !!(r && r.ok);
    const ans = c ? c.answer : 10000, kobo = !!(c && c.unit === 'kobo'), fmt = (x) => kobo ? Number(x).toLocaleString('en-NG') + ' kobo' : '₦' + Number(x).toLocaleString('en-NG');
    const wrongWhy = r && !ok && c && c.wrongs && c.wrongs[r.n] ? c.wrongs[r.n] + ' ' : '';
    const q = c ? c.calc : '₦50,000 earns 10% simple interest a year. How much interest after 2 years?';
    return Object.assign(fl, {
      kicker: L.title + ' · Calculate', q, pre: kobo ? 'k' : '₦', hasRows: !c, val: this.state.v, empty: String(!String(this.state.v).trim()),
      fieldBd: this.state.v ? '2px solid #10B981' : '1px solid #D5D9E0', ctaBg: String(this.state.v).trim() ? '#0B192C' : '#9AA3B2',
      onVal: (e) => { const d = e.target.value.replace(/[^0-9]/g, ''); this.setState({ v: d ? Number(d).toLocaleString('en-NG') : '' }); },
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.check(); } },
      zeros: () => this.setState({ v: Number((this.num() || 0) + '000').toLocaleString('en-NG') }), clear: () => this.setState({ v: '' }),
      hint: (c && c.hint) || 'Interest each year is 10% of ₦50,000. Then multiply by the number of years.', showHint: this.state.hint && !r, hintOpen: String(this.state.hint), toggleHint: () => this.setState({ hint: !this.state.hint }),
      check: (e) => { e.preventDefault(); this.check(); },
      answered: !!r, iconBg: ok ? '#DDF3E6' : '#FCEDEB', tone: ok ? '#10B981' : '#B9473F', icon: ok ? '✓' : '×',
      title: ok ? 'Correct' : 'Not quite', sub: ok ? 'Question ' + fl.n + ' of ' + fl.total : 'The right answer is ' + fmt(ans),
      why: (ok ? '' : wrongWhy) + ((c && c.calcRight) || '') + (c && c.calcNote ? ' ' + c.calcNote : ''),
      askTitle: 'Ask Finvora to explain this sum', askQ: encodeURIComponent(q),
      cta: ok ? 'Continue' : 'Got it, continue', ctaHref: r ? fl.next : '#'
    });
  }
}
</script>
</body>
</html>

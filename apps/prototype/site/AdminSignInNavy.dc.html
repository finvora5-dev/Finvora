/></svg></span><h1 style="margin: 6px 0 0; font-size: 24px; font-weight: 600">Finvora admin</h1><p style="margin: 0; font-size: 14px; color: #5B6577">Staff only. Sign in with your work email and authenticator code.</p><label style="font-size: 13px; font-weight: 500">Work email<input id="em" type="email" autocapitalize="none" autocorrect="off" enterkeyhint="next" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="name@finvora.ng" value="{{em}}" onInput="{{onEm}}" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #D5D9E0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px"></label><label style="font-size: 13px; font-weight: 500">Authenticator code<input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" enterkeyhint="go" placeholder="6 digits" value="{{cd}}" onInput="{{onCd}}" onKeyDown="{{key}}" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #D5D9E0; border-radius: 10px; padding: 0 12px; font: inherit; font-family: 'Geist Mono', monospace; font-size: 16px"></label><sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; font-size: 14px; color: #B9473F">{{err}}</p></sc-if><a href="#" onClick="{{go}}" style="height: 44px; padding: 0 18px; border-radius: 10px; color: #FFFFFF; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; background-color: #0B192C">Sign in</a></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
/* navy-admin */
  constructor(p) { super(p); this.state = { em: '', cd: '', err: '' }; }
  componentDidMount() { if (window.FV && window.FV.ADMIN.staff()) location.replace('AdminOverviewNavy.dc.html'); }
  renderVals() {
    const go = (e) => { if (e) e.preventDefault(); const A = window.FV && window.FV.ADMIN; if (!A) return;
      const r = A.signIn(this.state.em, this.state.cd.replace(/\s/g, ''));
      if (r === 'ok') { location.href = 'AdminOverviewNavy.dc.html'; return; }
      const left = A.triesLeft();
      this.setState({ cd: '', err: r === 'domain' ? 'Use your @finvora.ng work email.' : r === 'short' ? 'Enter the 6 digits from your authenticator app.' : r === 'locked' ? 'Too many wrong codes. Try again in 15 minutes.' : "That code isn't right. " + left + (left === 1 ? ' try' : ' tries') + ' left.' }); };
    return { em: this.state.em, cd: this.state.cd, err: this.state.err, hasErr: !!this.state.err,
      onEm: (e) => this.setState({ em: e.target.value, err: '' }), onCd: (e) => this.setState({ cd: e.target.value.replace(/\D/g, '').slice(0, 6), err: '' }),
      key: (e) => { if (e.key === 'Enter') go(e); }, go };
  }
}
</script>

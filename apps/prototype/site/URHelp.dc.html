<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.root{background:#FFFFFF;color:#0E0B14;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:#4C1D95}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #5B21B6;outline-offset:2px}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em;margin:0}
.card{background:#FFFFFF;border:1.5px solid #E7E2F0;box-shadow:0 3px 0 #E7E2F0;border-radius:20px;box-sizing:border-box}
.muted{color:#615A6E}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.btn{width:100%;height:54px;border:0;border-radius:16px;background:#5B21B6;color:#FFFFFF;font:700 16px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;box-shadow:0 3px 0 #3B0F7A;box-sizing:border-box}
.btn-w{background:#FFFFFF;color:#4C1D95;box-shadow:0 3px 0 #E7E2F0;border:1.5px solid #E7E2F0}
.btn-g{background:#16884A;box-shadow:0 3px 0 #0F6B39}
.btn-off{background:#E7E2F0;color:#615A6E;box-shadow:none;cursor:not-allowed}
.btn:active,.press:active{transform:translateY(2px)}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #E7E2F0;background:#FFFFFF;color:#0E0B14;display:inline-flex;align-items:center;gap:6px;font:600 14px 'Plus Jakarta Sans',sans-serif;text-decoration:none;box-sizing:border-box;cursor:pointer}
.chip-on{background:#5B21B6;border-color:#5B21B6;color:#FFFFFF}
.tile{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:44px;text-decoration:none;color:#0E0B14}
.li+.li{border-top:1px solid #E7E2F0}
.bar{height:8px;border-radius:999px;background:#E7E2F0;overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:#5B21B6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field{height:54px;border-radius:14px;border:1.5px solid #E7E2F0;background:#FFFFFF;padding:0 14px;font:500 16px 'Plus Jakarta Sans',sans-serif;color:#0E0B14;box-sizing:border-box;width:100%}
@keyframes p-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes p-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes p-flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.05,1.1) rotate(-3deg)}60%{transform:scale(.97,1.03) rotate(2deg)}}
@keyframes p-fill{from{width:0}}
@keyframes p-burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}}
@keyframes p-dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
.btn,.press,.chip{transition:transform .15s ease-out}
.in{animation:p-in .3s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:p-pop .4s cubic-bezier(.2,.8,.2,1) both}
.flick{animation:p-flick 1.8s ease-in-out infinite;transform-origin:50% 90%}
.fill{animation:p-fill .6s ease-out .2s both}
.bit{animation:p-burst .9s cubic-bezier(.15,.7,.3,1) .15s both}
.dot{animation:p-dots 1.2s ease-in-out infinite}
}
</style>
<style>
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.sw{width:46px;height:28px;flex:none;border-radius:999px;border:0;padding:3px;display:flex;box-sizing:border-box}
.sw span{width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sk{background:#DCE6F5;border-radius:10px}
@keyframes m-sh{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
@media (prefers-reduced-motion:no-preference){.sk{animation:m-sh 1.4s ease-in-out infinite}}
.toast{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(16,30,70,.16)}
.btn-r{background:#D92B2B;color:#FFFFFF;box-shadow:0 3px 0 #A51D1D}
</style>
</helmet>
<div class="root" style="width: 390px; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; position: relative">
  <header style="padding: 12px 16px 0; display: flex; align-items: center; gap: 8px"><a href="UPSettings.dc.html" class="press" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="#0E0B14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></a><h1 style="font-size: 22px">Help and support</h1></header>
  <main style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <label style="height: 50px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #E7E2F0; display: flex; align-items: center; gap: 10px; padding: 0 14px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4" fill="none" stroke="#615A6E" stroke-width="2" stroke-linecap="round"></path></svg><span class="sr">Search help</span><input type="search" value="{{q}}" onInput="{{onQ}}" placeholder="Search help" style="flex: 1; border: 0; outline: none; font: 500 16px 'Plus Jakarta Sans', sans-serif; background: transparent"></label>
    <h2 style="font-size: 17px">Common questions</h2>
    <div class="card" style="overflow: hidden"><sc-for list="{{faqs}}" as="q" hint-placeholder-count="5"><button type="button" class="li press" aria-expanded="{{q.open}}" onClick="{{q.tap}}" style="width: 100%; border: 0; background: transparent; text-align: left; font: inherit; cursor: pointer"><span style="flex: 1; font-weight: 600">{{q.q}}</span><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="#8E879A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><sc-if value="{{q.open}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 0 16px 14px; font-size: 15px; line-height: 1.5; color: #38323F">{{q.a}}</p></sc-if></sc-for></div>
    <h2 style="font-size: 17px">Still need help?</h2>
    <div class="card" style="overflow: hidden"><a href="mailto:help@finvora.app" class="li press"><span style="flex: 1"><strong style="display: block">Email us</strong><span class="muted" style="font-size: 13px">help@finvora.app · reply within 1 working day</span></span><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="#8E879A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a><a href="UFReport.dc.html" class="li press"><span style="flex: 1"><strong style="display: block">Report a problem</strong><span class="muted" style="font-size: 13px">Something not working? Tell us</span></span><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="#8E879A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a></div>
  </main>
  <div style="margin-top: auto"><nav aria-label="Main" style="position: sticky; bottom: 0; z-index: 10; width: 390px; box-sizing: border-box; padding: 8px 12px 16px; background: linear-gradient(rgba(255,255,255,0), #FFFFFF 40%)">
  <div style="height: 64px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E2F0; box-shadow: 0 8px 24px rgba(16,30,70,.12); display: flex; align-items: center; justify-content: space-around; padding: 0 4px">
    <a href="UOHome.dc.html" class="press" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; border-radius: 16px; font-size: 11px; font-weight: 600; color: #615A6E"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="#615A6E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Home</a>
    <a href="UPJourney.dc.html" class="press" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; border-radius: 16px; font-size: 11px; font-weight: 600; color: #615A6E"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4-9 4z M7 10v5c2.5 2 7.5 2 10 0v-5 M21 8v6" fill="none" stroke="#615A6E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Learn</a>
    <a href="UPLibrary.dc.html" class="press" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; border-radius: 16px; font-size: 11px; font-weight: 600; color: #615A6E"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z M5 16a4 4 0 0 1 4-4h10" fill="none" stroke="#615A6E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Library</a>
    <a href="UPMarkets.dc.html" class="press" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; border-radius: 16px; font-size: 11px; font-weight: 600; color: #615A6E"><span style="width: 44px; height: 28px; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="#615A6E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Markets</a>
    <a href="UPMe.dc.html" aria-current="page" class="press" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; border-radius: 16px; font-size: 11px; font-weight: 700; color: #4C1D95"><span style="width: 44px; height: 28px; border-radius: 999px; background: #5B21B6; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #3B0F7A"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Me</a>
  </div>
</nav></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  F() { return window.FV; }
  name() { const a = this.F().AUTH.get(); return a.name || 'You'; }
  constructor(p) { super(p); this.state = { open: -1, q: '' }; }
  renderVals() {
    const Q = [['Is Finvora free?', 'Yes. Lessons, the Library, the simulator and 5 Ask Fin questions a day are free. Plus adds every world, unlimited Ask Fin and more.'],
      ['Does Finvora tell me what to buy?', 'No. Finvora explains how money and markets work. It never tells you what to buy or sell.'],
      ['How do I cancel Plus?', 'Go to Me, then Your plan, then Cancel Plus. Plus stays on until the end of the period you paid for.'],
      ['Is the simulator real money?', 'No. The simulator uses virtual naira and made-up companies, so nothing you do there costs real money.'],
      ["I didn't get my sign-in code", 'Check your spam folder, wait a minute, then tap Resend code. Codes last 10 minutes.']];
    const t = this.state.q.trim().toLowerCase();
    return { q: this.state.q, onQ: (e) => this.setState({ q: e.target.value, open: -1 }),
      faqs: Q.map((x, i) => ({ q: x[0], a: x[1], i })).filter((x) => !t || (x.q + ' ' + x.a).toLowerCase().includes(t)).map((x) => ({ q: x.q, a: x.a, open: this.state.open === x.i, tap: () => this.setState({ open: this.state.open === x.i ? -1 : x.i }) })) };
  }
}
</script>
</body>
</html>

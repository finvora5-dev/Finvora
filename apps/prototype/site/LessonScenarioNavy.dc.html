<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson scenario</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="only light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; ">
<div style="padding: 10px 24px 0 12px; display: flex; align-items: center; gap: 12px; flex: none"><a href="LearnNavy.dc.html" aria-label="Close lesson" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; height: 4px; border-radius: 999px; background: #E2E5EA; overflow: hidden"><span style="display: block; width: {{barW}}; height: 100%; background: #10B981"></span></span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B6577">{{barL}}</span></div><span style="padding: 24px 24px 0; font-size: 12px; font-weight: 600; color: #5B6577; text-transform: uppercase; letter-spacing: .06em; display: block">{{kicker}}</span><div style="padding: 16px; border: 1px solid #E5E7EB; border-radius: 16px; margin: 14px 24px 0; background: #EEF0F3; border: 0"><span style="font-size: 12px; color: #5B6577">{{who}}</span><p style="margin: 4px 0 0; font-size: 15px; line-height: 1.55">{{say}}</p></div><div style="padding: 18px 24px 0; flex: none"><h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2">{{q}}</h1></div><div role="radiogroup" aria-label="Answer" style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 10px; flex: none"><sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 12px; border: {{o.bd}}; background: {{o.bg}}; font: inherit; font-size: 15px; text-align: left; color: #0B192C; cursor: pointer"><span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #5B6577; width: 16px">{{o.l}}</span><span style="flex: 1">{{o.t}}</span><sc-if value="{{o.isRight}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; color: #047857">Correct</span></sc-if></button></sc-for></div><sc-if value="{{answered}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; background: rgba(17,28,45,.45)" aria-hidden="true"></div>
    <section role="dialog" aria-modal="true" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 32px rgba(17,28,45,.18)">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D5D9E0"></span>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 999px; background: {{iconBg}}; color: {{tone}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">{{icon}}</span><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 20px; font-weight: 600; color: {{tone}}">{{title}}</strong><span style="font-size: 13px; color: #5B6577">{{sub}}</span></span></div>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #334155">{{why}}</p>
      
      <a href="AskFinvoraNavy.dc.html?q={{askQ}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #E5E7EB; text-decoration: none; color: #0B192C"><span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: #0B192C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{askTitle}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="{{ctaHref}}" style="height: 54px; border-radius: 14px; background: {{ctaBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
    </section></sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-steps */  drawnStep = 5;
  F() { return window.FV; }
  inL() { return !!(window.FV && window.FV.inLesson() && /[?&]in=1/.test(location.search)); }
  L() { return this.F() ? this.F().lesson() : { title: '', c: null }; }
  flow(kind, drawnNext) {
    const F = this.F();
    if (!F || !this.inL()) return { fText: '', bars: [0, 1, 2, 3, 4].map((i) => ({ c: i < this.drawnStep - 1 ? '#10B981' : i === this.drawnStep - 1 ? '#0B192C' : '#E2E5EA' })), next: drawnNext, n: this.drawnStep, total: 5 };
    const v = F.flowVals(kind), n = +v.fN, t = +v.fTotal;
    return { fText: v.fText, next: v.nextHref, n, total: t, bars: Array.from({ length: t }, (_, i) => ({ c: i < n - 1 ? '#10B981' : i === n - 1 ? '#0B192C' : '#E2E5EA' })) };
  }
  constructor(p) { super(p); this.state = { g: null }; }
  data() {
    const L = this.L(), c = this.inL() && L.c && L.c.scenario;
    if (c) { const who = (c.q.match(/\b(Ada|Bisi|Amaka|Bimpe|Tunde|Tolu|Chioma)\b/) || [])[1] || ''; return { q: c.q, say: c.say.join(''), who, opts: c.opts.map((o) => ({ t: o.rate + ': ' + o.access.charAt(0).toLowerCase() + o.access.slice(1), right: !!o.right, why: o.why })), note: c.note || '', title: L.title }; }
    return { q: 'What is the best first step?', say: 'I earn ₦180,000 a month. My generator broke and the repair is ₦90,000. I have ₦40,000 saved.', who: 'Tolu', opts: [{ t: 'Borrow from a loan app', why: 'Loan apps charge very high interest.' }, { t: 'Use savings, cover the rest from this month, then rebuild', right: true, why: "Using savings first avoids high-interest debt. Cover the rest from this month's pay, then rebuild the fund a little each month." }, { t: 'Skip rent this month', why: 'Missing rent can cost you your home.' }], note: '', title: 'Emergency funds' };
  }
  renderVals() {
    const d = this.data(), fl = this.flow('scenario', 'LessonDoneNavy.dc.html'), g = this.state.g, done = g !== null, R = d.opts.findIndex((o) => o.right), ok = g === R;
    return Object.assign(fl, { barW: Math.round(fl.n / fl.total * 100) + '%', barL: fl.n + '/' + fl.total, kicker: d.title + ' · Scenario', who: d.who, say: d.say, q: d.q,
      opts: d.opts.map((o, i) => ({ l: 'ABCD'[i], t: o.t, on: String(g === i), isRight: done && i === R,
        bd: done && i === R ? '1.5px solid #10B981' : g === i ? '1.5px solid #B9473F' : '1px solid #D5D9E0', bg: done && i === R ? '#DDF3E6' : g === i ? '#FCEFED' : '#FFFFFF',
        pick: () => { if (done) return; if (this.F() && this.inL()) this.F().answer('scenario', i === R, i); this.setState({ g: i }); } })),
      answered: done, iconBg: ok ? '#DDF3E6' : '#FCEDEB', tone: ok ? '#10B981' : '#B9473F', icon: ok ? '✓' : '×',
      title: ok ? 'Correct' : 'Not quite', sub: 'Question ' + fl.n + ' of ' + fl.total,
      why: done ? (ok ? d.opts[R].why : d.opts[g].why + ' ' + d.opts[R].why) + (d.note ? ' ' + d.note : '') : '',
      askTitle: 'Ask Finvora about this choice', askQ: encodeURIComponent(d.q),
      cta: ok ? 'Continue' : 'Got it, continue', ctaHref: done ? fl.next : '#', ctaBg: '#0B192C' });
  }
}
</script>
</body>
</html>

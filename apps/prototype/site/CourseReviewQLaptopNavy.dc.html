<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
/* navy-review */
  Q = [{"l": "What money does", "id": "money", "q": "Bisi keeps ₦10,000 in a savings box for next month. Which job is her money doing?", "o": ["Paying for things", "Comparing prices", "Keeping value for later", "Measuring kobo"], "r": 2, "why": "Putting money aside to use later is money keeping value."}, {"l": "What money does", "id": "money", "q": "How many kobo are in ₦25?", "o": ["25", "250", "2,500", "25,000"], "r": 2, "why": "₦1 is 100 kobo, so ₦25 × 100 = 2,500 kobo."}, {"l": "Income and expenses", "id": "income", "q": "Tunde earns ₦120,000 a month and spends ₦95,000. How much is left over?", "o": ["₦215,000", "₦25,000", "₦95,000", "₦12,000"], "r": 1, "why": "Income minus expenses is what you can save: ₦120,000 − ₦95,000 = ₦25,000."}, {"l": "Inflation", "id": "inflation", "q": "Inflation is 20%. What does ₦100,000 buy next year, in today's prices?", "o": ["About ₦120,000", "About ₦100,000", "About ₦83,000", "About ₦80,000"], "r": 2, "why": "Prices are 20% higher, so ₦100,000 buys what about ₦83,000 buys today (₦100,000 ÷ 1.2)."}, {"l": "Budgeting", "id": "budget", "q": "Ada earns ₦200,000 a month. Using 50/30/20, how much goes to savings?", "o": ["₦20,000", "₦40,000", "₦60,000", "₦100,000"], "r": 1, "why": "Savings are the 20% part: 20% of ₦200,000 is ₦40,000."}, {"l": "Budgeting", "id": "budget", "q": "Using 50/30/20, which of these is a want?", "o": ["Rent", "Electricity bill", "Weekend suya with friends", "School fees"], "r": 2, "why": "It's nice to have but not essential."}, {"l": "Simple and compound interest", "id": "interest", "q": "₦100,000 earns 10% a year, compounded yearly. How much is it after 2 years?", "o": ["₦120,000", "₦121,000", "₦110,000", "₦200,000"], "r": 1, "why": "Year 1 gives ₦110,000, and year 2 adds 10% of ₦110,000 to make ₦121,000."}, {"l": "Emergency funds", "id": "emergency", "q": "Your costs are ₦60,000 a month. How much is 3 months of emergency savings?", "o": ["₦60,000", "₦120,000", "₦180,000", "₦360,000"], "r": 2, "why": "₦60,000 × 3 = ₦180,000. Many people aim for 3 to 6 months of costs, built up a little at a time."}];
  st() { try { return JSON.parse(localStorage.getItem('fv.review.v1') || 'null') || {}; } catch (e) { return {}; } }
  put(o) { try { localStorage.setItem('fv.review.v1', JSON.stringify(Object.assign(this.st(), o))); } catch (e) {} }
  constructor(p) { super(p); const r = this.st().run; this.state = { run: r && r.i < 8 ? r : { i: 0, right: 0, missed: [] }, pick: null, res: null }; }
  _phoneVals() {
    const run = this.state.run, q = this.Q[run.i], p = this.state.pick, r = this.state.res, ok = !!(r && r.ok), last = run.i === 7;
    const money = q.o.every((t) => /₦|^\d/.test(t));
    return { n: String(run.i + 1), lesson: q.l, q: q.q, bars: this.Q.map((_, i) => ({ c: i < run.i ? '#10B981' : i === run.i ? '#0B192C' : '#E2E5EA' })),
      opts: q.o.map((t, i) => ({ t, on: String(p === i), font: money ? "'Geist Mono', monospace" : "'Geist', system-ui, sans-serif",
        bd: r && i === q.r ? '2px solid #10B981' : r && p === i ? '2px solid #B9473F' : p === i ? '2px solid #0B192C' : '1px solid #D5D9E0', bg: r && i === q.r ? '#EAF6EF' : r && p === i ? '#FCEFED' : '#FFFFFF',
        dot: p === i ? '6px solid #0B192C' : '1.5px solid #C0C6D0', pick: () => { if (!r) this.setState({ pick: i }); } })),
      noPick: String(p === null), ctaBg: p === null ? '#334155' : '#0B192C', op: p === null ? '.4' : '1',
      check: (e) => { e.preventDefault(); if (p === null || r) return; this.setState({ res: { ok: p === q.r } }); },
      answered: !!r, iconBg: ok ? '#DDF3E6' : '#FCEDEB', tone: ok ? '#047857' : '#B9473F', icon: ok ? '✓' : '×',
      title: ok ? 'Correct' : 'Not quite', sub: ok ? 'Question ' + (run.i + 1) + ' of 8' : 'The right answer is ' + q.o[q.r], why: q.why,
      askTitle: 'Ask Finvora to explain this', askQ: encodeURIComponent(q.q), cta: last ? 'See my score' : ok ? 'Continue' : 'Got it, continue', ctaHref: '#',
      next: (e) => { e.preventDefault(); const nr = { i: run.i + 1, right: run.right + (ok ? 1 : 0), missed: ok ? run.missed : run.missed.concat([run.i]) };
        if (last) { const best = Math.max(this.st().best || 0, nr.right); this.put({ run: null, last: nr, best }); location.href = 'CourseReviewDoneNavy.dc.html'; return; }
        this.put({ run: nr }); this.setState({ run: nr, pick: null, res: null }); window.scrollTo(0, 0); } };
  }
  renderVals() { const v = this._phoneVals() || {}, n = +(v.n || v.fN || 0), t = +(v.total || v.fTotal || 0);
    return Object.assign(v, { lapPct: t ? Math.round(n / t * 100) + '%' : '0%', lapN: t ? n + '/' + t : '' }); }
}

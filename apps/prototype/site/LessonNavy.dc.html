<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson question</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 10px 20px 0 10px; display: flex; align-items: center; gap: 10px; flex: none"><a href="LearnNavy.dc.html" aria-label="Close lesson" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; display: flex; gap: 5px" role="img" aria-label="{{fText}}"><sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 5px; border-radius: 999px; background: {{b.c}}"></span></sc-for></span></div>
  <div style="padding: 20px 24px 0; flex: none">
    <span style="font-size: 13px; color: #5B6577">{{kicker}}</span>
    <h1 style="margin: 6px 0 0; font-size: 23px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3">{{q}}</h1>
    <sc-if value="{{canHint}}" hint-placeholder-val="{{ false }}"><button onClick="{{toggleHint}}" style="margin-top: 10px; min-height: 36px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #047857; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>{{hintLabel}}</button></sc-if>
    <sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}"><p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #334155">{{hint}}</p></sc-if>
  </div>
  <div role="radiogroup" aria-label="Answer" style="padding: 18px 24px 0; display: flex; flex-direction: column; gap: 10px; flex: none">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
      <button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 14px; border: {{o.bd}}; background: {{o.bg}}; font: inherit; text-align: left; cursor: pointer; color: #0B192C">
        <span style="display: flex; align-items: center; gap: 12px; width: 100%"><span style="flex: 1; font-family: {{o.font}}; font-size: 17px">{{o.t}}</span><span style="width: 24px; height: 24px; border-radius: 999px; border: {{o.dot}}; background: {{o.dotBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-sizing: border-box">{{o.mark}}</span></span>
        <sc-if value="{{o.hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; line-height: 1.5; color: {{o.noteC}}">{{o.note}}</span></sc-if>
      </button>
    </sc-for>
  </div>
  <div style="margin-top: auto; padding: 16px 24px 26px; flex: none">
    <a href="{{ctaHref}}" style="height: 54px; border-radius: 14px; background: {{ctaBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
  </div>
  <sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17,28,45,.45)" aria-hidden="true"></div>
    <section role="dialog" aria-modal="true" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 32px rgba(17,28,45,.18)">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D5D9E0"></span>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 999px; background: {{iconBg}}; color: {{tone}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">{{icon}}</span><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 20px; font-weight: 600; color: {{tone}}">{{title}}</strong><span style="font-size: 13px; color: #5B6577">{{sub}}</span></span></div>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #334155">{{why}}</p>
      
      <a href="AskFinvoraNavy.dc.html?q={{askQ}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #E5E7EB; text-decoration: none; color: #0B192C"><span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: #0B192C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{askTitle}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="{{ctaHref}}" style="height: 54px; border-radius: 14px; background: {{ctaBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["unanswered","correct","wrong"],"default":"unanswered"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-lessons */  F() { return window.FV; }
  L() { return this.F() ? this.F().lesson() : { title: '', c: null, index: 0 }; }
  flow(kind) {
    const F = this.F(); if (!F) return { fText: '', bars: [], next: 'LessonDoneNavy.dc.html', n: 1, total: 1 };
    const v = F.flowVals(kind), n = +v.fN, t = +v.fTotal;
    return { fText: v.fText, next: v.nextHref, n, total: t, bars: Array.from({ length: t }, (_, i) => ({ c: i < n - 1 ? '#10B981' : i === n - 1 ? '#0B192C' : '#E2E5EA' })) };
  }
  constructor(p) { super(p); this.state = { g: null, hint: false }; }
  renderVals() {
    const L = this.L(), c = L.c, fl = this.flow('choice');
    const O = c ? c.opts.map((o) => o[0]) : ['₦25,000', '₦50,000', '₦75,000', '₦125,000'], R = c ? c.right : 1;
    const why = c ? c.opts.map((o) => o[1]) : ['', '', 'This is 30%, the share for wants, not savings.', ''];
    const g = this.state.g, done = g !== null, ok = g === R, money = O.every((t) => /^₦/.test(t));
    const pick = (i) => { if (done) return; if (this.F()) this.F().answer('choice', i === R, i); this.setState({ g: i }); };
    const q = c ? c.q : 'Ada earns ₦250,000 a month. Using the 50/30/20 rule, how much should she save?';
    return Object.assign(fl, {
      kicker: L.title + ' · Question ' + fl.n + ' of ' + fl.total, q, hint: (c && c.hint0) || '',
      opts: O.map((t, i) => {
        const right = done && i === R, wrong = g === i && !ok;
        return { t, on: String(g === i), pick: () => pick(i), font: money ? "'Geist Mono', monospace" : "'Geist', system-ui, sans-serif",
          bd: right ? '2px solid #10B981' : wrong ? '2px solid #B9473F' : '1px solid #D5D9E0',
          bg: right ? '#EAF6EF' : wrong ? '#FCEFED' : '#FFFFFF',
          dot: right || wrong ? '0' : '1.5px solid #C0C6D0', dotBg: right ? '#10B981' : wrong ? '#B9473F' : 'transparent',
          mark: right ? '✓' : wrong ? '×' : '', hasNote: false, note: '', noteC: '#334155' };
      }),
      answered: done, canHint: !done && !!(c && c.hint0), showHint: this.state.hint && !done,
      hintLabel: this.state.hint ? 'Hide hint' : 'Need a hint?', toggleHint: () => this.setState({ hint: !this.state.hint }),
      askTitle: 'Ask Finvora why ' + O[R] + ' is right', askQ: encodeURIComponent(q),
      iconBg: ok ? '#DDF3E6' : '#FCEDEB', tone: ok ? '#10B981' : '#B9473F', icon: ok ? '✓' : '×',
      title: ok ? 'Correct' : 'Not quite', sub: ok ? 'Question ' + fl.n + ' of ' + fl.total : 'The right answer is ' + O[R],
      why: ok ? (c ? c.rightText : '') : ((why[g] || '') + ' ' + (c ? c.rightText : '')).trim(),
      cta: ok ? 'Continue' : 'Got it, continue', ctaBg: '#0B192C', ctaHref: done ? fl.next : '#'
    });
  }
}
</script>
</body>
</html>

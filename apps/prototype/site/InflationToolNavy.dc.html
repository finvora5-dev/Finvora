<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inflation calculator</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="only light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; ">
<div style="padding: 10px 16px 0 8px; display: flex; align-items: center; gap: 4px; flex: none"><a href="LearnNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Inflation calculator</h1></div><p style="margin: 8px 24px 0; font-size: 14px; line-height: 1.6; color: #334155; flex: none">See what money is worth after inflation. Rates are illustrative.</p><div style="padding: 18px 24px 0; display: flex; flex-direction: column; gap: 14px"><label style="font-size: 13px; font-weight: 500">Amount<span style="margin-top: 6px; height: 50px; border: 1px solid #D5D9E0; border-radius: 12px; display: flex; align-items: center; padding: 0 14px; font-family: 'Geist Mono', monospace; font-size: 18px">₦<input inputmode="numeric" aria-label="Amount" value="{{amt}}" onInput="{{onAmt}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 18px; color: #0B192C"></span></label><label style="font-size: 13px; font-weight: 500">Inflation a year<span style="margin-top: 6px; height: 50px; border: 1px solid #D5D9E0; border-radius: 12px; display: flex; align-items: center; padding: 0 14px; font-family: 'Geist Mono', monospace; font-size: 18px"><input inputmode="decimal" aria-label="Inflation a year, percent" value="{{rate}}" onInput="{{onRate}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 18px; color: #0B192C">%</span></label><label style="font-size: 13px; font-weight: 500">Years<span role="radiogroup" aria-label="Years" style="margin-top: 10px; display: flex; gap: 6px"><sc-for list="{{yrs}}" as="y" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{y.on}}" onClick="{{y.pick}}" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid {{y.bd}}; background: {{y.bg}}; color: {{y.fg}}; display: flex; align-items: center; justify-content: center; font: inherit; font-size: 14px; cursor: pointer">{{y.n}}</button></sc-for></span></label></div><div style="padding: 18px; border: 1px solid #E5E7EB; border-radius: 16px; margin: 20px 24px 0; background: #EEF0F3; border: 0"><span style="font-size: 13px; color: #5B6577">{{lbl}}</span><div style="margin-top: 4px; font-family: 'Geist Mono', monospace; font-size: 30px; font-weight: 500">{{res}}</div><span style="font-size: 13px; color: #B9473F">{{tail}}</span></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-markets */
  constructor(p) { super(p); this.state = { amt: '100,000', rate: '25', y: 3 }; }
  renderVals() {
    const a = +String(this.state.amt).replace(/[^0-9]/g, '') || 0, r = Math.max(0, +this.state.rate || 0), y = this.state.y;
    const val = Math.round(a / Math.pow(1 + r / 100, y)), loss = a ? (1 - val / a) * 100 : 0, f = (x) => '₦' + x.toLocaleString('en-NG');
    return { amt: this.state.amt, rate: this.state.rate, onAmt: (e) => { const d = e.target.value.replace(/[^0-9]/g, ''); this.setState({ amt: d ? Number(d).toLocaleString('en-NG') : '' }); }, onRate: (e) => this.setState({ rate: e.target.value.replace(/[^0-9.]/g, '').slice(0, 5) }),
      yrs: [1, 3, 5, 10].map((n) => ({ n: String(n), on: String(n === y), bd: n === y ? '#0B192C' : '#E5E7EB', bg: n === y ? '#0B192C' : '#FFFFFF', fg: n === y ? '#FFFFFF' : '#0B192C', pick: () => this.setState({ y: n }) })),
      lbl: 'In ' + y + (y === 1 ? ' year ' : ' years ') + f(a) + ' buys what', res: f(val), tail: 'buys today. It loses ' + loss.toFixed(1) + '% of its value.' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding goal (laptop)</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finvora"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; overflow: hidden">
  
  <main style="flex: 1; min-width: 0; padding: 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B6577">2/3</span><h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.02em">What interests you most?</h1><p style="margin: 0; font-size: 16px; color: #5B6577">We will tailor your home screen. You can change this anytime.</p><div style="display: grid; grid-template-columns: repeat(3, 260px); gap: 14px; margin-top: 8px"><button type="button" role="radio" aria-checked="{{on0}}" onClick="{{pick0}}" style="cursor: pointer; text-align: left; padding: 20px; border-radius: 14px; border: {{bd0}}; background: {{bg0}}; font: inherit; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 17px; font-weight: 600">Money basics</strong><span style="font-size: 14px; color: #5B6577">Budgeting, saving and inflation</span></button><button type="button" role="radio" aria-checked="{{on1}}" onClick="{{pick1}}" style="cursor: pointer; text-align: left; padding: 20px; border-radius: 14px; border: {{bd1}}; background: {{bg1}}; font: inherit; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 17px; font-weight: 600">Investing</strong><span style="font-size: 14px; color: #5B6577">Shares, risk and returns</span></button><button type="button" role="radio" aria-checked="{{on2}}" onClick="{{pick2}}" style="cursor: pointer; text-align: left; padding: 20px; border-radius: 14px; border: {{bd2}}; background: {{bg2}}; font: inherit; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 17px; font-weight: 600">Nigerian market</strong><span style="font-size: 14px; color: #5B6577">Companies and prices on the NGX</span></button></div><a href="{{next}}" onClick="{{save}}" style="height: 44px; padding: 0 18px; border-radius: 10px; background: #0B192C; color: #FFFFFF; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; width: 220px; margin-top: 10px">Continue</a></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
/* navy-laptop */
  constructor(p) { super(p); const g = window.FV ? window.FV.AUTH.get().goal : null, i = ['Money basics', 'Investing', 'Nigerian market'].indexOf(g); this.state = { g: i < 0 ? 1 : i }; }
  renderVals() { const T = ['Money basics', 'Investing', 'Nigerian market'], v = { next: window.FV ? window.FV.AUTH.onboardNext() : 'HomeNavy.dc.html', save: () => { if (window.FV) window.FV.AUTH.setGoal(T[this.state.g]); } };
    T.forEach((t, k) => { const on = this.state.g === k; v['on' + k] = String(on); v['bd' + k] = on ? '1.5px solid #0B192C' : '1px solid #D5D9E0'; v['bg' + k] = on ? '#EEF0F3' : '#FFFFFF'; v['pick' + k] = () => this.setState({ g: k }); }); return v; }
}
</script>
</body>
</html>

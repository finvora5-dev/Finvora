<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finvora (purple and black): Real-life scenario</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a:focus-visible,button:focus-visible{outline:3px solid #5B21B6;outline-offset:2px}
.btn{width:100%;height:54px;border:0;border-radius:16px;font:700 16px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;box-sizing:border-box}
.b-blue{background:#5B21B6;color:#FFFFFF;box-shadow:0 3px 0 #3B0F7A}
.b-green{background:#16884A;color:#FFFFFF;box-shadow:0 3px 0 #0F6B39}
.b-off{background:#E7E2F0;color:#615A6E;cursor:not-allowed}
.btn:active,.press:active{transform:translateY(2px)}
.opt{width:100%;min-height:64px;box-sizing:border-box;padding:0 16px;border-radius:16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.num{font-variant-numeric:tabular-nums}
@keyframes c-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes c-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes c-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes c-pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes c-fill{from{width:var(--from)}}
@media (prefers-reduced-motion:no-preference){
.btn,.press,.opt{transition:transform .15s ease-out,background-color .15s ease-out,border-color .15s ease-out}
.in{animation:c-in .3s cubic-bezier(.2,.8,.2,1) both}
.sheet{animation:c-up .26s cubic-bezier(.2,.8,.2,1)}
.shake{animation:c-shake .3s ease-out}
.pop{animation:c-pop .3s ease-out}
.fill{animation:c-fill .5s ease-out both}
}
</style>
</helmet>
<div style="width: 390px; min-height: 900px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; color: #0E0B14; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="padding: 12px 16px 0; display: flex; align-items: center; gap: 12px">
    <a href="UPJourney.dc.html" class="press" aria-label="Close lesson and return to the journey" style="width: 44px; height: 44px; flex: none; margin-left: -10px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#615A6E" stroke-width="2.4" stroke-linecap="round"></path></svg></a>
    <div role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3" style="flex: 1; height: 8px; border-radius: 999px; background: #E7E2F0; overflow: hidden"><div style="width: 100%; height: 100%; border-radius: 999px; background: #5B21B6"></div></div>
    <span style="font-size: 14px; font-weight: 700; color: #615A6E">3/3</span>
  </header>

  <main style="padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 18px">
    <span class="in" style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #4C1D95">Real-life scenario</span>
    <h1 id="q" class="in" style="margin: -10px 0 0; font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em">Which savings option should Tolu choose?</h1>

    <div class="in" style="display: flex; align-items: flex-end; gap: 6px; animation-delay: .04s">
      <div style="width: 96px; height: 110px; flex: none"><svg width="96" height="110" viewBox="-48 -70 96 110" role="img" aria-label="Tolu, a fictional saver"><g transform="translate(0 0) rotate(0)">
    <rect x="-20" y="-6" width="40" height="40" rx="16" fill="#0FA394"></rect>
    <circle cx="0" cy="-32" r="19" fill="#1B1210"></circle><rect x="-22" y="-34" width="8" height="30" rx="4" fill="#1B1210"></rect><rect x="14" y="-34" width="8" height="30" rx="4" fill="#1B1210"></rect>
    <circle cx="0" cy="-24" r="17" fill="#8D5524"></circle>
    
    <circle cx="-6" cy="-24" r="2.4" fill="#2B1B12"></circle><circle cx="6" cy="-24" r="2.4" fill="#2B1B12"></circle>
    <path d="M-6 -16 q6 6 12 0" fill="none" stroke="#2B1B12" stroke-width="2.4" stroke-linecap="round"></path>
    
  </g></svg></div>
      <div style="position: relative; flex: 1; background: #FFFFFF; border: 2px solid #E7E2F0; border-radius: 18px; padding: 12px 14px; margin-bottom: 18px; font-size: 16px; line-height: 1.45">
        <span aria-hidden="true" style="position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px; background: #FFFFFF; border-left: 2px solid #E7E2F0; border-bottom: 2px solid #E7E2F0; transform: rotate(45deg)"></span>
        I have <strong class="num">₦200,000</strong>. I need it for a new laptop in <strong>3 months</strong>.
      </div>
    </div>

    <div role="group" aria-labelledby="q" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
        <button type="button" class="opt in {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" aria-label="{{o.aria}}" style="min-height: 196px; padding: 16px 12px 14px; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: 8px; background: {{o.bg}}; border: 2px solid {{o.border}}; box-shadow: 0 4px 0 {{o.edge}}; color: #0E0B14">
          <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: {{o.iconBg}}; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24"><path d="{{o.icon}}" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <span style="font-size: 13px; font-weight: 700; color: #615A6E">{{o.name}}</span>
          <span class="num" style="font-size: 26px; font-weight: 800; line-height: 1">{{o.rate}}</span>
          <span style="font-size: 14px; font-weight: 600; line-height: 1.35">{{o.access}}</span>
          <sc-if value="{{o.hasNote}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 800; color: {{o.fg}}">{{o.note}}</span></sc-if>
        </button>
      </sc-for>
    </div>
    <p class="in" style="margin: 0; font-size: 13px; color: #615A6E">Both options are made up for this lesson. Rates are fixed; tax and fees are ignored.</p>
  </main>
  <div aria-live="polite" style="margin-top: auto; position: sticky; bottom: 0; z-index: 5">
    <sc-if value="{{showCheck}}" hint-placeholder-val="{{false}}">
      <div style="padding: 12px 16px 22px; background: #FFFFFF">
        <button type="button" class="{{checkClass}}" onClick="{{check}}" disabled="{{checkOff}}">Check</button>
      </div>
    </sc-if>
    <sc-if value="{{showWrong}}" hint-placeholder-val="{{true}}">
      <section aria-labelledby="fb-wrong" class="sheet" style="padding: 20px 16px 22px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(16,30,70,.10); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #FFE4E2; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="#B42828" stroke-width="2.8" stroke-linecap="round"></path></svg></span>
          <h2 id="fb-wrong" style="margin: 0; font-size: 19px; font-weight: 700; color: #B42828">Not quite</h2>
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #38323F">{{wrongText}}</p>
        <a href="UPAskKobo.dc.html" style="align-self: flex-start; min-height: 40px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; color: #4C1D95; text-decoration: none">Ask Fin why</a>
        <button type="button" class="btn b-blue" onClick="{{retry}}">Try again</button>
      </section>
    </sc-if>
    <sc-if value="{{showRight}}" hint-placeholder-val="{{false}}">
      <section aria-labelledby="fb-right" class="sheet" style="padding: 20px 16px 22px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(16,30,70,.10); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #DCFAE6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" fill="none" stroke="#16884A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <h2 id="fb-right" style="margin: 0; font-size: 19px; font-weight: 700; color: #0F6B39">Correct</h2>
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #38323F">{{rightText}}</p>
        <a href="UPLessonComplete.dc.html" class="btn b-green">Continue</a>
      </section>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: null, checked: false }; }
  renderVals() {
    const s = this.state;
    const opts = [
      { name: 'Option A', rate: '15% a year', access: 'Locked for 2 years', icon: 'M7 11V8a5 5 0 0 1 10 0v3 M5 11h14v10H5z', col: '#7B4AF0',
        why: 'The rate is higher, but Tolu needs the money in 3 months and Option A locks it for 2 years. Breaking a lock early often means losing interest or paying a penalty.' },
      { name: 'Option B', rate: '8% a year', access: 'Withdraw any time', icon: 'M7 11V8a5 5 0 0 1 9.6-2 M5 11h14v10H5z', col: '#0FA394', right: true,
        explain: 'Tolu can reach her money when the laptop is due. Over 3 months, 8% a year earns roughly ₦4,000 (₦200,000 × 8% × 3 ÷ 12). Match the option to when you need the money, not just the highest rate.' }
    ];
    const picked = s.pick !== null ? opts[s.pick] : null;
    const right = !!(s.checked && picked && picked.right), wrong = !!(s.checked && picked && !picked.right);
    return {
      opts: opts.map((o, i) => {
        const sel = s.pick === i, good = s.checked && sel && o.right, bad = s.checked && sel && !o.right;
        return { name: o.name, rate: o.rate, access: o.access, icon: o.icon, iconBg: o.col,
          pressed: sel ? 'true' : 'false', aria: o.name + ', ' + o.rate + ', ' + o.access + (good ? ', correct' : bad ? ', your answer, not quite' : ''),
          bg: good ? '#DCFAE6' : bad ? '#FFE4E2' : sel ? '#F1EBFB' : '#FFFFFF',
          border: good ? '#12B76A' : bad ? '#F04438' : sel ? '#5B21B6' : '#E7E2F0',
          edge: good ? '#16884A' : bad ? '#F04438' : sel ? '#3B0F7A' : '#E7E2F0',
          cls: good ? 'pop' : bad ? 'shake' : '', hasNote: good || bad, note: good ? 'Correct' : 'Your answer', fg: good ? '#0F6B39' : '#B42828',
          pick: () => this.setState({ pick: i, checked: false }) };
      }),
      showCheck: !s.checked, showWrong: wrong, showRight: right,
      wrongText: wrong ? picked.why : '', rightText: opts[1].explain,
      checkOff: s.pick === null, checkClass: s.pick === null ? 'btn b-off' : 'btn b-blue',
      check: () => { if (s.pick !== null) this.setState({ checked: true }); },
      retry: () => this.setState({ pick: null, checked: false })
    };
  }
}
</script>
</body>
</html>

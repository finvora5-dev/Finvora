<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finvora (purple and black): Adire Foods</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.root{background:#FFFFFF;color:#0E0B14;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:#4C1D95}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #5B21B6;outline-offset:2px}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em;margin:0}
.card{background:#FFFFFF;border:1.5px solid #E7E2F0;box-shadow:0 3px 0 #E7E2F0;border-radius:20px;box-sizing:border-box}
.muted{color:#615A6E}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.btn{width:100%;height:54px;border:0;border-radius:16px;background:#5B21B6;color:#FFFFFF;font:700 16px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;box-shadow:0 3px 0 #3B0F7A;box-sizing:border-box}
.btn-w{background:#FFFFFF;color:#4C1D95;box-shadow:0 3px 0 #E7E2F0;border:1.5px solid #E7E2F0}
.btn-g{background:#147D44;box-shadow:0 3px 0 #0F6B39}
.btn-off{background:#E7E2F0;color:#615A6E;box-shadow:none;cursor:not-allowed}
.btn:active,.press:active{transform:translateY(2px)}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #E7E2F0;background:#FFFFFF;color:#0E0B14;display:inline-flex;align-items:center;gap:6px;font:600 14px 'Plus Jakarta Sans',sans-serif;text-decoration:none;box-sizing:border-box;cursor:pointer}
.chip-on{background:#5B21B6;border-color:#5B21B6;color:#FFFFFF}
.tile{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:44px;text-decoration:none;color:#0E0B14}
.li+.li{border-top:1px solid #E7E2F0}
.bar{height:8px;border-radius:999px;background:#E7E2F0;overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:#5B21B6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field{height:54px;border-radius:14px;border:1.5px solid #E7E2F0;background:#FFFFFF;padding:0 14px;font:500 16px 'Plus Jakarta Sans',sans-serif;color:#0E0B14;box-sizing:border-box;width:100%}
@keyframes p-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes p-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes p-flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.05,1.1) rotate(-3deg)}60%{transform:scale(.97,1.03) rotate(2deg)}}
@keyframes p-fill{from{width:0}}
@keyframes p-burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}}
@keyframes p-dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
.btn,.press,.chip{transition:transform .15s ease-out}
.in{animation:p-in .3s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:p-pop .4s cubic-bezier(.2,.8,.2,1) both}
.flick{animation:p-flick 1.8s ease-in-out infinite;transform-origin:50% 90%}
.fill{animation:p-fill .6s ease-out .2s both}
.bit{animation:p-burst .9s cubic-bezier(.15,.7,.3,1) .15s both}
.dot{animation:p-dots 1.2s ease-in-out infinite}
}
</style>
<style>
.sw{width:46px;height:28px;flex:none;border-radius:999px;border:0;padding:3px;cursor:pointer;display:flex;box-sizing:border-box}
.sw span{width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg{flex:1;height:44px;border:0;border-radius:12px;font:700 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
</style>
</helmet>
<div class="root" style="width: 390px; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; position: relative">
  <header style="padding: 12px 16px 0; display: flex; align-items: center; gap: 8px"><a href="USimMarket.dc.html" class="press" aria-label="Back to the practice market" style="width: 44px; height: 44px; margin-left: -10px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="#0E0B14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></a><span style="flex: 1"></span><span class="tag" style="background: #EFE8FF; color: #5B2FC9">Made-up company</span></header>
  <main style="padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: {{c.color}}; color: #FFFFFF; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">{{c.t}}</span><div><h1 style="font-size: 24px">{{c.name}}</h1><span class="muted" style="font-size: 14px">{{c.label}} · {{c.t}}</span></div></div>
    <div><span class="num" style="font-size: 32px; font-weight: 800">{{c.price}}</span> <span class="tag num" style="background: {{c.tagBg}}; color: {{c.tagFg}}">{{c.chg}}</span></div>
    <div class="card" style="padding: 14px"><svg width="330" height="130" viewBox="0 0 330 130" role="img" aria-label="{{chartLabel}}"><path d="{{chartPath}}" fill="none" stroke="#176EEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div style="display: flex; gap: 6px; margin-top: 8px"><sc-for list="{{ranges}}" as="g" hint-placeholder-count="4"><button type="button" class="{{g.cls}}" aria-pressed="{{g.on}}" onClick="{{g.tap}}">{{g.label}}</button></sc-for></div></div>
    <div class="card" style="overflow: hidden"><div class="li"><span style="flex: 1">You own</span><strong class="num">{{own}}</strong></div><div class="li"><span style="flex: 1">Dividend per share</span><strong class="num">{{div}}</strong></div><a href="UPArticle.dc.html" class="li press"><span style="flex: 1; font-weight: 700">What is a dividend?</span><span class="muted">2 min read</span></a></div>
    <div style="display: flex; gap: 10px; align-items: flex-end"><div style="width: 56px; height: 56px; flex: none"><dc-import name="GKobo" mood="think" size="56" hint-size="56px,56px"></dc-import></div><p class="card" style="margin: 0; padding: 10px 14px; font-size: 14px; font-weight: 600">Before you buy, ask: how does this company make money?</p></div>
  </main>
  <div style="margin-top: auto; position: sticky; bottom: 0; padding: 12px 16px 22px; background: #FFFFFF; display: grid; grid-template-columns: 1fr 1fr; gap: 10px"><a href="{{buyHref}}" class="btn">Buy</a><a href="{{sellHref}}" class="btn btn-w">Sell</a></div>
  
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  sim() { return window.FV && window.FV.SIM; }
  row(c, extra) {
    const S = this.sim(), ch = S.change(c.t), up = ch >= 0;
    return Object.assign({ t: c.t, name: c.name, label: c.label, color: c.color, href: 'USimCompany.dc.html?t=' + c.t,
      price: S.naira(S.price(c.t)), chg: (up ? '\u25b2 ' : '\u25bc ') + Math.abs(ch).toFixed(1) + '%',
      tagBg: up ? '#DCFAE6' : '#FFE4E2', tagFg: up ? '#0F6B39' : '#B42828' }, extra || {});
  }
  constructor(p) { super(p); this.state = { r: '3M' }; }
  renderVals() {
    const S = this.sim(); if (!S) return {};
    const co = S.current(), c = this.row(co), r = this.state.r, n = { '1W': 7, '1M': 30, '3M': 90, '1Y': 365 }[r];
    const h = S.history(co.t, n), lo = Math.min(...h), hi = Math.max(...h), span = Math.max(1, hi - lo);
    const chartPath = h.map((p, i) => (i ? 'L' : 'M') + (i * 330 / Math.max(1, h.length - 1)).toFixed(1) + ',' + (110 - (p - lo) / span * 90).toFixed(1)).join(' ');
    const rose = h[h.length - 1] >= h[0], words = { '1W': 'week', '1M': 'month', '3M': '3 months', '1Y': 'year' }[r];
    const q = S.held(co.t), ranges = ['1W', '1M', '3M', '1Y'].map((label) => ({ label, on: String(label === r), cls: label === r ? 'chip chip-on' : 'chip', tap: () => this.setState({ r: label }) }));
    return { c, chartPath, chartLabel: 'Price ' + (rose ? 'rose' : 'fell') + ' over the last ' + words, ranges,
      own: q ? q + (q === 1 ? ' share \u00b7 ' : ' shares \u00b7 ') + S.naira(q * S.price(co.t)) : 'None yet',
      div: co.div ? S.naira(co.div) : 'None', buyHref: 'USimTrade.dc.html?t=' + co.t, sellHref: 'USimSell.dc.html?t=' + co.t };
  }
}
</script>
</body>
</html>

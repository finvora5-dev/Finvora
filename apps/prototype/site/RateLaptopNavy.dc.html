<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finvora"><meta name="color-scheme" content="light">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; overflow: hidden; position: relative">
  <iframe data-fv-behind src="LessonDoneLaptopNavy.dc.html" title="" tabindex="-1" aria-hidden="true" inert loading="eager" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; background: #F8F9FA"></iframe>
<div style="position: absolute; inset: 0; background: rgba(11,11,15,.45); display: flex; align-items: center; justify-content: center"><div role="dialog" aria-modal="true" aria-label="How was Budgeting?" style="width: 440px; max-width: calc(100% - 48px); background: #FFFFFF; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 24px 60px rgba(11,11,15,.2); box-sizing: border-box"><div style="margin-top: 18px"></div><h2 style="margin: 0px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">How was Budgeting?</h2><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #5B6577">Your rating helps us improve lessons.</p><div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; gap: 8px"><button type="button" aria-label="Poor" aria-pressed="{{on0}}" onClick="{{pick0}}" style="flex: 1; height: 52px; border-radius: 12px; border: {{bd0}}; background: {{bg0}}; cursor: pointer; font: inherit; font-size: 13px">Poor</button><button type="button" aria-label="OK" aria-pressed="{{on1}}" onClick="{{pick1}}" style="flex: 1; height: 52px; border-radius: 12px; border: {{bd1}}; background: {{bg1}}; cursor: pointer; font: inherit; font-size: 13px">OK</button><button type="button" aria-label="Good" aria-pressed="{{on2}}" onClick="{{pick2}}" style="flex: 1; height: 52px; border-radius: 12px; border: {{bd2}}; background: {{bg2}}; cursor: pointer; font: inherit; font-size: 13px">Good</button><button aria-label="Great" style="flex: 1; height: 52px; border-radius: 12px; border: 2px solid #0B192C; background: #EEF0F3; font: inherit; font-size: 13px">Great</button></div><textarea maxlength="500" aria-label="Comment" placeholder="Anything to add? (optional)" style="height: 80px; border: 1px solid #D5D9E0; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; resize: none"></textarea><a onClick="{{send}}" href="LessonDoneNavy.dc.html" style="height: 52px; flex: none; border-radius: 12px; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; background-color: #0B192C">Send</a></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
/* navy-me */
  constructor(p) { super(p); this.state = { g: null }; }
  renderVals() { const v = { send: () => { const A = window.FV && window.FV.ADMIN, el = document.querySelector('#dc-root textarea, #dc-root input'); if (A) A.submit('rate', document.title, this.state.g === null ? '' : String(this.state.g), el ? el.value.slice(0, 500) : ''); } };
    for (let i = 0; i < 4; i++) { const on = this.state.g === i; v['on' + i] = String(on); v['bd' + i] = on ? '2px solid #0B192C' : '1px solid #D5D9E0'; v['bg' + i] = on ? '#EEF0F3' : '#FFFFFF'; v['pick' + i] = () => this.setState({ g: i }); }
    return v; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finvora (purple and black): Lesson, work it out</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3B0F7A}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #5B21B6;outline-offset:3px}
h1,h2,h3,.fd{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600}
.btn{height:54px;width:100%;border:0;border-radius:14px;font:600 17px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;box-sizing:border-box}
.btn:active,.press:active{transform:translateY(4px);box-shadow:none!important}
.b-blue{background:#5B21B6;color:#FFFFFF;box-shadow:0 4px 0 #3B0F7A}
.b-white{background:#FFFFFF;color:#4C1D95;border:2px solid #E7E2F0;box-shadow:0 4px 0 #E7E2F0}
.b-green{background:#12B76A;color:#0E0B14;box-shadow:0 4px 0 #16884A}
.b-coral{background:#F04438;color:#0E0B14;box-shadow:0 4px 0 #F04438}
.b-off{background:#E7E2F0;color:#615A6E;box-shadow:0 4px 0 #C7CEDB;cursor:not-allowed}
.b-off:active{transform:none}
.card{background:#FFFFFF;border:1.5px solid #E7E2F0;border-radius:20px;box-shadow:0 3px 0 #E7E2F0}
.muted{color:#615A6E}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.linkbtn{min-height:44px;border:0;background:transparent;padding:0 4px;font:800 15px 'Plus Jakarta Sans',sans-serif;color:#3B0F7A;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.coinb{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:999px;box-sizing:border-box;border:3px solid rgba(255,255,255,.7);opacity:0;pointer-events:none}
.cb0{--dx:-120px;--dy:-58px;background:#5B21B6}.cb1{--dx:-24px;--dy:-86px;background:#7B4AF0}.cb2{--dx:26px;--dy:-88px;background:#0FA394}.cb3{--dx:88px;--dy:-76px;background:#12B76A}
.cb4{--dx:124px;--dy:-40px;background:#7B4AF0}.cb5{--dx:-150px;--dy:-30px;background:#0FA394}.cb6{--dx:-50px;--dy:-104px;background:#12B76A}.cb7{--dx:52px;--dy:-108px;background:#5B21B6}
@keyframes v-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes v-pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes v-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes v-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes v-hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
@keyframes v-fill{from{width:var(--from)}}
@keyframes v-burst{0%{transform:translate(0,0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
@keyframes v-spark{0%,70%,100%{transform:scale(.2);opacity:0}82%{transform:scale(1.1);opacity:1}92%{transform:scale(.7);opacity:.6}}
@media (prefers-reduced-motion: no-preference){
.btn,.press,.tilebtn{transition:transform .15s ease-out,box-shadow .15s ease-out,background-color .15s ease-out,border-color .15s ease-out}
.in{animation:v-in .35s ease-out both}
.k-idle{animation:v-idle 3.2s ease-in-out infinite}
.k-react{animation:v-hop .4s ease-out 1}
.sheet{animation:v-up .3s ease-out both}
.pop{animation:v-pop .25s ease-out 1}
.shake{animation:v-shake .3s ease-in-out 1}
.coinb{animation:v-burst .65s ease-out .05s 1 both}
.fill{animation:v-fill .4s ease-out .1s both}
.spark{animation:v-spark 2.8s ease-in-out 1s infinite;transform-box:fill-box;transform-origin:center}
}
h1,h2,h3,.h,.serif{font-weight:700!important;letter-spacing:-0.02em}
</style>
</helmet>
<div style="width: 390px; min-height: 980px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; color: #0E0B14; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums">
  <header style="padding: 12px 16px 0; display: flex; align-items: center; gap: 12px">
    <a href="UMLeaveLesson.dc.html" class="press" aria-label="Close lesson and return to the journey" style="width: 44px; height: 44px; flex: none; margin-left: -10px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#615A6E" stroke-width="2.4" stroke-linecap="round"></path></svg></a>
    <div role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3" aria-valuetext="Step 3 of 3" style="flex: 1; height: 8px; border-radius: 999px; background: #E7E2F0; overflow: hidden"><div class="fill" style="--from: 66.7%; width: 100%; height: 100%; border-radius: 999px; background: #5B21B6"></div></div>
    <span style="font-size: 14px; font-weight: 700; color: #615A6E">3/3</span>
  </header>
  <main style="padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-end; gap: 6px">
      <div style="flex: none; width: 84px; height: 84px"><sc-if value="{{kThink}}" hint-placeholder-val="{{true}}"><div class="k-idle" style="width: 84px; height: 84px"><dc-import name="GKobo" mood="think" size="84" hint-size="84px,84px"></dc-import></div></sc-if><sc-if value="{{kOops}}" hint-placeholder-val="{{false}}"><div class="k-react" style="width: 84px; height: 84px"><dc-import name="GKobo" mood="oops" size="84" hint-size="84px,84px"></dc-import></div></sc-if><sc-if value="{{kCheer}}" hint-placeholder-val="{{false}}"><div class="k-react" style="width: 84px; height: 84px"><dc-import name="GKobo" mood="cheer" size="84" hint-size="84px,84px"></dc-import></div></sc-if></div>
      <div class="in" style="position: relative; flex: 1; min-width: 0; margin-bottom: 10px; padding: 12px 14px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #E7E2F0; border-radius: 18px; box-shadow: 0 3px 0 #E7E2F0">
        <span aria-hidden="true" style="position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px; background: #FFFFFF; border-left: 2px solid #E7E2F0; border-bottom: 2px solid #E7E2F0; transform: rotate(45deg)"></span>
        <h1 id="q" style="margin: 0; font-size: 19px; line-height: 1.3">{{qText}}</h1>
        <div id="hint" aria-live="polite">
          <sc-if value="{{hintOn}}" hint-placeholder-val="{{false}}">
            <p style="margin: 8px 0 0; padding: 8px 10px; border-radius: 12px; background: #F1EBFB; font-size: 14px; font-weight: 800; line-height: 1.4; color: #4C1D95"><span class="fd">Hint:</span> {{hintText}}</p>
          </sc-if>
        </div>
      </div>
    </div><sc-if value="{{designed}}" hint-placeholder-val="{{true}}"><div class="card in" aria-hidden="true" style="animation-delay: .04s; padding: 10px 12px; display: flex; align-items: center; justify-content: center"><svg width="300" height="78" viewBox="0 0 270 78"><ellipse cx="30" cy="68" rx="26" ry="4" fill="#18213B" opacity="0.1"></ellipse><path d="M10 54 v8 a20 6 0 0 0 40 0 v-8z" fill="#0F55C9"></path><path d="M10 62 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="30" cy="54" rx="20" ry="6" fill="#176EEB"></ellipse><path d="M10 46 v8 a20 6 0 0 0 40 0 v-8z" fill="#0F55C9"></path><path d="M10 54 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="30" cy="46" rx="20" ry="6" fill="#176EEB"></ellipse><path d="M10 38 v8 a20 6 0 0 0 40 0 v-8z" fill="#0F55C9"></path><path d="M10 46 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="30" cy="38" rx="20" ry="6" fill="#176EEB"></ellipse><path d="M10 30 v8 a20 6 0 0 0 40 0 v-8z" fill="#0F55C9"></path><path d="M10 38 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="30" cy="30" rx="20" ry="6" fill="#176EEB"></ellipse><path d="M64 40h52" stroke="#176EEB" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 7"></path><path d="M112 33l8 7-8 7" fill="none" stroke="#176EEB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="72" y="4" width="38" height="24" rx="7" fill="#EFE8FF"></rect><text x="91" y="21" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#5B2FC9">? yrs</text><ellipse cx="209" cy="68" rx="50" ry="4" fill="#18213B" opacity="0.1"></ellipse><path d="M166 54 v8 a20 6 0 0 0 40 0 v-8z" fill="#0F55C9"></path><path d="M166 62 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="186" cy="54" rx="20" ry="6" fill="#176EEB"></ellipse><path d="M166 46 v8 a20 6 0 0 0 40 0 v-8z" fill="#0F55C9"></path><path d="M166 54 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="186" cy="46" rx="20" ry="6" fill="#176EEB"></ellipse><path d="M166 38 v8 a20 6 0 0 0 40 0 v-8z" fill="#0F55C9"></path><path d="M166 46 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="186" cy="38" rx="20" ry="6" fill="#176EEB"></ellipse><path d="M166 30 v8 a20 6 0 0 0 40 0 v-8z" fill="#0F55C9"></path><path d="M166 38 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="186" cy="30" rx="20" ry="6" fill="#176EEB"></ellipse><path d="M212 54 v8 a20 6 0 0 0 40 0 v-8z" fill="#5B2FC9"></path><path d="M212 62 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="232" cy="54" rx="20" ry="6" fill="#7B4AF0"></ellipse><path d="M212 46 v8 a20 6 0 0 0 40 0 v-8z" fill="#5B2FC9"></path><path d="M212 54 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="232" cy="46" rx="20" ry="6" fill="#7B4AF0"></ellipse><path d="M212 38 v8 a20 6 0 0 0 40 0 v-8z" fill="#5B2FC9"></path><path d="M212 46 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="232" cy="38" rx="20" ry="6" fill="#7B4AF0"></ellipse><path d="M212 30 v8 a20 6 0 0 0 40 0 v-8z" fill="#5B2FC9"></path><path d="M212 38 a20 6 0 0 0 40 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="232" cy="30" rx="20" ry="6" fill="#7B4AF0"></ellipse><circle cx="256" cy="18" r="13" fill="#0FA394"></circle><text x="256" y="23" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">×2</text></svg></div></sc-if>
    <section class="card in" aria-labelledby="ans-l" style="animation-delay: .08s; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div class="{{boxCls}}" style="display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 16px; border: 2px solid {{boxBorder}}; background: {{boxBg}}; box-shadow: 0 4px 0 {{boxEdge}}">
        <label id="ans-l" for="yrs" class="muted" style="font-size: 14px; font-weight: 800; flex: none">Your answer</label>
        <input id="yrs" type="text" inputmode="decimal" autocomplete="off" value="{{val}}" onInput="{{onVal}}" placeholder="0" aria-describedby="yrs-unit" style="flex: 1; min-width: 0; height: 56px; border: 0; background: transparent; text-align: right; font: 600 {{valSize}} 'Plus Jakarta Sans', sans-serif; color: {{valInk}}; outline-offset: 2px">
        <span id="yrs-unit" class="fd" style="font-size: 18px; color: #3A4466; flex: none">{{unit}}</span>
      </div>
      <div role="group" aria-label="Number pad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button type="button" class="press" onClick="{{k.tap}}" aria-label="{{k.aria}}" style="height: 56px; box-sizing: border-box; border-radius: 14px; border: 2px solid #E7E2F0; background: #FFFFFF; box-shadow: 0 4px 0 #E7E2F0; font: 600 24px 'Plus Jakarta Sans', sans-serif; color: #0E0B14; display: flex; align-items: center; justify-content: center; cursor: pointer">{{k.label}}<sc-if value="{{k.isDel}}" hint-placeholder-val="{{false}}"><svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true"><path d="M9 2h15a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9l-7-9z" fill="none" stroke="#3A4466" stroke-width="2.4" stroke-linejoin="round"></path><path d="M13 7l7 8M20 7l-7 8" stroke="#3A4466" stroke-width="2.4" stroke-linecap="round"></path></svg></sc-if></button>
        </sc-for>
      </div>
      <button type="button" class="linkbtn" aria-expanded="{{hintOpen}}" aria-controls="hint" onClick="{{toggleHint}}" style="align-self: center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="#3B0F7A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{hintLabel}}
      </button>
    </section>
  </main>

  <div aria-live="polite" style="margin-top: auto; position: sticky; bottom: 0; z-index: 5">
    <sc-if value="{{showCheck}}" hint-placeholder-val="{{true}}">
      <div style="padding: 14px 16px 22px; background: #FFFFFF; border-top: 2px solid #E7E2F0">
        <button type="button" class="{{checkClass}}" onClick="{{check}}" disabled="{{checkOff}}">Check</button>
      </div>
    </sc-if>
    <sc-if value="{{showWrong}}" hint-placeholder-val="{{false}}">
      <section aria-labelledby="fb-wrong" class="sheet" style="padding: 18px 16px 22px; background: #FFE4E2; border-top: 3px solid #F04438; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #F04438; box-shadow: 0 3px 0 #B42828; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5v9M12 19v.2" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px">
            <h2 id="fb-wrong" style="margin: 0; font-size: 24px; color: #B42828">Not quite</h2>
            <span style="font-size: 14px; font-weight: 800">Your answer: {{shownVal}} {{unit}}</span>
          </span>
        </div>
        <p style="margin: 0; font-size: 16px; line-height: 1.5">{{wrongText}}</p>
        
        <a href="UPAskKobo.dc.html" style="align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: #B42828; text-underline-offset: 3px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="none" stroke="#B42828" stroke-width="2.2" stroke-linejoin="round"></path><path d="M10 9.6a2 2 0 1 1 2.8 1.8c-.6.3-.8.7-.8 1.3M12 14.6v.1" fill="none" stroke="#B42828" stroke-width="2" stroke-linecap="round"></path></svg>Why? Ask Fin</a>
        <button type="button" class="btn b-coral" onClick="{{retry}}">Got it</button>
      </section>
    </sc-if>
    <sc-if value="{{showRight}}" hint-placeholder-val="{{false}}">
      <section aria-labelledby="fb-right" class="sheet" style="position: relative; padding: 18px 16px 22px; background: #DCFAE6; border-top: 3px solid #12B76A; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="position: relative; width: 44px; height: 44px; flex: none; border-radius: 999px; background: #16884A; box-shadow: 0 3px 0 #0F7A3A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px">
            <h2 id="fb-right" style="margin: 0; font-size: 24px; color: #0F7A3A">Nice!</h2>
            <span style="font-size: 14px; font-weight: 800">{{rightHead}}</span>
          </span>
        </div>
        <span aria-hidden="true" style="position: absolute; left: 50%; top: 4px; width: 0; height: 0"><span aria-hidden="true"><span class="coinb cb0"></span><span class="coinb cb1"></span><span class="coinb cb2"></span><span class="coinb cb3"></span><span class="coinb cb4"></span><span class="coinb cb5"></span><span class="coinb cb6"></span><span class="coinb cb7"></span></span></span>
        <p style="margin: 0; font-size: 16px; line-height: 1.5">{{rightNote}}</p>
        
        <a href="UPLessonComplete.dc.html" class="btn b-green" style="margin-top: 2px">Continue</a>
      </section>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { val: '', hint: false, checked: false }; }
  G() { const F = window.FV; return F && F.lesson ? F.lesson() : null; }
  renderVals() {
    const s = this.state;
    const n = parseFloat(String(s.val).replace(',', '.'));
    const L = this.G(), c = L && L.c, N = parseFloat(String(s.val).replace(/,/g, ''));
    const ok = c ? N === c.answer : (!isNaN(n) && Math.abs(n - 6) < 0.15);
    let wrongText = c ? (c.wrongs[N] || ('Not quite. ' + c.hint)) : 'Divide 72 by the rate: 72 ÷ 12 = 6. Try entering that.';
    if (c) {} else if (n === 864) wrongText = 'It looks like you multiplied 72 by 12. The rule divides instead: 72 ÷ 12.';
    else if (n === 12 || n === 72) wrongText = 'That is one of the numbers in the rule, not the result. Divide 72 by the rate of 12.';
    else if (n === 0.6 || n === 60) wrongText = 'Close, but check the decimal point. 72 ÷ 12 is a whole number of years.';
    const empty = String(s.val).trim() === '';
    const good = s.checked && ok, bad = s.checked && !ok;
    const press = (k) => {
      let v = String(s.val);
      if (k === 'del') v = v.slice(0, -1);
      else if (k === '.') { if (!v.includes('.') && v.length < 7) v = (v === '' ? '0' : v) + '.'; }
      else if (v.length < 7) v = (v === '0' ? '' : v) + k;
      this.setState({ val: v, checked: false });
    };
    const K = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'];
    return {
      val: s.val,
      shownVal: s.val,
      valInk: good ? '#0F7A3A' : bad ? '#B42828' : '#0E0B14',
      boxBorder: good ? '#12B76A' : bad ? '#F04438' : '#5B21B6',
      boxBg: good ? '#DCFAE6' : bad ? '#FFE4E2' : '#FFFFFF',
      boxEdge: good ? '#16884A' : bad ? '#F04438' : '#3B0F7A',
      boxCls: good ? 'pop' : bad ? 'shake' : '',
      onVal: (e) => this.setState({ val: e.target.value.replace(/[^0-9.,]/g, '').slice(0, 6), checked: false }),
      keys: K.map((k) => ({
        label: k === 'del' ? '' : k,
        isDel: k === 'del',
        aria: k === 'del' ? 'Delete last digit' : k === '.' ? 'Decimal point' : k,
        tap: () => press(k)
      })),
      hintOn: s.hint, hintOpen: s.hint ? 'true' : 'false',
      hintLabel: s.hint ? 'Hide hint' : 'Show a hint',
      toggleHint: () => this.setState({ hint: !s.hint }),
      valSize: String(s.val).length > 5 ? '28px' : String(s.val).length > 4 ? '34px' : '40px',
      designed: !c, qText: c ? c.calc : 'Rule of 72: roughly how many years does money take to double at 12% a year?', hintText: c ? c.hint : 'Divide 72 by the yearly rate. Use the number, not the percentage sign.', unit: c ? c.unit : 'years',
      rightHead: c ? c.calcRight : '72 \u00f7 12 = 6 years.', rightNote: c ? c.calcNote : 'The Rule of 72 is a shortcut, so it is an approximation. The exact answer at 12% compounded yearly is about 6.12 years.',
      kThink: !s.checked, kOops: bad, kCheer: good,
      showCheck: !s.checked, showWrong: bad, showRight: good,
      wrongText,
      checkOff: empty, checkClass: empty ? 'btn b-off' : 'btn b-blue',
      check: () => { if (!empty) { window.FV && window.FV.answer('calc', ok, s.val + ' ' + (c ? c.unit : 'years')); this.setState({ checked: true }); } },
      retry: () => this.setState({ val: '', checked: false })
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson match</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F9FA">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 10px; display: flex; align-items: center; gap: 10px; flex: none"><a href="LearnNavy.dc.html" aria-label="Close lesson" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; display: flex; gap: 5px" role="img" aria-label="{{fText}}"><sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 5px; border-radius: 999px; background: {{b.c}}"></span></sc-for></span></div><div style="padding: 20px 24px 0; flex: none"><span style="font-size: 13px; color: #5B6577">{{kicker}}</span></div><h1 style="margin: 6px 24px 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; flex: none">Match each word to its meaning</h1><div style="margin: 18px 24px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none"><sc-for list="{{cells}}" as="x" hint-placeholder-count="8"><button type="button" onClick="{{x.tap}}" aria-pressed="{{x.sel}}" aria-disabled="{{x.doneS}}" style="min-height: 68px; padding: 10px 12px; border-radius: 14px; border: {{x.bd}}; background: {{x.bg}}; box-shadow: {{x.sh}}; font: inherit; font-size: 14px; font-weight: {{x.w}}; color: {{x.c}}; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: background-color 160ms ease, border-color 160ms ease"><sc-if value="{{x.done}}" hint-placeholder-val="{{ false }}"><span style="width: 18px; height: 18px; border-radius: 999px; background: #10B981; display: flex; align-items: center; justify-content: center; flex: none"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span></sc-if><span>{{x.t}}</span></button></sc-for></div><div style="margin: 14px 24px 0; display: flex; align-items: center; gap: 10px; flex: none"><span style="flex: 1; height: 6px; border-radius: 999px; background: #E2E5EA"><span style="display: block; width: 100%; height: 100%; transform: scaleX({{sx}}); transform-origin: left; transition: transform 240ms var(--ease-out); border-radius: 999px; background: #10B981"></span></span><span style="font-size: 13px; color: #5B6577">{{count}}</span></div><p role="status" aria-live="polite" style="margin: 10px 24px 0; font-size: 13px; line-height: 1.6; color: #334155; flex: none">{{tip}}</p><div style="margin-top: auto; padding: 16px 24px 26px; display: flex; gap: 10px; flex: none"><button type="button" onClick="{{toggleHint}}" aria-expanded="{{hintOpen}}" style="cursor: pointer; flex: none; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 1px solid #D5D9E0; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #0B192C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Hint</button><a href="{{next}}" onClick="{{go}}" aria-disabled="{{notDone}}" style="flex: 1; height: 54px; border-radius: 14px; background: {{ctaBg}}; opacity: {{op}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Continue</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-steps */
  drawnStep = 3;
  F() { return window.FV; }
  inL() { return !!(window.FV && window.FV.inLesson() && /[?&]in=1/.test(location.search)); }
  L() { return this.F() ? this.F().lesson() : { title: '', c: null }; }
  flow(kind, drawnNext) {
    const F = this.F();
    if (!F || !this.inL()) return { fText: '', bars: [0, 1, 2, 3, 4].map((i) => ({ c: i < this.drawnStep - 1 ? '#10B981' : i === this.drawnStep - 1 ? '#0B192C' : '#E2E5EA' })), next: drawnNext, n: this.drawnStep, total: 5 };
    const v = F.flowVals(kind), n = +v.fN, t = +v.fTotal;
    return { fText: v.fText, next: v.nextHref, n, total: t, bars: Array.from({ length: t }, (_, i) => ({ c: i < n - 1 ? '#10B981' : i === n - 1 ? '#0B192C' : '#E2E5EA' })) };
  }
  constructor(p) { super(p); this.state = { sel: null, matched: {}, miss: null, missed: false, hint: false }; }
  data() {
    const L = this.L(), c = this.inL() && L.c && L.c.match;
    if (c) return { terms: c.terms, means: c.means, done: c.done, title: L.title };
    return { terms: ['Revenue', 'Profit', 'Dividend', 'Share'], means: ['Money from sales', 'What is left after costs', 'Cash paid to shareholders', 'A small piece of a company'], done: 'These four words come up in every company report.', title: 'Company words' };
  }
  renderVals() {
    const d = this.data(), fl = this.flow('match', 'LessonOrderNavy.dc.html'), n = d.terms.length, m = this.state.matched, done = Object.keys(m).length;
    const meanOrder = d.means.map((_, i) => i).sort((a, b) => ((a * 7 + 3) % n) - ((b * 7 + 3) % n));
    const cells = [];
    for (let r = 0; r < n; r++) {
      const ti = r, mi = meanOrder[r];
      [['t', ti, d.terms[ti]], ['m', mi, d.means[mi]]].forEach(([side, i, t]) => {
        const isDone = side === 't' ? m[i] !== undefined : Object.values(m).indexOf(i) >= 0;
        const sel = this.state.sel && this.state.sel.side === side && this.state.sel.i === i, miss = this.state.miss && this.state.miss.side === side && this.state.miss.i === i;
        cells.push({ t, done: isDone, doneS: String(isDone), sel: String(!!sel),
          bd: isDone ? '1.5px solid #10B981' : miss ? '2px solid #B9473F' : sel ? '2px solid #0B192C' : '1px solid #D5D9E0',
          bg: isDone ? '#EAF6EF' : miss ? '#FCEFED' : '#FFFFFF', sh: sel ? '0 6px 16px rgba(17,28,45,.12)' : 'none',
          w: sel ? '600' : '500', c: isDone ? '#047857' : '#0B192C',
          tap: () => {
            if (isDone) return; const s0 = this.state.sel;
            if (!s0 || s0.side === side) { this.setState({ sel: { side, i }, miss: null }); return; }
            const term = side === 't' ? i : s0.i, mean = side === 'm' ? i : s0.i;
            if (term === mean) { const mm = Object.assign({}, m); mm[term] = mean; if (window.fvSound) window.fvSound(Object.keys(mm).length === n ? 'correct' : 'pairok'); this.setState({ matched: mm, sel: null, miss: null });
              if (Object.keys(mm).length === n && this.F() && this.inL()) this.F().answer('match', !this.state.missed, 'all'); }
            else { if (window.fvSound) window.fvSound('pairno'); this.setState({ miss: { side, i }, sel: null, missed: true }); setTimeout(() => this.setState({ miss: null }), 700); }
          } });
      });
    }
    const all = done === n;
    return Object.assign(fl, { kicker: d.title + ' · Match', cells, pct: Math.round(done / n * 100) + '%', sx: (done / n).toFixed(3), count: done + ' of ' + n + ' matched',
      tip: all ? d.done : this.state.hint ? 'Start with the word you know best, then match what is left.' : 'Tap a word, then its meaning.',
      hintOpen: String(this.state.hint), toggleHint: () => this.setState({ hint: !this.state.hint }),
      notDone: String(!all), ctaBg: all ? '#0B192C' : '#334155', op: all ? '1' : '.4', go: (e) => { if (!all) e.preventDefault(); } });
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick learn compare</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F9FA">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 10px; display: flex; align-items: center; gap: 10px; flex: none"><a href="LearnNavy.dc.html" aria-label="Close lesson" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; display: flex; gap: 5px" role="img" aria-label="{{fText}}"><sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 5px; border-radius: 999px; background: {{b.c}}"></span></sc-for></span></div><div style="padding: 20px 24px 0; flex: none"><span style="font-size: 13px; color: #5B6577">{{kicker}}</span></div><h1 style="margin: 6px 24px 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; flex: none">{{title}}</h1><div style="margin: 16px 24px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none"><div style="padding: 14px; border-radius: 16px; background: #FFFFFF; color: #0B192C; border: 1px solid #E5E7EB; display: flex; flex-direction: column; gap: 10px"><strong style="font-size: 15px; font-weight: 600">{{aName}}</strong><sc-for list="{{aItems}}" as="x" hint-placeholder-count="3"><span style="display: flex; gap: 8px; font-size: 13px; line-height: 1.4"><span style="color: #5B6577">•</span>{{x.t}}</span></sc-for></div><div style="padding: 14px; border-radius: 16px; background: #0B192C; color: #FFFFFF; border: 1px solid #0B192C; display: flex; flex-direction: column; gap: 10px"><strong style="font-size: 15px; font-weight: 600">{{bName}}</strong><sc-for list="{{bItems}}" as="x" hint-placeholder-count="3"><span style="display: flex; gap: 8px; font-size: 13px; line-height: 1.4"><span style="color: #00E676">•</span>{{x.t}}</span></sc-for></div></div><a href="AskFinvoraNavy.dc.html" style="margin: 14px 24px 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E5E7EB; text-decoration: none; color: #0B192C; flex: none"><span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: #0B192C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{askTitle}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a><div style="margin-top: auto; padding: 16px 24px 26px; display: flex; gap: 10px; flex: none"><a href="{{next}}" style="flex: 1; height: 54px; border-radius: 14px; background: #0B192C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Got it</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-steps */
  drawnStep = 3;
  F() { return window.FV; }
  inL() { return !!(window.FV && window.FV.inLesson() && /[?&]in=1/.test(location.search)); }
  L() { return this.F() ? this.F().lesson() : { title: '', c: null }; }
  flow(kind, drawnNext) {
    const F = this.F();
    if (!F || !this.inL()) return { fText: '', bars: [0, 1, 2, 3, 4].map((i) => ({ c: i < this.drawnStep - 1 ? '#10B981' : i === this.drawnStep - 1 ? '#0B192C' : '#E2E5EA' })), next: drawnNext, n: this.drawnStep, total: 5 };
    const v = F.flowVals(kind), n = +v.fN, t = +v.fTotal;
    return { fText: v.fText, next: v.nextHref, n, total: t, bars: Array.from({ length: t }, (_, i) => ({ c: i < n - 1 ? '#10B981' : i === n - 1 ? '#0B192C' : '#E2E5EA' })) };
  }
  renderVals() {
    const fl = this.flow('compare', 'LearnMythNavy.dc.html'), L = this.L(), c = this.inL() && L.c && L.c.compare;
    const it = (a) => a.map((t) => ({ t }));
    if (!c) return Object.assign(fl, { kicker: 'Quick learn · Compare', title: 'Savings account or Treasury bill?', aName: 'Savings', bName: 'Treasury bill', aItems: it(['Take money out anytime', 'Lower interest', 'Run by your bank']), bItems: it(['Locked for 91 to 364 days', 'Higher interest', 'Backed by the government']), askTitle: 'Ask Finvora: what do Treasury bills pay now?' });
    return Object.assign(fl, { kicker: L.title + ' · Compare', title: c.title, aName: c.a.name, bName: c.b.name, aItems: it(c.a.items), bItems: it(c.b.items), askTitle: 'Ask Finvora about ' + c.title.toLowerCase() });
  }
}
</script>
</body>
</html>

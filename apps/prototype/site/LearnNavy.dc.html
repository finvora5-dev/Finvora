<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Learn</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B192C"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="background: #0B192C; color: #FFFFFF; padding-bottom: 14px; padding: 18px 20px 0; display: flex; align-items: baseline; justify-content: space-between"><h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Learn</h1><span style="font-size: 13px; color: #B6C0CF">6 courses</span></div>
  <div style="margin: 12px 20px 0; display: flex; background: #E8EBEF; border-radius: 10px; padding: 3px"><a href="LearnNavy.dc.html" aria-current="page" style="flex: 1; height: 38px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(11,11,15,.08); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 600; color: #0B192C">Courses</a><a href="LibraryNavy.dc.html" style="flex: 1; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 500; color: #5B6577">Library</a></div>
  <section style="margin: 14px 20px 0; border: 1px solid #E5E7EB; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; color: #5B6577; font-weight: 500; text-transform: uppercase; letter-spacing: .06em">Course 1 of 6</span>
    <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Money Foundations</span>
    <span style="display: flex; align-items: center; gap: 10px"><span style="flex: 1; height: 6px; border-radius: 999px; background: #E2E5EA; overflow: hidden"><span style="display: block; width: {{donePct}}; height: 100%; background: #10B981"></span></span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B6577">{{doneN}}</span></span>
    <a href="{{contHref}}" style="height: 48px; border-radius: 12px; background: #0B192C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 15px; margin-top: 4px">{{cont}}</a>
  </section>
  <section style="padding: 20px 20px 0">
    <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #5B6577; text-transform: uppercase; letter-spacing: .06em">Lessons</h2>
    <sc-for list="{{lessons}}" as="l" hint-placeholder-count="7">
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #EDEFF2; text-decoration: none; color: {{l.ink}}">
        <span style="width: 26px; height: 26px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; background: {{l.bg}}; color: {{l.fg}}; border: {{l.bd}}">{{l.mark}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: {{l.w}}">{{l.t}}</span><span style="font-size: 12px; color: #5B6577">{{l.s}}</span></span>
      </a>
    </sc-for>
  </section>
  <section style="padding: 18px 20px 0">
    <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #5B6577; text-transform: uppercase; letter-spacing: .06em">Next courses</h2>
    <a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 50px; border-bottom: 1px solid #EDEFF2; text-decoration: none; font-size: 15px"><span>Understanding Investing</span><span style="font-size: 12px; color: #5B6577">8 lessons</span></a>
  </section>
  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 72px; filter: drop-shadow(0 10px 24px rgba(17,28,45,.25))"><svg width="366" height="72" viewBox="0 0 366 72" aria-hidden="true" style="position: absolute; inset: 0"><path d="M24 0 H131 C143 0 145 6 148 14 C155 34 168 42 183 42 C198 42 211 34 218 14 C221 6 223 0 235 0 H342 A24 24 0 0 1 366 24 V48 A24 24 0 0 1 342 72 H24 A24 24 0 0 1 0 48 V24 A24 24 0 0 1 24 0 Z" fill="#0B192C"></path></svg><div style="position: relative; display: flex; height: 72px; padding: 0 4px"><a href="HomeNavy.dc.html" style="flex: 1; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E9AAE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5h-5v5H4z"></path></svg><span style="font-size: 12px; font-weight: 500; color: #C7D0DD">Home</span></a><a href="MarketsNavy.dc.html" style="flex: 1; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E9AAE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"></path></svg><span style="font-size: 12px; font-weight: 500; color: #C7D0DD">Markets</span></a><span style="width: 92px; flex: none" aria-hidden="true"></span><a href="LearnNavy.dc.html" aria-current="page" style="flex: 1; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4zM7 9.5V14c2.5 2 7.5 2 10 0V9.5"></path></svg><span style="font-size: 12px; font-weight: 600; color: #00E676">Learn</span></a><a href="MeNavy.dc.html" style="flex: 1; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E9AAE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg><span style="font-size: 12px; font-weight: 500; color: #C7D0DD">Me</span></a></div><a href="AskFinvoraNavy.dc.html" aria-label="Ask Finvora" style="position: absolute; left: 50%; top: -30px; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 999px; background: #10B981; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(17,28,45,.35); text-decoration: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"></path></svg></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-lessons */
  renderVals() {
    const F = window.FV, st = F ? F.get() : { done: 2 }, done = st.done || 0, LS = F ? F.LESSONS : [];
    const L = LS.map((x, i) => [x.title, i < done ? 'done' : i === done ? 'next' : 'locked', x.min + ' min']).concat([['Course review', done >= LS.length ? 'next' : 'locked', '8 questions']]);
    let rv = {}; try { rv = JSON.parse(localStorage.getItem('fv.review.v1') || 'null') || {}; } catch (e) {}
    const passed = (rv.best || 0) >= 6; if (passed) L[L.length - 1][1] = 'done';
    const cur = LS[done];
    return { contHref: cur ? 'LessonInfoNavy.dc.html' : 'CourseReviewNavy.dc.html', cont: passed ? 'Review the course again' : cur ? (done ? 'Continue: ' : 'Start: ') + cur.title + ' · ' + cur.min + ' min' : 'Start the course review', donePct: Math.round(done / (LS.length || 6) * 100) + '%', doneN: done + '/' + (LS.length || 6),
      lessons: L.map(([t, st, d], i) => ({
      t, s: st === 'done' ? 'Completed · ' + d : st === 'next' ? 'Up next · ' + d : d,
      mark: st === 'done' ? '✓' : String(i + 1),
      bg: st === 'done' ? '#DDF3E6' : st === 'next' ? '#0B192C' : '#FFFFFF',
      fg: st === 'done' ? '#10B981' : st === 'next' ? '#FFFFFF' : '#5B6577',
      bd: st === 'locked' ? '1px solid #D5D9E0' : '0',
      ink: st === 'locked' ? '#5B6577' : '#0B192C', w: st === 'next' ? '600' : '500'
    })) };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finvora (purple and black): Sell Adire Foods</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.root{background:#FFFFFF;color:#0E0B14;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:#4C1D95}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #5B21B6;outline-offset:2px}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em;margin:0}
.card{background:#FFFFFF;border:1.5px solid #E7E2F0;box-shadow:0 3px 0 #E7E2F0;border-radius:20px;box-sizing:border-box}
.muted{color:#615A6E}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.btn{width:100%;height:54px;border:0;border-radius:16px;background:#5B21B6;color:#FFFFFF;font:700 16px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;box-shadow:0 3px 0 #3B0F7A;box-sizing:border-box}
.btn-w{background:#FFFFFF;color:#4C1D95;box-shadow:0 3px 0 #E7E2F0;border:1.5px solid #E7E2F0}
.btn-g{background:#16884A;box-shadow:0 3px 0 #0F6B39}
.btn-off{background:#E7E2F0;color:#615A6E;box-shadow:none;cursor:not-allowed}
.btn:active,.press:active{transform:translateY(2px)}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #E7E2F0;background:#FFFFFF;color:#0E0B14;display:inline-flex;align-items:center;gap:6px;font:600 14px 'Plus Jakarta Sans',sans-serif;text-decoration:none;box-sizing:border-box;cursor:pointer}
.chip-on{background:#5B21B6;border-color:#5B21B6;color:#FFFFFF}
.tile{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:44px;text-decoration:none;color:#0E0B14}
.li+.li{border-top:1px solid #E7E2F0}
.bar{height:8px;border-radius:999px;background:#E7E2F0;overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:#5B21B6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field{height:54px;border-radius:14px;border:1.5px solid #E7E2F0;background:#FFFFFF;padding:0 14px;font:500 16px 'Plus Jakarta Sans',sans-serif;color:#0E0B14;box-sizing:border-box;width:100%}
@keyframes p-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes p-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes p-flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.05,1.1) rotate(-3deg)}60%{transform:scale(.97,1.03) rotate(2deg)}}
@keyframes p-fill{from{width:0}}
@keyframes p-burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}}
@keyframes p-dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
.btn,.press,.chip{transition:transform .15s ease-out}
.in{animation:p-in .3s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:p-pop .4s cubic-bezier(.2,.8,.2,1) both}
.flick{animation:p-flick 1.8s ease-in-out infinite;transform-origin:50% 90%}
.fill{animation:p-fill .6s ease-out .2s both}
.bit{animation:p-burst .9s cubic-bezier(.15,.7,.3,1) .15s both}
.dot{animation:p-dots 1.2s ease-in-out infinite}
}
</style>
<style>
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.sw{width:46px;height:28px;flex:none;border-radius:999px;border:0;padding:3px;display:flex;box-sizing:border-box}
.sw span{width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sk{background:#DCE6F5;border-radius:10px}
@keyframes m-sh{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
@media (prefers-reduced-motion:no-preference){.sk{animation:m-sh 1.4s ease-in-out infinite}}
.toast{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(16,30,70,.16)}
.btn-r{background:#D92B2B;color:#FFFFFF;box-shadow:0 3px 0 #A51D1D}
</style>
</helmet>
<div class="root" style="width: 390px; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; position: relative">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; isolation: isolate; z-index: 0"><dc-import name="USimCompany" hint-size="390px,900px"></dc-import></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 1; background: rgba(12,20,40,.5)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="m-t" style="position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: #E7E2F0; align-self: center"></span><h2 id="m-t" style="font-size: 21px">Sell {{name}}</h2>
    <div style="display: flex; align-items: center; justify-content: space-between"><span style="font-weight: 700">How many shares?</span><div style="display: flex; align-items: center; gap: 10px"><button type="button" class="press" aria-label="One fewer share" onClick="{{dec}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #E7E2F0; background: #FFFFFF; font: 800 22px 'Plus Jakarta Sans', sans-serif; color: #4C1D95; cursor: pointer">−</button><span class="num" aria-live="polite" style="min-width: 36px; text-align: center; font-size: 22px; font-weight: 800">{{q}}</span><button type="button" class="press" aria-label="One more share" onClick="{{inc}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #E7E2F0; background: #FFFFFF; font: 800 22px 'Plus Jakarta Sans', sans-serif; color: #4C1D95; cursor: pointer">+</button></div></div>
    <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #F8F6FC; font-weight: 600">You don't own any {{name}} shares yet, so there is nothing to sell.</p></sc-if>
    <sc-if value="{{has}}" hint-placeholder-val="{{true}}"><div style="border: 1.5px solid #E7E2F0; border-radius: 16px; overflow: hidden"><div style="display: flex; justify-content: space-between; padding: 12px 16px"><span class="muted">Fees (approx.)</span><span class="num">{{fee}}</span></div><div style="display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid #E7E2F0"><span class="muted">You get (virtual)</span><strong class="num">{{get}}</strong></div><div style="display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid #E7E2F0; background: #F8F6FC"><span class="muted">Shares left</span><span class="num">{{own}}</span></div></div>
    <button type="button" class="btn" onClick="{{sell}}" aria-disabled="{{busy}}">Sell {{q}} shares</button></sc-if><a href="{{back}}" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none; color: #4C1D95">Cancel</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  sim() { return window.FV && window.FV.SIM; }
  row(c, extra) {
    const S = this.sim(), ch = S.change(c.t), up = ch >= 0;
    return Object.assign({ t: c.t, name: c.name, label: c.label, color: c.color, href: 'USimCompany.dc.html?t=' + c.t,
      price: S.naira(S.price(c.t)), chg: (up ? '\u25b2 ' : '\u25bc ') + Math.abs(ch).toFixed(1) + '%',
      tagBg: up ? '#DCFAE6' : '#FFE4E2', tagFg: up ? '#0F6B39' : '#B42828' }, extra || {});
  }
  constructor(p) { super(p); this.state = { q: 1, busy: false }; this.key = 'sell-' + Date.now() + '-' + Math.random().toString(36).slice(2); }
  renderVals() {
    const S = this.sim(); if (!S) return {};
    const co = S.current(), OWN = S.held(co.t), q = Math.min(Math.max(1, this.state.q), Math.max(1, OWN)), gross = S.price(co.t) * q, fee = S.fee(gross);
    return { name: co.name, q: String(q), fee: S.naira(fee), get: S.naira(Math.max(0, gross - fee)), own: String(OWN - q), has: OWN > 0, none: OWN === 0, busy: String(this.state.busy),
      back: 'USimCompany.dc.html?t=' + co.t,
      dec: () => this.setState({ q: Math.max(1, q - 1) }), inc: () => this.setState({ q: Math.min(OWN, q + 1) }),
      sell: () => { if (this.state.busy || !OWN) return; if (!S.isOpen()) { location.href = 'UMOrderClosed.dc.html?t=' + co.t + '&side=sell&q=' + q; return; } this.setState({ busy: true }); const r = S.trade('sell', co.t, q, this.key); if (r.ok) location.href = 'USimDone.dc.html?t=' + co.t; else this.setState({ busy: false }); } };
  }
}
</script>
</body>
</html>

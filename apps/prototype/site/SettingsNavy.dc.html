<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 10px 20px 0 8px; display: flex; align-items: center; gap: 4px"><a href="MeNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; font-size: 20px; font-weight: 600">Settings</h1></div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <section style="padding: 18px 20px 0">
      <h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600; color: #5B6577; text-transform: uppercase; letter-spacing: .06em">{{g.h}}</h2>
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
        <div role="{{r.role}}" tabindex="{{r.tab}}" aria-haspopup="{{r.pop}}" onClick="{{r.act}}" onKeyDown="{{r.key}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; border-bottom: 1px solid #EDEFF2; font-size: 15px; cursor: {{r.cur}}">
          <span style="flex: none">{{r.t}}</span>
          <span style="display: {{r.showV}}; min-width: 0; text-align: right; overflow-wrap: anywhere; font-size: 14px; color: #5B6577">{{r.v}}</span>
          <button role="switch" aria-checked="{{r.on}}" aria-label="{{r.t}}" onClick="{{r.tog}}" style="display: {{r.showS}}; width: 44px; height: 26px; border-radius: 999px; border: 0; padding: 3px; background: {{r.bg}}; cursor: pointer; justify-content: {{r.j}}"><span style="width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(11,11,15,.2)"></span></button>
        </div>
      </sc-for>
    </section>
  </sc-for>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" onClick="{{close}}" style="position: fixed; inset: 0; background: rgba(17,28,45,.45); z-index: 40"></div><section role="dialog" aria-modal="true" aria-labelledby="ap-h" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 10px"><span style="width: 36px; height: 4px; border-radius: 999px; background: #D5D9E0; align-self: center; margin-bottom: 6px"></span><h2 id="ap-h" style="margin: 0; font-size: 20px; font-weight: 600">Appearance</h2><p style="margin: 0 0 4px; font-size: 14px; color: #5B6577">Choose how Finvora looks on this device.</p><div role="radiogroup" aria-labelledby="ap-h" style="display: flex; flex-direction: column; gap: 10px"><sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 12px; border: {{o.bd}}; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 16px; text-align: left; cursor: pointer"><span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span>{{o.t}}</span><span style="display: {{o.showS}}; font-size: 13px; color: #5B6577">{{o.s}}</span></span><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 999px; box-sizing: border-box; border: {{o.dot}}; flex: none"></span></button></sc-for></div></section></sc-if>
  <a href="SignOutNavy.dc.html" style="margin: 24px 20px 0; height: 48px; border-radius: 12px; border: 1px solid #D5D9E0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; text-decoration: none; color: #B9473F">Sign out</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-me */
/* navy-appearance */
  constructor(p) { super(p); const P = window.FV ? window.FV.ME.prefs() : {}; this.state = { price: P.price !== false, daily: P.daily !== false, news: !!P.news, sound: P.sound !== false, open: false, ap: window.fvTheme ? window.fvTheme.pref() : 'system' }; }
  renderVals() {
    const sw = (t, k) => { const on = this.state[k]; return { t, on: String(on), showS: 'flex', showV: 'none', v: '', bg: on ? '#0B192C' : '#D5D9E0', j: on ? 'flex-end' : 'flex-start', tog: () => { if (window.FV) window.FV.ME.setPref(k, !on); this.setState({ [k]: !on }); }, role: 'none', tab: '-1', pop: 'false', cur: 'default', act: () => {}, key: () => {} }; };
    const val = (t, v, act) => ({ t, v, showS: 'none', showV: 'inline', on: 'false', bg: '', j: '', tog: () => {}, role: act ? 'button' : 'none', tab: act ? '0' : '-1', pop: act ? 'dialog' : 'false', cur: act ? 'pointer' : 'default', act: act || (() => {}), key: act ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } } : () => {} });
    const AP = { system: 'Match phone', light: 'Light', dark: 'Dark' }, openAp = () => this.setState({ open: true });
    const opts = ['system', 'light', 'dark'].map((k) => { const on = this.state.ap === k; return { t: AP[k], s: 'Dark when your phone is in dark mode', showS: k === 'system' ? 'inline' : 'none', on: String(on), bd: on ? '2px solid #0B192C' : '1px solid #D5D9E0', dot: on ? '6px solid #0B192C' : '2px solid #D5D9E0', pick: () => { if (window.fvTheme) window.fvTheme.set(k); this.setState({ ap: k, open: false }); } }; });
    return { open: this.state.open, opts, close: () => this.setState({ open: false }), groups: [
      { h: 'Account', rows: [val('Email', (window.FV && window.FV.AUTH.get().email) || 'Not signed in'), val('Plan', window.FV && window.FV.billing().sub.plan === 'plus' ? 'Plus' : 'Free'), val('Interest', (window.FV && window.FV.AUTH.get().goal) || 'Investing')] },
      { h: 'Notifications', rows: [sw('Price alerts', 'price'), sw('Daily lesson reminder', 'daily'), sw('Market news', 'news')] },
      { h: 'App', rows: [val('Appearance', AP[this.state.ap] || 'Match phone', openAp), sw('Sounds', 'sound'), val('Text size', 'System'), val('Privacy and data', '')] }
    ] };
  }
}
</script>
</body>
</html>

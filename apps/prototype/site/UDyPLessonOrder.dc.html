<style>
body{margin:0;background:#FFFFFF}
a{color:#3B0F7A}

h1,h2,h3,.fd{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600}
.btn{height:54px;width:100%;border:0;border-radius:14px;font:600 17px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;box-sizing:border-box}
.btn:active,.press:active{transform:translateY(4px);box-shadow:none!important}
.b-blue{background:#5B21B6;color:#FFFFFF;box-shadow:0 4px 0 #3B0F7A}

.b-off:active{transform:none}
.card{background:#FFFFFF;border:1.5px solid #E7E2F0;border-radius:20px;box-shadow:0 3px 0 #E7E2F0}
.muted{color:#615A6E}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.linkbtn{min-height:44px;border:0;background:transparent;padding:0 4px;font:800 15px 'Plus Jakarta Sans',sans-serif;color:#3B0F7A;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.coinb{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:999px;box-sizing:border-box;border:3px solid rgba(255,255,255,.7);opacity:0;pointer-events:none}
.cb0{--dx:-120px;--dy:-58px;background:#5B21B6}.cb1{--dx:-24px;--dy:-86px;background:#7B4AF0}.cb2{--dx:26px;--dy:-88px;background:#0FA394}.cb3{--dx:88px;--dy:-76px;background:#12B76A}
.cb4{--dx:124px;--dy:-40px;background:#7B4AF0}.cb5{--dx:-150px;--dy:-30px;background:#0FA394}.cb6{--dx:-50px;--dy:-104px;background:#12B76A}.cb7{--dx:52px;--dy:-108px;background:#5B21B6}
@keyframes v-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes v-pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes v-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes v-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes v-hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
@keyframes v-fill{from{width:var(--from)}}
@keyframes v-burst{0%{transform:translate(0,0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
@keyframes v-spark{0%,70%,100%{transform:scale(.2);opacity:0}82%{transform:scale(1.1);opacity:1}92%{transform:scale(.7);opacity:.6}}
@media (prefers-reduced-motion: no-preference){
.tilebtn{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.btn,.press,.tilebtn{transition:transform .15s ease-out,box-shadow .15s ease-out,background-color .15s ease-out,border-color .15s ease-out}
.in{animation:v-in .35s ease-out both}
.k-idle{animation:v-idle 3.2s ease-in-out infinite}
.k-react{animation:v-hop .4s ease-out 1}
.sheet{animation:v-up .3s ease-out both}
.pop{animation:v-pop .25s ease-out 1}
.shake{animation:v-shake .3s ease-in-out 1}
.coinb{animation:v-burst .65s ease-out .05s 1 both}
.fill{animation:v-fill .4s ease-out .1s both}
.spark{animation:v-spark 2.8s ease-in-out 1s infinite;transform-box:fill-box;transform-origin:center}
}
h1,h2,h3,.h,.serif{font-weight:700!important;letter-spacing:-0.02em}
</style>

<div class="root" style="color: #0E0B14; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; width: 1440px; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF">
  
  <div style="flex: 1; width: 100%; padding: 0 48px; box-sizing: border-box; display: flex; flex-direction: column">
  <header style="padding: 12px 16px 0; display: flex; align-items: center; gap: 12px">
    <a href="UMLeaveLesson.dc.html" class="press" aria-label="Close lesson and return to the journey" style="width: 44px; height: 44px; flex: none; margin-left: -10px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#615A6E" stroke-width="2.4" stroke-linecap="round"></path></svg></a>
    <div role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="{{fTotal}}" aria-valuenow="{{fN}}" aria-valuetext="{{fText}}" style="flex: 1; height: 8px; border-radius: 999px; background: #E7E2F0; overflow: hidden"><div class="fill" style="--from: {{fFrom}}; width: {{fPct}}; height: 100%; border-radius: 999px; background: #5B21B6"></div></div>
    <span style="font-size: 14px; font-weight: 700; color: #615A6E">{{fLabel}}</span>
  </header>
  <main style="padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-end; gap: 6px">
      <div style="flex: none; width: 84px; height: 84px"><sc-if value="{{kThink}}" hint-placeholder-val="{{true}}"><div class="k-idle" style="width: 84px; height: 84px"><dc-import name="GKobo" mood="think" size="84" hint-size="84px,84px"></dc-import></div></sc-if><sc-if value="{{kOops}}" hint-placeholder-val="{{false}}"><div class="k-react" style="width: 84px; height: 84px"><dc-import name="GKobo" mood="oops" size="84" hint-size="84px,84px"></dc-import></div></sc-if><sc-if value="{{kCheer}}" hint-placeholder-val="{{false}}"><div class="k-react" style="width: 84px; height: 84px"><dc-import name="GKobo" mood="cheer" size="84" hint-size="84px,84px"></dc-import></div></sc-if></div>
      <div class="in" style="position: relative; flex: 1; min-width: 0; margin-bottom: 10px; padding: 12px 14px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #E7E2F0; border-radius: 18px; box-shadow: 0 3px 0 #E7E2F0">
        <span aria-hidden="true" style="position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px; background: #FFFFFF; border-left: 2px solid #E7E2F0; border-bottom: 2px solid #E7E2F0; transform: rotate(45deg)"></span>
        <h1 id="q" style="margin: 0; font-size: 19px; line-height: 1.3">{{oQ}}</h1>
      </div>
    </div>
    <div class="in" style="animation-delay: .04s; display: flex; flex-direction: column; gap: 8px">
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; padding-left: 4px"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="#615A6E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="muted" style="font-size: 13px; font-weight: 800">{{oLeast}}</span><span style="flex: 1; height: 0; border-top: 2px dashed #E7E2F0"></span></div>
      <ol class="{{listCls}}" aria-labelledby="q" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
          <li class="tilebtn" onPointerDown="{{it.grab}}" onPointerMove="{{it.drag}}" onPointerUp="{{it.drop}}" onPointerCancel="{{it.drop}}" style="padding: 10px; display: flex; align-items: center; gap: 10px; border-radius: 18px; border: 2px solid {{it.border}}; background: {{it.bg}}; box-shadow: {{it.shadow}}; transform: {{it.lift}}; transition: {{it.tr}}; position: relative; z-index: {{it.z}}; touch-action: none; user-select: none; cursor: grab">
            <span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 999px; background: {{it.rankBg}}; color: #FFFFFF; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35), 0 3px 0 {{it.rankEdge}}; font: 600 17px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center">{{it.n}}</span>
            <span aria-hidden="true" style="width: 40px; height: 40px; flex: none"><sc-if value="{{it.isCash}}" hint-placeholder-val="{{false}}"><svg width="40" height="40" viewBox="0 0 40 40"><rect x="3" y="10" width="34" height="20" rx="4" fill="#0FA394"></rect><rect x="6" y="13" width="28" height="14" rx="3" fill="none" stroke="#D7F6F1" stroke-width="1.6"></rect><circle cx="20" cy="20" r="4.5" fill="#D7F6F1"></circle></svg></sc-if><sc-if value="{{it.isSimple}}" hint-placeholder-val="{{false}}"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M6 28 v6 a14 4 0 0 0 28 0 v-6z" fill="#9CC3FF"></path><path d="M6 34 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="28" rx="14" ry="4" fill="#E3EFFF"></ellipse><path d="M6 22 v6 a14 4 0 0 0 28 0 v-6z" fill="#9CC3FF"></path><path d="M6 28 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="22" rx="14" ry="4" fill="#E3EFFF"></ellipse><path d="M6 16 v6 a14 4 0 0 0 28 0 v-6z" fill="#0A796E"></path><path d="M6 22 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="16" rx="14" ry="4" fill="#0FA394"></ellipse><path d="M6 10 v6 a14 4 0 0 0 28 0 v-6z" fill="#0A796E"></path><path d="M6 16 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="10" rx="14" ry="4" fill="#0FA394"></ellipse></svg></sc-if><sc-if value="{{it.isCompound}}" hint-placeholder-val="{{false}}"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M6 30 v6 a14 4 0 0 0 28 0 v-6z" fill="#9CC3FF"></path><path d="M6 36 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="30" rx="14" ry="4" fill="#E3EFFF"></ellipse><path d="M6 24 v6 a14 4 0 0 0 28 0 v-6z" fill="#9CC3FF"></path><path d="M6 30 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="24" rx="14" ry="4" fill="#E3EFFF"></ellipse><path d="M6 18 v6 a14 4 0 0 0 28 0 v-6z" fill="#0F55C9"></path><path d="M6 24 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="18" rx="14" ry="4" fill="#176EEB"></ellipse><path d="M6 12 v6 a14 4 0 0 0 28 0 v-6z" fill="#0F55C9"></path><path d="M6 18 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="12" rx="14" ry="4" fill="#176EEB"></ellipse><path d="M6 6 v6 a14 4 0 0 0 28 0 v-6z" fill="#5B2FC9"></path><path d="M6 12 a14 4 0 0 0 28 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"></path><ellipse cx="20" cy="6" rx="14" ry="4" fill="#7B4AF0"></ellipse></svg></sc-if></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
              <span class="fd" style="font-size: 17px; line-height: 1.2">{{it.label}}</span>
              <span class="muted" style="font-size: 13px; font-weight: 700; line-height: 1.3">{{it.sub}}</span>
              <sc-if value="{{it.showAmt}}" hint-placeholder-val="{{false}}"><span class="fd" style="font-size: 16px; color: #0F7A3A">{{it.amt}}</span></sc-if>
            </span>
            <span aria-hidden="true" style="width: 32px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="26" viewBox="0 0 18 26"><g fill="#9AA3BA"><circle cx="5" cy="5" r="2.4"></circle><circle cx="13" cy="5" r="2.4"></circle><circle cx="5" cy="13" r="2.4"></circle><circle cx="13" cy="13" r="2.4"></circle><circle cx="5" cy="21" r="2.4"></circle><circle cx="13" cy="21" r="2.4"></circle></g></svg></span>
              <button type="button" class="sr" onClick="{{it.up}}" disabled="{{it.upOff}}" aria-label="{{it.upLabel}}">Move up</button>
              <button type="button" class="sr" onClick="{{it.down}}" disabled="{{it.downOff}}" aria-label="{{it.downLabel}}">Move down</button>
          </li>
        </sc-for>
      </ol>
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; padding-left: 4px"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="#615A6E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="muted" style="font-size: 13px; font-weight: 800">{{oMost}}</span><span style="flex: 1; height: 0; border-top: 2px dashed #E7E2F0"></span></div>
    </div>
    <p aria-live="polite" class="muted" style="margin: 0; font-size: 13px; font-weight: 800">{{status}}</p>
  </main>

  <div aria-live="polite" style="margin-top: auto; position: sticky; bottom: 0; z-index: 5">

      <div style="padding: 14px 16px 22px; background: #FFFFFF; border-top: 2px solid #E7E2F0">
        <button type="button" class="{{checkClass}}" onClick="{{check}}" disabled="{{checkOff}}">Check</button>
      </div>
    </sc-if>
    <sc-if value="{{showWrong}}" hint-placeholder-val="{{false}}">
      <section aria-labelledby="fb-wrong" class="sheet" style="padding: 18px 16px 22px; background: #FFE4E2; border-top: 3px solid #F04438; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #F04438; box-shadow: 0 3px 0 #B42828; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5v9M12 19v.2" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"></path></svg></span>

          </span>
        </div>
        <p style="margin: 0; font-size: 16px; line-height: 1.5">{{oWrong}}</p>

        <button type="button" class="btn b-coral" onClick="{{retry}}">Got it</button>
      </section>
    </sc-if>
    <sc-if value="{{showRight}}" hint-placeholder-val="{{false}}">
      <section aria-labelledby="fb-right" class="sheet" style="position: relative; padding: 18px 16px 22px; background: #DCFAE6; border-top: 3px solid #12B76A; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="position: relative; width: 44px; height: 44px; flex: none; border-radius: 999px; background: #147D44; box-shadow: 0 3px 0 #0F7A3A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px">
            <h2 id="fb-right" style="margin: 0; font-size: 24px; color: #0F7A3A">Nice!</h2>
            <span style="font-size: 14px; font-weight: 800">Least to most, spot on.</span>
          </span>
        </div>
        <span aria-hidden="true" style="position: absolute; left: 50%; top: 4px; width: 0; height: 0"><span aria-hidden="true"><span class="coinb cb0"></span><span class="coinb cb1"></span><span class="coinb cb2"></span><span class="coinb cb3"></span><span class="coinb cb4"></span><span class="coinb cb5"></span><span class="coinb cb6"></span><span class="coinb cb7"></span></span></span>
        <ul style="margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.55">
          <sc-for list="{{oRight}}" as="r" hint-placeholder-count="3"><li>{{r}}</li></sc-for></ul>
        <p style="margin: 0; font-size: 13px; font-weight: 700; color: #3A4466">{{oNote}}</p>
        
        <a href="{{nextHref}}" class="btn b-green" style="margin-top: 2px">Continue</a>
      </section>
    </sc-if>
  </div>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); const O0 = window.FV && window.FV.lesson && window.FV.lesson().c && window.FV.lesson().c.order; this.state = { order: O0 ? O0.start.slice() : [0, 2, 1], moved: null, checked: false, drag: null, dy: 0, status: 'Hold an answer and drag it into place.' }; }
  _rv() {
    const s = this.state;
    const LS = window.FV && window.FV.lesson ? window.FV.lesson() : null, O = LS && LS.c && LS.c.order;
    const L = O ? O.items.map((x, i) => ({ label: x[0], sub: x[1], amt: x[2], key: ['isCash', 'isSimple', 'isCompound'][i] })) : [
      { label: 'Keep it as cash', sub: 'No interest', amt: '₦10,000', key: 'isCash' },
      { label: 'Simple interest', sub: '10% a year on the ₦10,000', amt: '₦20,000', key: 'isSimple' },
      { label: 'Compound interest yearly', sub: '10% a year on the growing total', amt: '₦25,937', key: 'isCompound' }
    ];
    const right = s.order.join() === '0,1,2';
    const n = s.order.length;
    const move = (i, d) => {
      const o = s.order.slice(); const j = i + d; const k = o[i];
      [o[i], o[j]] = [o[j], o[i]];
      this.setState({ order: o, moved: k, checked: false, status: L[k].label + ' moved to position ' + (j + 1) + ' of 3.' });
    };
    const good = s.checked && right, bad = s.checked && !right;
    return {
      items: s.order.map((k, i) => {
        const dragging = s.drag === k;
        const lifted = !s.checked && (s.moved === k || dragging);
        // Fluid drag (owner, 9 Nov 2026): the order stays put while dragging; other tiles slide aside; the new order is saved on release.
        const grab = (e) => {
          if (s.checked || this._d) return;
          if (e.button !== undefined && e.button !== 0) return;
          e.preventDefault();
          const d = { k, y: e.clientY, step: e.currentTarget.offsetHeight + 10, from: s.order.indexOf(k), to: s.order.indexOf(k) };
          const mv = (ev) => { const dy = ev.clientY - d.y; d.to = Math.max(0, Math.min(n - 1, d.from + Math.round(dy / d.step))); this.setState({ dy, to: d.to }); };
          const up = () => {
            window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
            this._d = null; const o = this.state.order.slice(); o.splice(d.from, 1); o.splice(d.to, 0, k);
            this.setState({ order: o, drag: null, dy: 0, to: null, moved: k, status: d.to !== d.from ? L[k].label + ' moved to position ' + (d.to + 1) + ' of 3.' : this.state.status });
          };
          window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
          this._d = d; this.setState({ drag: k, dy: 0, to: d.from, moved: k });
        };
        const drag = () => {};
        const drop = () => {};
        const from = s.drag != null ? s.order.indexOf(s.drag) : -1, to = s.to != null ? s.to : from, step = this._d ? this._d.step : 0;
        const shift = (!dragging && from >= 0) ? (from < i && i <= to ? -step : (to <= i && i < from ? step : 0)) : 0;
        return {
          grab, drag, drop,
          shadow: dragging ? '0 12px 24px rgba(16,30,70,.18)' : '0 4px 0 ' + (good ? '#147D44' : bad ? '#F04438' : lifted ? '#3B0F7A' : '#E7E2F0'),
          tr: dragging ? 'none' : 'transform .18s ease-out',
          z: dragging ? '5' : '1',
          n: String(i + 1),
          label: L[k].label,
          sub: L[k].sub,
          amt: L[k].amt,
          showAmt: good,
          isCash: L[k].key === 'isCash', isSimple: L[k].key === 'isSimple', isCompound: L[k].key === 'isCompound',
          border: good ? '#12B76A' : bad ? '#F04438' : lifted ? '#5B21B6' : '#E7E2F0',
          bg: good ? '#DCFAE6' : bad ? '#FFE4E2' : lifted ? '#F1EBFB' : '#FFFFFF',
          edge: good ? '#147D44' : bad ? '#F04438' : lifted ? '#3B0F7A' : '#E7E2F0',
          rankBg: good ? '#147D44' : bad ? '#F04438' : '#5B21B6',
          rankEdge: good ? '#0F7A3A' : bad ? '#B42828' : '#3B0F7A',
          lift: dragging ? 'translateY(' + s.dy + 'px) scale(1.03)' : (shift ? 'translateY(' + shift + 'px)' : 'none'),
          up: () => { if (i > 0) move(i, -1); },
          down: () => { if (i < n - 1) move(i, 1); },
          upOff: i === 0, downOff: i === n - 1,
          upOp: i === 0 ? '0.4' : '1', downOp: i === n - 1 ? '0.4' : '1',
          upInk: '#4C1D95', downInk: '#4C1D95',
          upLabel: 'Move ' + L[k].label + ' up, now position ' + (i + 1) + ' of 3',
          downLabel: 'Move ' + L[k].label + ' down, now position ' + (i + 1) + ' of 3'
        };
      }),
      oLeast: O && O.ends ? O.ends[0] : 'Least money', oMost: O && O.ends ? O.ends[1] : 'Most money',
      oQ: O ? O.q : 'Start with \u20a610,000. Order these from least to most money after 10 years at 10% a year.', oWrong: O ? O.wrong : 'Cash never grows. Simple interest adds the same \u20a61,000 every year. Compound interest adds a little more each year, because past interest earns interest too. Move the items and check again.',
      oRight: O ? O.right : ['Cash: \u20a610,000. It earns nothing.', 'Simple: \u20a620,000. \u20a61,000 a year for 10 years.', 'Compound: \u20a625,937. \u20a610,000 \u00d7 1.1\u00b9\u2070 = \u20a625,937.42.'], oNote: O ? O.note : 'Assumes 10% every year, no withdrawals, no tax or fees, and ignores inflation.',
      listCls: good ? 'pop' : bad ? 'shake' : '',
      status: s.status,
      kThink: !s.checked, kOops: bad, kCheer: good,
      showCheck: !s.checked, showWrong: bad, showRight: good,
      checkOff: false, checkClass: 'btn b-blue',
      check: () => { if (window.FV) window.FV.answer('order', right, s.order.map((k) => L[k].label).join(', ')); this.setState({ checked: true }); },
      retry: () => this.setState({ checked: false, moved: null, status: 'Hold and drag the answers, then check again.' })
    };
  }
  renderVals() { const F = window.FV, base = this._rv() || {}; return F && F.flowVals && (F.inLesson() || 'order' !== 'compare') ? Object.assign({}, base, F.flowVals('order')) : Object.assign({ nextHref: 'UPLessonComplete.dc.html', fLabel: '', fN: '1', fTotal: '1', fPct: '100%', fFrom: '0%', fText: '' }, base); }
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily question</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="only light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 10px; display: flex; align-items: center; gap: 8px; flex: none"><a href="HomeNavy.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; font-size: 16px; font-weight: 600">Daily question</span><span style="padding: 4px 10px; border-radius: 999px; background: #E8EBEF; font-size: 12px; color: #5B6577">About 30 sec</span></div><p style="margin: 14px 24px 0; font-size: 12px; color: #5B6577; flex: none">{{today}}</p><h1 style="margin: 18px 24px 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; flex: none">{{q}}</h1><div role="radiogroup" aria-label="Answer" style="margin: 14px 24px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 58px; padding: 8px 12px; border-radius: 14px; border: {{o.bd}}; background: {{o.bg}}; font: inherit; font-size: 15px; color: #0B192C; cursor: pointer">{{o.t}}</button></sc-for></div><sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}"><p style="margin: 12px 24px 0; font-size: 13px; line-height: 1.6; color: #334155; flex: none">{{hint}}</p></sc-if><div style="margin-top: auto; padding: 16px 24px 26px; display: flex; gap: 10px; flex: none"><sc-if value="{{hasHint}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{toggleHint}}" aria-expanded="{{hintOpen}}" style="cursor: pointer; flex: none; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 1px solid #D5D9E0; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #0B192C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Hint</button></sc-if><a href="#" onClick="{{check}}" aria-disabled="{{noPick}}" style="flex: 1; height: 54px; border-radius: 14px; background: {{ctaBg}}; opacity: {{op}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Check answer</a></div>
<sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17,28,45,.45)" aria-hidden="true"></div>
    <section role="dialog" aria-modal="true" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 32px rgba(17,28,45,.18)">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D5D9E0"></span>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 999px; background: {{iconBg}}; color: {{tone}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">{{icon}}</span><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 20px; font-weight: 600; color: {{tone}}">{{title}}</strong><span style="font-size: 13px; color: #5B6577">{{sub}}</span></span></div>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #334155">{{why}}</p>
      
      <a href="AskFinvoraNavy.dc.html?q={{askQ}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #E5E7EB; text-decoration: none; color: #0B192C"><span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: #0B192C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{askTitle}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="{{ctaHref}}" style="height: 54px; border-radius: 14px; background: {{ctaBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
    </section>
  </sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-week2 */
  constructor(p) { super(p); this.state = { pick: null, res: null, hint: false }; }
  renderVals() {
    const F = window.FV, D = F ? F.LOOP.daily() : null; if (!D) return {};
    const r = this.state.res, ok = !!(r && r.ok), already = D.done && !r;
    const today = new Date(Date.now() + 3600000).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
    const p = this.state.pick;
    return { today, q: D.q, hint: D.hint, hasHint: !!D.hint && !already, showHint: this.state.hint && !r, hintOpen: String(this.state.hint), toggleHint: () => this.setState({ hint: !this.state.hint }),
      opts: D.opts.map((t, i) => ({ t, on: String(p === i), bd: r && i === D.right ? '2px solid #10B981' : r && p === i ? '2px solid #B9473F' : p === i ? '2px solid #0B192C' : '1px solid #D5D9E0', bg: r && i === D.right ? '#EAF6EF' : r && p === i ? '#FCEFED' : '#FFFFFF',
        pick: () => { if (!r && !already) this.setState({ pick: i }); } })),
      noPick: String(p === null), ctaBg: p === null && !already ? '#334155' : '#0B192C', op: p === null || already ? '.4' : '1',
      check: (e) => { e.preventDefault(); if (p === null || r || already) return; const good = p === D.right; F.LOOP.dailyAnswer(good); this.setState({ res: { ok: good } }); },
      answered: !!r || already, iconBg: ok || already ? '#DDF3E6' : '#FCEDEB', tone: ok || already ? '#10B981' : '#B9473F', icon: ok || already ? '✓' : '×',
      title: already ? 'Done for today' : ok ? 'Correct' : 'Not quite', sub: already || ok ? 'Daily question' : 'The right answer is ' + D.opts[D.right],
      why: already ? "You've done today's question. Come back tomorrow for a new one." : ok ? D.explain : ((D.whys && D.whys[p]) || D.explain),
      askTitle: 'Ask Finvora about this', askQ: encodeURIComponent(D.q), cta: 'Back to Home', ctaHref: 'HomeNavy.dc.html', ctaBg2: '#0B192C' };
  }
}
</script>
</body>
</html>

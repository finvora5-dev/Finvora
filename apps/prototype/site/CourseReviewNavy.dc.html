<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-review */
  st() { try { return JSON.parse(localStorage.getItem('fv.review.v1') || 'null') || {}; } catch (e) { return {}; } }
  put(o) { try { localStorage.setItem('fv.review.v1', JSON.stringify(Object.assign(this.st(), o))); } catch (e) {} }
  renderVals() { const b = this.st().best; return { best: b !== undefined ? ' Best so far: ' + b + '/8.' : '', start: () => this.put({ run: { i: 0, right: 0, missed: [] } }) }; }
}

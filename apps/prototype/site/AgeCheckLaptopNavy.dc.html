<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Age check (laptop)</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finvora"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; overflow: hidden">
  
  <main style="flex: 1; min-width: 0; padding: 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 0; width: 100%"><div style="padding: 12px 0 0; flex: none"><h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2">When were you born?</h1><p role="status" style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: {{ruleC}}; font-weight: {{ruleW}}">You need to be 18 or older to use Finvora.</p></div><div style="padding: 24px 0 0; display: grid; grid-template-columns: 1fr 1.4fr 1.2fr; gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Day<select aria-label="Day" value="{{dV}}" onChange="{{onD}}" style="height: 50px; border: 1px solid #D5D9E0; border-radius: 12px; padding: 0 10px; font-size: 16px; font-family: 'Geist Mono', monospace; background: #FFFFFF; color: #0B192C; width: 100%; box-sizing: border-box; border: {{bd}}"><sc-for list="{{days}}" as="o"><option value="{{o.v}}">{{o.t}}</option></sc-for></select></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Month<select aria-label="Month" value="{{mV}}" onChange="{{onM}}" style="height: 50px; border: 1px solid #D5D9E0; border-radius: 12px; padding: 0 10px; font-size: 16px; font-family: 'Geist Mono', monospace; background: #FFFFFF; color: #0B192C; width: 100%; box-sizing: border-box; border: {{bd}}"><sc-for list="{{months}}" as="o"><option value="{{o.v}}">{{o.t}}</option></sc-for></select></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Year<select aria-label="Year" value="{{yV}}" onChange="{{onY}}" style="height: 50px; border: 1px solid #D5D9E0; border-radius: 12px; padding: 0 10px; font-size: 16px; font-family: 'Geist Mono', monospace; background: #FFFFFF; color: #0B192C; width: 100%; box-sizing: border-box; border: {{bd}}"><sc-for list="{{years}}" as="o"><option value="{{o.v}}">{{o.t}}</option></sc-for></select></label></div><p style="margin: 14px 0 0; font-size: 13px; line-height: 1.6; color: #334155; flex: none">We only use this to check your age. It is never shown to anyone.</p><div style="margin-top: auto; padding: 16px 0 28px; display: flex; flex-direction: column; gap: 10px; flex: none"><a href="#" onClick="{{go}}" style="height: 52px; flex: none; border-radius: 12px; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; background-color: #0B192C">Continue</a></div></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
/* age-check */
  A() { return window.FV && window.FV.AUTH; }
  constructor(p) { super(p); const b = (this.A() && this.A().get().birth) || ''; this.state = { d: b ? String(+b.slice(8)) : '', m: b ? String(+b.slice(5, 7)) : '', y: b ? b.slice(0, 4) : '', tried: false }; }
  date() { const { d, m, y } = this.state; if (!d || !m || !y) return ''; const iso = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'), t = new Date(iso + 'T12:00:00Z'); return t.getUTCDate() === +d ? iso : ''; }
  renderVals() {
    const A = this.A(), iso = this.date(), young = !!iso && !!A && A.ageOf(iso) < 18, bad = this.state.tried && (!iso || young), yr = +new Date().getFullYear();
    const M = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const opt = (v, t, cur) => ({ v: String(v), t: String(t), sel: String(v) === String(cur) });
    return { days: [opt('', 'Day', this.state.d)].concat(Array.from({ length: 31 }, (_, i) => opt(i + 1, i + 1, this.state.d))),
      months: [opt('', 'Month', this.state.m)].concat(M.map((t, i) => opt(i + 1, t, this.state.m))),
      years: [opt('', 'Year', this.state.y)].concat(Array.from({ length: 100 }, (_, i) => opt(yr - i, yr - i, this.state.y))),
      dV: this.state.d, mV: this.state.m, yV: this.state.y,
      onD: (e) => this.setState({ d: e.target.value }), onM: (e) => this.setState({ m: e.target.value }), onY: (e) => this.setState({ y: e.target.value }),
      ruleC: bad || young ? '#B9473F' : '#5B6577', ruleW: bad || young ? '600' : '400', bd: bad && !iso ? '1.5px solid #B9473F' : '1px solid #D5D9E0',
      go: (e) => { e.preventDefault(); if (!A || !iso || young) { this.setState({ tried: true }); return; } A.setBirth(iso);
        const then = (/[?&]then=(\w+)/.exec(location.search) || [])[1]; location.href = then ? then + '.dc.html' : A.onboardNext(); } };
  }
}
</script>
</body>
</html>

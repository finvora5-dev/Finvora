<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B192C"><meta name="color-scheme" content="only light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #0B192C; color: #FFFFFF; padding-bottom: 14px; padding: 10px 20px 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="MarketsNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border: 1px solid #FFFFFF; border-radius: 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B6C0CF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="Search" type="search" enterkeyhint="search" value="{{q}}" onInput="{{onQ}}" style="background: transparent; color: #FFFFFF; flex: 1; min-width: 0; border: 0; font: inherit; font-size: 16px; outline: none">
    </label>
  </div>
  <sc-if value="{{hasCo}}" hint-placeholder-val="{{ false }}"><section style="padding: 18px 20px 0">
    <h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600; color: #5B6577; text-transform: uppercase; letter-spacing: .06em">Companies</h2>
    <sc-for list="{{co}}" as="c" hint-placeholder-count="4">
      <a href="CompanyNavy.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid #EDEFF2; text-decoration: none">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">{{c.n}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B6577">{{c.t}}</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-family: 'Geist Mono', monospace; font-size: 14px">{{c.p}}</span><span style="font-size: 12px; color: {{c.col}}">{{c.d}}</span></span>
      </a>
    </sc-for>
  </section></sc-if>
  <sc-if value="{{hasG}}" hint-placeholder-val="{{ false }}"><section style="padding: 18px 20px 0">
    <h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600; color: #5B6577; text-transform: uppercase; letter-spacing: .06em">Guides</h2>
    <sc-for list="{{guides}}" as="x" hint-placeholder-count="2"><a href="{{x.href}}" style="display: flex; flex-direction: column; justify-content: center; min-height: 52px; border-bottom: 1px solid #EDEFF2; text-decoration: none"><span style="font-size: 15px; font-weight: 500">{{x.t}}</span><span style="font-size: 12px; color: #5B6577">{{x.s}}</span></a></sc-for>
  </section></sc-if>
  <a href="{{askHref}}" style="margin: 20px 20px 0; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border: 1px solid #E5E7EB; border-radius: 12px; text-decoration: none; font-size: 15px"><span role="img" aria-label="Finvora" style="width: 22px; height: 22px; flex: none; border-radius: 6px; background: #0B192C; display: flex; align-items: center; justify-content: center; "><svg width="16" height="16" viewBox="75 55 490 560" aria-hidden="true"><path fill-rule="evenodd" fill="#FFFFFF" d="M242.0 604.4C201.7 583.5 170.8 561.1 144.5 533.8C86.6 473.8 65.8 398.1 87.5 326.5C97.2 294.7 114.7 266.1 139.9 241.0C151.6 229.4 169.0 214.8 169.0 216.7C169.0 217.1 168.3 221.0 167.5 225.4C165.1 237.6 161.2 266.0 159.5 283.0C157.6 301.9 156.3 338.0 157.6 338.0C158.1 338.0 160.1 335.7 162.0 332.9C166.5 326.1 182.3 309.6 190.7 302.7C217.1 281.3 251.1 266.1 303.0 252.6C312.6 250.1 336.7 244.2 356.5 239.5C432.1 221.6 482.6 206.0 524.9 187.6L535.2 183.1L534.5 186.8C532.9 195.3 524.4 218.5 518.0 231.5C497.7 273.0 467.9 303.0 425.9 324.0C373.4 350.4 304.4 359.2 223.0 350.0C206.0 348.1 177.7 343.6 163.6 340.6L156.7 339.2L157.3 359.8C159.9 449.6 189.9 530.7 244.5 595.5C258.0 611.6 258.3 612.0 257.4 612.0C256.9 612.0 250.0 608.6 242.0 604.4Z"/><path fill-rule="evenodd" fill="#00E676" d="M295.5 216.9C276.9 215.8 237.7 211.1 231.8 209.4C228.9 208.5 229.7 206.5 236.0 198.6C252.9 177.6 281.6 158.2 313.5 146.1C316.8 144.8 320.4 143.4 321.5 142.9C325.7 141.1 357.2 130.9 367.5 128.0C369.1 127.5 378.4 124.8 388.0 122.0C397.6 119.2 406.9 116.5 408.5 116.0C410.1 115.5 414.6 114.2 418.5 113.0C422.4 111.8 426.9 110.5 428.5 110.0C436.9 107.7 458.8 100.5 474.0 95.0C480.3 92.7 486.6 90.5 488.0 90.0C491.2 89.0 520.2 77.4 525.5 75.0C527.7 74.0 531.8 72.2 534.5 71.0C537.2 69.7 544.2 66.5 549.9 63.9C555.6 61.2 560.7 59.0 561.2 59.0C563.1 59.0 557.8 78.5 551.9 93.3C517.1 181.0 426.0 225.0 295.5 216.9Z"/></svg></span>{{askLabel}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-library */
  constructor(p) { super(p); const m = /[?&]q=([^&]*)/.exec(location.search); this.state = { q: m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : 'bank' }; }
  componentDidMount() { this.check(); }
  componentDidUpdate() { clearTimeout(this.t); this.t = setTimeout(() => this.check(), 700); }
  co(q) {
    const C = [['Zenith Bank', 'ZENITHBANK', '₦48.20', '▲ 3.4%', 1], ['Guaranty Trust Holding', 'GTCO', '₦52.10', '▲ 0.8%', 1], ['Access Holdings', 'ACCESSCORP', '₦22.40', '▼ 0.9%', 0], ['United Bank for Africa', 'UBA', '₦27.85', '▲ 1.1%', 1]];
    q = q.trim().toLowerCase(); const bank = /bank/.test(q);
    return C.filter(([n, t]) => q && (bank || n.toLowerCase().indexOf(q) >= 0 || t.toLowerCase().indexOf(q) >= 0));
  }
  res() { const L = window.FV && window.FV.LIB; return L && this.state.q.trim() ? L.search(this.state.q) : { results: [], didYouMean: null }; }
  check() { const q = this.state.q.trim(); if (q.length < 2) return; if (!this.co(q).length && !this.res().results.length) location.replace('EmptySearchNavy.dc.html?q=' + encodeURIComponent(q)); }
  renderVals() {
    const r = this.res(), c = this.co(this.state.q);
    const g = r.results.filter((x) => x.kind === 'article').slice(0, 5);
    return { q: this.state.q, onQ: (e) => this.setState({ q: e.target.value }), hasCo: !!c.length, hasG: !!g.length,
      co: c.map(([n, t, p, d, up]) => { const S = window.FV && window.FV.SIM, has = S && S.COMPANIES.some((x) => x.t === t), ch = has ? S.change(t) : 0; return has ? { n, t, p: '₦' + (S.price(t) / 100).toLocaleString('en-NG', { minimumFractionDigits: 2 }), d: (ch >= 0 ? '▲ ' : '▼ ') + Math.abs(ch).toFixed(1) + '%', col: ch >= 0 ? '#10B981' : '#B9473F' } : { n, t, p, d, col: up ? '#10B981' : '#B9473F' }; }), pxS: 1,
      guides: g.map((x) => ({ t: x.title, s: x.subtitle.replace('Term · ', ''), href: 'ArticleNavy.dc.html?a=' + x.id })),
      askHref: 'AskFinvoraNavy.dc.html?q=' + encodeURIComponent(this.state.q), askLabel: 'Ask Finvora AI: "' + this.state.q.trim() + '"' };
  }
}
</script>
</body>
</html>

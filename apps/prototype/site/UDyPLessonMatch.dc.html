<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finvora (purple and black): UPLessonMatch · desktop</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a:focus-visible,button:focus-visible{outline:3px solid #5B21B6;outline-offset:2px}
.btn{width:100%;height:54px;border:0;border-radius:16px;font:700 16px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;box-sizing:border-box}
.b-blue{background:#5B21B6;color:#FFFFFF;box-shadow:0 3px 0 #3B0F7A}
.b-green{background:#16884A;color:#FFFFFF;box-shadow:0 3px 0 #0F6B39}
.b-off{background:#E7E2F0;color:#615A6E;cursor:not-allowed}
.btn:active,.press:active{transform:translateY(2px)}
.opt{width:100%;min-height:64px;box-sizing:border-box;padding:0 16px;border-radius:16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.num{font-variant-numeric:tabular-nums}
@keyframes c-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes c-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes c-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes c-pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes c-fill{from{width:var(--from)}}
@media (prefers-reduced-motion:no-preference){
.btn,.press,.opt{transition:transform .15s ease-out,background-color .15s ease-out,border-color .15s ease-out}
.in{animation:c-in .3s cubic-bezier(.2,.8,.2,1) both}
.sheet{animation:c-up .26s cubic-bezier(.2,.8,.2,1)}
.shake{animation:c-shake .3s ease-out}
.pop{animation:c-pop .3s ease-out}
.fill{animation:c-fill .5s ease-out both}
}
</style>
<style>
.dside{width:88px;flex:none;position:relative;align-self:stretch;z-index:20}
.dpanel{position:absolute;left:0;top:0;bottom:0;width:88px;overflow:hidden;background:#FFFFFF;border-right:1.5px solid #E7E2F0;padding:24px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;transition:width .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.dside:hover .dpanel,.dside:focus-within .dpanel{width:264px;box-shadow:12px 0 32px rgba(14,11,20,.12)}
.dl{opacity:0;transition:opacity .15s;white-space:nowrap}
.dside:hover .dl,.dside:focus-within .dl{opacity:1;transition-delay:.06s}
.dnav{display:flex;align-items:center;gap:14px;height:52px;padding:0 14px;border-radius:16px;text-decoration:none;color:#38323F;font-weight:700;font-size:16px;white-space:nowrap}
.di{flex:none;display:inline-flex;width:28px;justify-content:center}
.dask{margin-top:18px;background:#F1EBFB;color:#4C1D95;border:1.5px solid #C4B5FD;box-shadow:0 3px 0 #C4B5FD}
.dnav:not([aria-current="page"]):not(.dask):hover{background:#F1EBFB;color:#4C1D95}
.dnav:not([aria-current="page"]):not(.dask):hover svg path{stroke:#4C1D95}
.dask:hover{background:#E9E0FB;border-color:#A78BFA}
.dnav[aria-current="page"]:hover{background:#4C1D95}
@media (prefers-reduced-motion:reduce){.dpanel,.dl{transition:none}}
.dnav[aria-current="page"]{background:#5B21B6;color:#FFFFFF;box-shadow:0 3px 0 #3B0F7A}
.dstat{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:14px;background:#FFFFFF;border:1.5px solid #E7E2F0;box-shadow:0 3px 0 #E7E2F0;font-weight:800;font-size:16px;color:#0E0B14;text-decoration:none}
</style>

.dside{width:88px;flex:none;position:relative;align-self:stretch;z-index:20}
.dpanel{position:absolute;left:0;top:0;bottom:0;width:88px;overflow:hidden;background:#FFFFFF;border-right:1.5px solid #E7E2F0;padding:24px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;transition:width .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.dside:hover .dpanel,.dside:focus-within .dpanel{width:264px;box-shadow:12px 0 32px rgba(14,11,20,.12)}

.dside:hover .dl,.dside:focus-within .dl{opacity:1;transition-delay:.06s}

.di{flex:none;display:inline-flex;width:28px;justify-content:center}
.dask{margin-top:18px;background:#F1EBFB;color:#4C1D95;border:1.5px solid #C4B5FD;box-shadow:0 3px 0 #C4B5FD}
.dnav:not([aria-current="page"]):not(.dask):hover{background:#F1EBFB;color:#4C1D95}
.dnav:not([aria-current="page"]):not(.dask):hover svg path{stroke:#4C1D95}
.dask:hover{background:#E9E0FB;border-color:#A78BFA}
.dnav[aria-current="page"]:hover{background:#4C1D95}
@media (prefers-reduced-motion:reduce){.dpanel,.dl{transition:none}}
.dnav[aria-current="page"]{background:#5B21B6;color:#FFFFFF;box-shadow:0 3px 0 #3B0F7A}
.dstat{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:14px;background:#FFFFFF;border:1.5px solid #E7E2F0;box-shadow:0 3px 0 #E7E2F0;font-weight:800;font-size:16px;color:#0E0B14;text-decoration:none}
</style>
</helmet>
<div class="root" style="color: #0E0B14; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; width: 1440px; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF">
  
  <div style="flex: 1; width: 100%; padding: 0 48px; box-sizing: border-box; display: flex; flex-direction: column">
  <header style="padding: 12px 16px 0; display: flex; align-items: center; gap: 12px">
    <a href="UDJourney.dc.html" class="press" aria-label="Close lesson and return to the journey" style="width: 44px; height: 44px; flex: none; margin-left: -10px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#615A6E" stroke-width="2.4" stroke-linecap="round"></path></svg></a>
    <div role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="{{fTotal}}" aria-valuenow="{{fN}}" aria-valuetext="{{fText}}" style="flex: 1; height: 8px; border-radius: 999px; background: #E7E2F0; overflow: hidden"><div class="fill" style="--from: {{fFrom}}; width: {{fPct}}; height: 100%; border-radius: 999px; background: #5B21B6"></div></div>
    <span style="font-size: 14px; font-weight: 700; color: #615A6E">{{fLabel}}</span>
  </header>
  <main style="padding: 24px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <span class="in" style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #4C1D95">Match the pairs</span>
    <h1 id="q" class="in" style="margin: -12px 0 0; font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em">Tap a word, then tap what it means</h1>
    <div role="group" aria-labelledby="q" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{terms}}" as="x" hint-placeholder-count="4">
          <button type="button" class="opt press {{x.cls}}" onClick="{{x.tap}}" disabled="{{x.done}}" aria-pressed="{{x.pressed}}" aria-label="{{x.aria}}" style="min-height: 76px; padding: 10px 12px; justify-content: center; text-align: center; font-size: 16px; font-weight: 800; line-height: 1.3; background: {{x.bg}}; border: 2px solid {{x.border}}; box-shadow: 0 4px 0 {{x.edge}}; color: {{x.ink}}">{{x.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{means}}" as="x" hint-placeholder-count="4">
          <button type="button" class="opt press {{x.cls}}" onClick="{{x.tap}}" disabled="{{x.done}}" aria-pressed="{{x.pressed}}" aria-label="{{x.aria}}" style="min-height: 76px; padding: 10px 12px; justify-content: center; text-align: center; font-size: 14px; font-weight: 600; line-height: 1.3; background: {{x.bg}}; border: 2px solid {{x.border}}; box-shadow: 0 4px 0 {{x.edge}}; color: {{x.ink}}">{{x.label}}</button>
        </sc-for>
      </div>
    </div>
    <p aria-live="polite" class="muted" style="margin: 0; font-size: 14px; font-weight: 600; color: #615A6E">{{status}}</p>
  </main>
  <div aria-live="polite" style="margin-top: auto; position: sticky; bottom: 0; z-index: 5">
    <sc-if value="{{showRight}}" hint-placeholder-val="{{false}}">
      <section class="sheet" style="padding: 20px 16px 22px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(16,30,70,.10); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #DCFAE6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" fill="none" stroke="#16884A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><h2 style="margin: 0; font-size: 19px; font-weight: 700; color: #0F6B39">All matched</h2></div>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #38323F">{{mDone}}</p>
        <a href="{{nextHref}}" class="btn b-green">Continue</a>
      </section>
    </sc-if>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: null, done: [], miss: null, last: null, misses: 0 }; }
  _rv() {
    const s = this.state;
    const LS = window.FV && window.FV.lesson ? window.FV.lesson() : null, MC = LS && LS.c && LS.c.match;
    const T = MC ? MC.terms : ['Principal', 'Interest rate', 'Compounding', 'Time horizon'];
    const M = MC ? [2, 0, 3, 1].map((k) => ({ k: k, t: MC.means[k] })) : [{ k: 2, t: 'Earning interest on past interest' }, { k: 0, t: 'The money you start with' }, { k: 3, t: 'How long the money stays invested' }, { k: 1, t: 'The % paid per year' }];
    const all = s.done.length === 4;
    const tone = (done, sel, miss, fresh) => done ? (fresh ? ['#DCFAE6', '#12B76A', '#16884A', '#0F6B39'] : ['#F5F3F8', '#E7E2F0', '#E7E2F0', '#615A6E']) : miss ? ['#FFE4E2', '#F04438', '#F04438', '#B42828'] : sel ? ['#F1EBFB', '#5B21B6', '#3B0F7A', '#4C1D95'] : ['#FFFFFF', '#E7E2F0', '#E7E2F0', '#0E0B14'];
    return {
      terms: T.map((t, i) => { const d = s.done.includes(i), sel = s.sel === i, c = tone(d, sel, false, s.last === i);
        return { label: t, done: d, pressed: sel ? 'true' : 'false', aria: t + (d ? ', matched' : sel ? ', selected' : ''), bg: c[0], border: c[1], edge: c[2], ink: c[3], cls: d && s.last === i ? 'pop' : '',
          tap: () => { if (!d) this.setState({ sel: i, miss: null }); } }; }),
      means: M.map((m, j) => { const d = s.done.includes(m.k), miss = s.miss === j, c = tone(d, false, miss, s.last === m.k);
        return { label: m.t, done: d, pressed: 'false', aria: m.t + (d ? ', matched' : ''), bg: c[0], border: c[1], edge: c[2], ink: c[3], cls: miss ? 'shake' : d && s.last === m.k ? 'pop' : '',
          tap: () => { if (d) return; if (s.sel === null) { this.setState({ miss: null }); return; } if (m.k === s.sel) { const nd = s.done.concat([m.k]); if (nd.length === 4 && window.FV) window.FV.answer('match', s.misses === 0, s.misses ? s.misses + ' wrong taps' : 'All matched first time'); this.setState({ done: nd, last: m.k, sel: null, miss: null }); } else this.setState({ miss: j, misses: s.misses + 1 }); } }; }),
      status: all ? 'All 4 pairs matched.' : s.miss !== null ? 'Not a pair. Try another meaning.' : s.sel !== null ? 'Now tap what "' + T[s.sel] + '" means.' : s.done.length + ' of 4 matched',
      showRight: all, mDone: MC ? MC.done : 'These four words are the building blocks of every interest calculation.'
    };
  }
  renderVals() { const F = window.FV, base = this._rv() || {}; return F && F.flowVals && (F.inLesson() || ['compare', 'myth'].indexOf('match') < 0) ? Object.assign({}, base, F.flowVals('match')) : Object.assign({ nextHref: 'UPLessonComplete.dc.html', fLabel: '', fN: '1', fTotal: '1', fPct: '100%', fFrom: '0%', fText: '' }, base); }
}
</script>
</body>
</html>

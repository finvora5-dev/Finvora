<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell shares</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finvora"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 8px; display: flex; align-items: center; gap: 4px; flex: none"><a href="PracticeCompanyNavy.dc.html?t={{t}}" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Sell {{name}}</h1><span style="display: inline-flex; padding: 4px 10px; border-radius: 999px; background: #DDF3E6; color: #047857; font-size: 12px; font-weight: 600">Simulated</span></div><div style="margin: 10px 24px 0; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; flex: none; "><div style="display: flex; align-items: center; gap: 12px"><span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #E8EBEF; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500">{{ab}}</span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{name}}</span><span style="font-size: 12px; color: #5B6577">You own {{own}}</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-family: 'Geist Mono', monospace; font-size: 15px">{{price}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 3px 6px; border-radius: 6px; background: #DDF3E6; color: #047857">{{chg}}</span></span></div></div><div style="margin: 18px 24px 0; flex: none"><label style="font-size: 13px; font-weight: 500">Shares to sell</label><div style="margin-top: 6px; display: flex; gap: 10px"><button type="button" aria-label="Fewer shares" onClick="{{dec}}" aria-label="Fewer" style="width: 54px; height: 58px; border: 1px solid #D5D9E0; border-radius: 14px; background: #FFFFFF; font: inherit; font-size: 22px; color: #0B192C">−</button><span style="flex: 1; height: 58px; border: 2px solid #0B192C; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 24px">{{q}}</span><button type="button" aria-label="More shares" onClick="{{inc}}" aria-label="More" style="width: 54px; height: 58px; border: 1px solid #D5D9E0; border-radius: 14px; background: #FFFFFF; font: inherit; font-size: 22px; color: #0B192C">+</button></div><div style="margin-top: 10px; display: flex; gap: 8px"><button type="button" onClick="{{p25}}" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #0B192C; background: #0B192C; color: #FFFFFF; font: inherit; font-size: 13px">25%</button><button type="button" onClick="{{p50}}" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px">50%</button><button type="button" onClick="{{p75}}" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px">75%</button><button type="button" onClick="{{pAll}}" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px">All</button></div></div><div style="margin: 16px 24px 0; padding: 8px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; flex: none; "><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 0; font-size: 14px"><span style="color: #5B6577">Sale value</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">{{gross}}</span></div><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">Fees (simulated)</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">{{fee}}</span></div><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">You receive</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">{{net}}</span></div><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">Gain on these shares</span><span style="font-family: 'Geist Mono', monospace; color: #047857">{{gain}}</span></div></div><div style="margin-top: auto; padding: 0 24px 26px; display: flex; flex-direction: column; gap: 10px; flex: none"><p style="margin: 0; text-align: center; font-size: 12px; color: #5B6577">Simulated money. Nothing is sold on the NGX.</p><a href="#" onClick="{{go}}" style="flex: none; height: 54px; border-radius: 14px; background: #0B192C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Review sale</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-practice */
  S() { return window.FV && window.FV.SIM; }
  n(k) { return '₦' + (k / 100).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  ch(p) { return (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%'; }
  up(p) { return p >= 0; }
  ab(t) { return t.slice(0, 3); }
  tk() { const m = /[?&]t=([A-Z]+)/.exec(location.search); return m ? m[1] : 'ZENITHBANK'; }
  constructor(p) { super(p); const S = this.S(), h = S ? S.held(this.tk()) : 0; this.state = { q: Math.max(1, Math.round(h / 4)) }; this.key = 'k-' + Date.now(); }
  renderVals() {
    const S = this.S(); if (!S) return {}; const t = this.tk(), c = S.company(t), p = S.price(t), h = S.held(t), q = Math.min(this.state.q, h), g = q * p, fee = S.fee(g), pos = S.valuation().positions.filter((x) => x.ticker === t)[0];
    const gain = pos ? g - Math.round(pos.avgCostKobo * q) - fee : 0, setQ = (x) => this.setState({ q: Math.max(1, Math.min(h, x)) });
    return { t, name: c.name, ab: this.ab(t), own: h.toLocaleString('en-NG') + (h === 1 ? ' share' : ' shares'), price: this.n(p), chg: this.ch(S.change(t)), q: q.toLocaleString('en-NG'), gross: this.n(g), fee: this.n(fee), net: this.n(g - fee),
      gain: (gain >= 0 ? '▲ ' : '▼ ') + this.n(Math.abs(gain)), dec: () => setQ(q - 1), inc: () => setQ(q + 1), p25: () => setQ(Math.round(h / 4)), p50: () => setQ(Math.round(h / 2)), p75: () => setQ(Math.round(h * 3 / 4)), pAll: () => setQ(h),
      go: (e) => { e.preventDefault(); if (!q) return; if (!S.isOpen()) { location.href = 'MarketClosedNavy.dc.html?side=sell&t=' + t + '&q=' + q; return; } const r = S.trade('sell', t, q, this.key); if (r.ok) location.href = 'PracticeDoneNavy.dc.html'; } };
  }
}
</script>
</body>
</html>

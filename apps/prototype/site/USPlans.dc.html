<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finvora (purple and black): Plans</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.root{background:#FFFFFF;color:#0E0B14;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:#4C1D95}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #5B21B6;outline-offset:2px}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em;margin:0}
.card{background:#FFFFFF;border:1.5px solid #E7E2F0;box-shadow:0 3px 0 #E7E2F0;border-radius:20px;box-sizing:border-box}
.muted{color:#615A6E}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.btn{width:100%;height:54px;border:0;border-radius:16px;background:#5B21B6;color:#FFFFFF;font:700 16px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;box-shadow:0 3px 0 #3B0F7A;box-sizing:border-box}
.btn-w{background:#FFFFFF;color:#4C1D95;box-shadow:0 3px 0 #E7E2F0;border:1.5px solid #E7E2F0}
.btn-g{background:#16884A;box-shadow:0 3px 0 #0F6B39}
.btn-off{background:#E7E2F0;color:#615A6E;box-shadow:none;cursor:not-allowed}
.btn:active,.press:active{transform:translateY(2px)}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #E7E2F0;background:#FFFFFF;color:#0E0B14;display:inline-flex;align-items:center;gap:6px;font:600 14px 'Plus Jakarta Sans',sans-serif;text-decoration:none;box-sizing:border-box;cursor:pointer}
.chip-on{background:#5B21B6;border-color:#5B21B6;color:#FFFFFF}
.tile{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:44px;text-decoration:none;color:#0E0B14}
.li+.li{border-top:1px solid #E7E2F0}
.bar{height:8px;border-radius:999px;background:#E7E2F0;overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:#5B21B6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field{height:54px;border-radius:14px;border:1.5px solid #E7E2F0;background:#FFFFFF;padding:0 14px;font:500 16px 'Plus Jakarta Sans',sans-serif;color:#0E0B14;box-sizing:border-box;width:100%}
@keyframes p-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes p-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes p-flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.05,1.1) rotate(-3deg)}60%{transform:scale(.97,1.03) rotate(2deg)}}
@keyframes p-fill{from{width:0}}
@keyframes p-burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}}
@keyframes p-dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
.btn,.press,.chip{transition:transform .15s ease-out}
.in{animation:p-in .3s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:p-pop .4s cubic-bezier(.2,.8,.2,1) both}
.flick{animation:p-flick 1.8s ease-in-out infinite;transform-origin:50% 90%}
.fill{animation:p-fill .6s ease-out .2s both}
.bit{animation:p-burst .9s cubic-bezier(.15,.7,.3,1) .15s both}
.dot{animation:p-dots 1.2s ease-in-out infinite}
}
</style>
<style>
.sw{width:46px;height:28px;flex:none;border-radius:999px;border:0;padding:3px;cursor:pointer;display:flex;box-sizing:border-box}
.sw span{width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg{flex:1;height:44px;border:0;border-radius:12px;font:700 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
</style>
</helmet>
<div class="root" style="width: 390px; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; position: relative">
  <header style="padding: 12px 16px 0; display: flex; align-items: center; gap: 8px"><a href="UPMe.dc.html" class="press" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="#0E0B14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></a><h1 style="font-size: 22px">Plans</h1></header>
  <main style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px"><div style="width: 72px; height: 72px; flex: none"><dc-import name="GKobo" mood="cheer" size="72" hint-size="72px,72px"></dc-import></div><p style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4">Learn without limits with Finvora Plus.</p></div>
    <div role="radiogroup" aria-label="Billing period" style="display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #E7E2F0">
      <button type="button" role="radio" class="seg" aria-checked="{{mOn}}" onClick="{{pickM}}" style="background: {{mBg}}; color: {{mFg}}">Monthly</button>
      <button type="button" role="radio" class="seg" aria-checked="{{yOn}}" onClick="{{pickY}}" style="background: {{yBg}}; color: {{yFg}}">Yearly <span style="font-size: 12px; opacity: .9">2 months free</span></button>
    </div>
    <section class="card" style="padding: 18px; border: 2.5px solid #5B21B6; box-shadow: 0 4px 0 #3B0F7A; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center"><h2 style="font-size: 20px">Plus</h2><span class="tag" style="background: #5B21B6; color: #FFFFFF">Most popular</span></div>
      <div class="num"><span style="font-size: 32px; font-weight: 800">{{price}}</span><span class="muted" style="font-weight: 600"> {{per}}</span></div>
      <span class="muted" style="font-size: 14px; margin-top: -6px">{{note}}</span>
      <ul style="list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="#16884A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>All Worlds and Boss challenges</span></li><li style="display: flex; gap: 10px; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="#16884A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Unlimited Ask Fin</span></li><li style="display: flex; gap: 10px; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="#16884A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Full simulator</span></li><li style="display: flex; gap: 10px; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="#16884A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Offline lessons</span></li></ul>
    </section>
    <section class="card" style="padding: 18px; display: flex; justify-content: space-between; align-items: center"><div><h2 style="font-size: 18px">Free</h2><span class="muted" style="font-size: 14px">Your current plan</span></div><span class="num" style="font-size: 22px; font-weight: 800">₦0</span></section>
    <a href="USCompare.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">Compare plans</a>
  </main>
  <div style="margin-top: auto; position: sticky; bottom: 0; padding: 12px 16px 22px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px"><a href="USUpgrade.dc.html" class="btn">Continue with Plus</a><span class="muted" style="font-size: 13px; text-align: center">Cancel any time in Me, Your plan.</span></div>
  
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  
  constructor(p) { super(p); this.state = { y: false }; }
  renderVals() {
    const naira = k => '₦' + Math.floor(k / 100).toLocaleString('en-NG') + (k % 100 ? '.' + String(k % 100).padStart(2, '0') : '');
    const y = this.state.y; const M = 150000, Y = 1500000;
    return { mOn: y ? 'false' : 'true', yOn: y ? 'true' : 'false', mBg: y ? '#FFFFFF' : '#5B21B6', mFg: y ? '#0E0B14' : '#FFFFFF', yBg: y ? '#5B21B6' : '#FFFFFF', yFg: y ? '#FFFFFF' : '#0E0B14',
      price: naira(y ? Y : M), per: y ? '/ year' : '/ month', note: y ? 'Works out at ' + naira(Math.round(Y / 12)) + ' a month' : 'Billed every month',
      pickM: () => this.setState({ y: false }), pickY: () => this.setState({ y: true }) };
  }
}
</script>
</body>
</html>

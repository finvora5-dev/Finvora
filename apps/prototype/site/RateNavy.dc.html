sed="{{on2}}" onClick="{{pick2}}" style="flex: 1; height: 52px; border-radius: 12px; border: {{bd2}}; background: {{bg2}}; cursor: pointer; font: inherit; font-size: 13px">Good</button><button aria-label="Great" style="flex: 1; height: 52px; border-radius: 12px; border: 2px solid #0B192C; background: #EEF0F3; font: inherit; font-size: 13px">Great</button></div><textarea aria-label="Comment" placeholder="Anything to add? (optional)" style="height: 80px; border: 1px solid #D5D9E0; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; resize: none"></textarea><a onClick="{{send}}" href="LessonDoneNavy.dc.html" style="height: 52px; flex: none; border-radius: 12px; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; background-color: #0B192C">Send</a></div></div>

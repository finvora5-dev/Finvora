<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice market list</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B192C">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}a:hover{color: #047857}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="background: #0B192C; color: #FFFFFF; padding: 12px 20px 18px; flex: none"><div style="display: flex; align-items: center; gap: 4px; margin-left: -12px"><a href="PracticeNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Find a company</h1><span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(95,211,166,.16); color: #00E676; font-size: 12px; font-weight: 600">Simulated money</span></div><label style="margin-top: 12px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 14px; border-radius: 14px; background: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input aria-label="Search companies or tickers" placeholder="Search companies or tickers" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none; color: #0B192C"></label></header><section style="margin: 16px 20px 0; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; display: flex; align-items: center; justify-content: space-between">
  <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6577">Cash to invest</span><span style="font-family: 'Geist Mono', monospace; font-size: 20px; font-weight: 500">{{cash}}</span></span>
  <a href="PracticeNavy.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #D5D9E0; display: flex; align-items: center; font-size: 13px; font-weight: 500; text-decoration: none">My portfolio</a>
</section>
<section style="padding: 18px 20px 0">
  <div style="display: flex; gap: 8px; overflow-x: auto"><button style="height: 36px; padding: 0 14px; flex: none; border-radius: 999px; border: 1px solid #0B192C; background: #0B192C; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">Most traded</button><button style="height: 36px; padding: 0 14px; flex: none; border-radius: 999px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px; font-weight: 500">Risers</button><button style="height: 36px; padding: 0 14px; flex: none; border-radius: 999px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px; font-weight: 500">Fallers</button><button style="height: 36px; padding: 0 14px; flex: none; border-radius: 999px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px; font-weight: 500">Banking</button><button style="height: 36px; padding: 0 14px; flex: none; border-radius: 999px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px; font-weight: 500">Telecoms</button></div>
  <p style="margin: 12px 0 0; font-size: 12px; color: #5B6577">Prices delayed 15 minutes · illustrative</p>
  <sc-for list="{{rows}}" as="x" hint-placeholder-count="3"><a href="{{x.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #EDEFF2; text-decoration: none; color: #0B192C"><span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #E8EBEF; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; color: #0B192C">{{x.ab}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.name}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5B6577">{{x.t}}</span></span><svg width="64" height="28" viewBox="0 0 64 28" aria-hidden="true"><path d="M0 16 L6 17 L12 18 L17 21 L23 18 L29 18 L35 20 L41 22 L47 22 L52 18 L58 17 L64 20" fill="none" stroke="#10B981" stroke-width="1.6" stroke-linecap="round"></path></svg><span style="width: 84px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-family: 'Geist Mono', monospace; font-size: 14px">{{x.p}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 3px 6px; border-radius: 6px; background: {{x.bg}}; color: {{x.c}}">{{x.ch}}</span></span></a></sc-for>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-practice */
  S() { return window.FV && window.FV.SIM; }
  n(k) { return '₦' + (k / 100).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  ch(p) { return (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%'; }
  up(p) { return p >= 0; }
  ab(t) { return t.slice(0, 3); }
  tk() { const m = /[?&]t=([A-Z]+)/.exec(location.search); return m ? m[1] : 'ZENITHBANK'; }
  renderVals() {
    const S = this.S(); if (!S) return {};
    return { cash: this.n(S.get().cashKobo), rows: S.COMPANIES.map((c) => { const ch = S.change(c.t); return { href: 'PracticeCompanyNavy.dc.html?t=' + c.t, ab: this.ab(c.t), name: c.name, t: c.t, p: this.n(S.price(c.t)), ch: this.ch(ch), bg: ch >= 0 ? '#DDF3E6' : '#FCEDEB', c: ch >= 0 ? '#047857' : '#B9473F' }; }) };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson order</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B192C">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}a:hover{color: #047857}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 10px; display: flex; align-items: center; gap: 10px; flex: none"><a href="LearnNavy.dc.html" aria-label="Close lesson" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span style="flex: 1; display: flex; gap: 5px" role="img" aria-label="{{fText}}"><sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 5px; border-radius: 999px; background: {{b.c}}"></span></sc-for></span></div><div style="padding: 20px 24px 0; flex: none"><span style="font-size: 13px; color: #5B6577">{{kicker}}</span></div><h1 style="margin: 6px 24px 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; flex: none">{{q}}</h1><sc-if value="{{hasEnds}}" hint-placeholder-val="{{ false }}"><p style="margin: 16px 24px 0; font-size: 12px; color: #5B6577; flex: none">{{endA}}</p></sc-if><ol id="ord" aria-label="Items to put in order" style="margin: 8px 24px 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; flex: none; touch-action: none"><sc-for list="{{items}}" as="x" hint-placeholder-count="4"><li tabindex="0" role="button" aria-roledescription="sortable item" aria-pressed="{{x.held}}" aria-label="{{x.aria}}" data-i="{{x.i}}" onPointerDown="{{x.down}}" onKeyDown="{{x.key}}" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: {{x.bd}}; box-shadow: {{x.sh}}; transform: {{x.tf}}; transition: {{x.tr}}; cursor: grab; user-select: none; -webkit-user-select: none; position: relative; z-index: {{x.z}}"><span style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: {{x.nb}}; color: {{x.nc}}; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 13px">{{x.n}}</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{x.t}}</span><sc-if value="{{x.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5B6577">{{x.sub}}</span></sc-if></span><svg width="18" height="18" viewBox="0 0 24 24" fill="#8A93A3" aria-label="Drag to reorder"><circle cx="9" cy="6" r="1.5"></circle><circle cx="15" cy="6" r="1.5"></circle><circle cx="9" cy="12" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="9" cy="18" r="1.5"></circle><circle cx="15" cy="18" r="1.5"></circle></svg></li></sc-for></ol><sc-if value="{{hasEnds}}" hint-placeholder-val="{{ false }}"><p style="margin: 8px 24px 0; font-size: 12px; color: #5B6577; flex: none">{{endB}}</p></sc-if><p role="status" aria-live="polite" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{live}}</p><p style="margin: 12px 24px 0; font-size: 13px; line-height: 1.6; color: #334155; flex: none">Drag to reorder. Keyboard: Space to pick up, arrows to move.</p><sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}"><p style="margin: 8px 24px 0; font-size: 14px; line-height: 1.5; color: #334155; flex: none">{{hint}}</p></sc-if><div style="margin-top: auto; padding: 16px 24px 26px; display: flex; gap: 10px; flex: none"><button type="button" onClick="{{toggleHint}}" aria-expanded="{{hintOpen}}" style="cursor: pointer; flex: none; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 1px solid #D5D9E0; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #0B192C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Hint</button><a href="#" onClick="{{check}}" style="flex: 1; height: 54px; border-radius: 14px; background: #0B192C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Check order</a></div>
<sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17,28,45,.45)" aria-hidden="true"></div>
    <section role="dialog" aria-modal="true" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 32px rgba(17,28,45,.18)">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D5D9E0"></span>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 999px; background: {{iconBg}}; color: {{tone}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">{{icon}}</span><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 20px; font-weight: 600; color: {{tone}}">{{title}}</strong><span style="font-size: 13px; color: #5B6577">{{sub}}</span></span></div>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #334155">{{why}}</p>
      
      <a href="AskFinvoraNavy.dc.html?q={{askQ}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #E5E7EB; text-decoration: none; color: #0B192C"><span style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: #0B192C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{askTitle}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="{{ctaHref}}" onClick="{{again}}" style="height: 54px; border-radius: 14px; background: {{ctaBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
    </section>
  </sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-steps */
  drawnStep = 4;
  F() { return window.FV; }
  inL() { return !!(window.FV && window.FV.inLesson() && /[?&]in=1/.test(location.search)); }
  L() { return this.F() ? this.F().lesson() : { title: '', c: null }; }
  flow(kind, drawnNext) {
    const F = this.F();
    if (!F || !this.inL()) return { fText: '', bars: [0, 1, 2, 3, 4].map((i) => ({ c: i < this.drawnStep - 1 ? '#10B981' : i === this.drawnStep - 1 ? '#0B192C' : '#E2E5EA' })), next: drawnNext, n: this.drawnStep, total: 5 };
    const v = F.flowVals(kind), n = +v.fN, t = +v.fTotal;
    return { fText: v.fText, next: v.nextHref, n, total: t, bars: Array.from({ length: t }, (_, i) => ({ c: i < n - 1 ? '#10B981' : i === n - 1 ? '#0B192C' : '#E2E5EA' })) };
  }
  constructor(p) { super(p); const c = this.data(); this.state = { order: c.start.slice(), held: null, drag: null, res: null, hint: false, live: '' }; }
  data() {
    const L = this.L(), c = this.inL() && L.c && L.c.order;
    if (c) return { q: c.q, items: c.items, start: c.start.slice(), wrong: c.wrong, right: c.right, note: c.note, ends: c.ends || null, title: L.title };
    return { q: 'Put the steps to buy NGX shares in order', items: [['Open an account with a stockbroker'], ['Get a CSCS number'], ['Fund your account'], ['Place a buy order']], start: [1, 0, 3, 2], wrong: 'A broker account comes first, then the CSCS number, then money, then the order.', right: ['You need a stockbroker to trade on the NGX.', 'The CSCS number holds your shares.', 'Fund the account, then place the order.'], note: '', ends: null, title: 'Buying shares' };
  }
  move(from, to) { const o = this.state.order.slice(); if (to < 0 || to >= o.length || from === to) return; const [x] = o.splice(from, 1); o.splice(to, 0, x); this.setState({ order: o, held: this.state.held === null ? null : to, live: this.data().items[x][0] + ', position ' + (to + 1) + ' of ' + o.length }); }
  down(e, idx) {
    if (this.state.res) return; const li = e.currentTarget, ol = li.parentNode, startY = e.clientY, H = li.offsetHeight + 10;
    let cur = idx, moved = false; li.setPointerCapture && li.setPointerCapture(e.pointerId);
    const mv = (ev) => { const dy = ev.clientY - startY; if (!moved && Math.abs(dy) < 4) return; moved = true;
      const target = Math.max(0, Math.min(this.state.order.length - 1, idx + Math.round(dy / H)));
      if (target !== cur) { this.move(cur, target); cur = target; }
      this.setState({ drag: { i: cur, dy: dy - (cur - idx) * H } }); };
    const up = () => { li.removeEventListener('pointermove', mv); li.removeEventListener('pointerup', up); li.removeEventListener('pointercancel', up); this.setState({ drag: null }); };
    li.addEventListener('pointermove', mv); li.addEventListener('pointerup', up); li.addEventListener('pointercancel', up);
  }
  key(e, idx) {
    if (this.state.res) return; const h = this.state.held;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.setState({ held: h === idx ? null : idx, live: h === idx ? 'Dropped' : 'Picked up. Use the arrow keys to move.' }); return; }
    if (h === idx && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); const to = idx + (e.key === 'ArrowUp' ? -1 : 1); this.move(idx, to); setTimeout(() => { const el = document.querySelector('#ord li[data-i="' + Math.max(0, Math.min(this.state.order.length - 1, to)) + '"]'); if (el) el.focus(); }, 0); }
  }
  check() {
    if (this.state.res) return; const o = this.state.order, ok = o.every((v, i) => v === i);
    if (this.F() && this.inL()) this.F().answer('order', ok, o.join(','));
    this.setState({ res: { ok }, held: null });
  }
  renderVals() {
    const d = this.data(), fl = this.flow('order', 'LessonScenarioNavy.dc.html'), r = this.state.res, ok = !!(r && r.ok), dr = this.state.drag;
    const items = this.state.order.map((v, i) => { const it = d.items[v], held = this.state.held === i, dragging = !!(dr && dr.i === i);
      return { i: String(i), n: String(i + 1), t: it[0], sub: it[1] || '', hasSub: !!it[1], held: String(held), aria: it[0] + ', position ' + (i + 1) + ' of ' + d.items.length,
        bd: held || dragging ? '2px solid #0B192C' : '1px solid #D5D9E0', sh: held || dragging ? '0 10px 22px rgba(17,28,45,.14)' : 'none',
        tf: dragging ? 'translateY(' + dr.dy + 'px)' : 'none', tr: dragging ? 'none' : 'transform 200ms cubic-bezier(.2,.8,.2,1)', z: dragging ? '2' : '0',
        nb: held || dragging ? '#0B192C' : '#E8EBEF', nc: held || dragging ? '#FFFFFF' : '#5B6577',
        down: (e) => this.down(e, i), key: (e) => this.key(e, i) }; });
    return Object.assign(fl, { kicker: d.title + ' · Order', q: d.q, items, hasEnds: !!d.ends, endA: d.ends ? d.ends[0] : '', endB: d.ends ? d.ends[1] : '', live: this.state.live,
      hint: d.wrong, showHint: this.state.hint && !r, hintOpen: String(this.state.hint), toggleHint: () => this.setState({ hint: !this.state.hint }),
      check: (e) => { e.preventDefault(); this.check(); },
      answered: !!r, iconBg: ok ? '#DDF3E6' : '#FCEDEB', tone: ok ? '#10B981' : '#B9473F', icon: ok ? '✓' : '×',
      title: ok ? 'Correct' : 'Not quite', sub: 'Question ' + fl.n + ' of ' + fl.total,
      why: ok ? d.right.join(' ') + (d.note ? ' ' + d.note : '') : d.wrong,
      askTitle: 'Ask Finvora to explain this order', askQ: encodeURIComponent(d.q),
      again: (e) => { if (!ok) { e.preventDefault(); this.setState({ res: null }); } }, cta: ok ? 'Continue' : 'Try again', ctaHref: ok ? fl.next : '#', ctaBg: '#0B192C' });
  }
}
</script>
</body>
</html>

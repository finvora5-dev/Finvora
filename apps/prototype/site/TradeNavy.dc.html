<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buy shares</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finvora"><meta name="color-scheme" content="light">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}input::placeholder{color:#6B7486}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 10px 20px 0 8px; display: flex; align-items: center; gap: 4px; flex: none"><a href="PracticeCompanyNavy.dc.html?t={{t}}" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Buy {{name}}</h1><span style="display: inline-flex; padding: 4px 10px; border-radius: 999px; background: #DDF3E6; color: #047857; font-size: 12px; font-weight: 600">Simulated</span></div><div style="margin: 10px 24px 0; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; flex: none; "><div style="display: flex; align-items: center; gap: 12px"><span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #E8EBEF; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500">{{ab}}</span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{name}}</span><span style="font-size: 12px; color: #5B6577">Cash available {{cash}}</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-family: 'Geist Mono', monospace; font-size: 15px">{{price}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 3px 6px; border-radius: 6px; background: #DDF3E6; color: #047857">{{chg}}</span></span></div></div><div style="margin: 18px 24px 0; flex: none"><label style="font-size: 13px; font-weight: 500">Shares to buy</label><div style="margin-top: 6px; display: flex; gap: 10px"><button type="button" aria-label="Fewer shares" onClick="{{dec}}" aria-label="Fewer" style="width: 54px; height: 58px; border: 1px solid #D5D9E0; border-radius: 14px; background: #FFFFFF; font: inherit; font-size: 22px; color: #0B192C">−</button><span style="flex: 1; height: 58px; border: 2px solid #0B192C; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 24px">{{q}}</span><button type="button" aria-label="More shares" onClick="{{inc}}" aria-label="More" style="width: 54px; height: 58px; border: 1px solid #D5D9E0; border-radius: 14px; background: #FFFFFF; font: inherit; font-size: 22px; color: #0B192C">+</button></div><div style="margin-top: 10px; display: flex; gap: 8px"><button type="button" onClick="{{set10}}" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px">10</button><button type="button" onClick="{{set50}}" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px">50</button><button type="button" onClick="{{set100}}" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px">100</button><button type="button" onClick="{{set500}}" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #D5D9E0; background: #FFFFFF; color: #0B192C; font: inherit; font-size: 13px">500</button></div></div><div style="margin: 16px 24px 0; padding: 8px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E7EB; flex: none; "><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 0; font-size: 14px"><span style="color: #5B6577">Price per share</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">{{price}}</span></div><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">Shares</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">{{q}}</span></div><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">Fees (simulated)</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">{{fee}}</span></div><div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #EDEFF2; font-size: 14px"><span style="color: #5B6577">Total</span><span style="font-family: 'Geist Mono', monospace; color: #0B192C">{{total}}</span></div></div><div style="margin-top: auto; padding: 0 24px 26px; display: flex; flex-direction: column; gap: 10px; flex: none"><p style="margin: 0; text-align: center; font-size: 12px; color: #5B6577">Simulated money. Nothing is bought on the NGX.</p><sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; text-align: center; font-size: 13px; color: #B9473F">{{err}}</p></sc-if><a href="#" onClick="{{go}}" style="flex: none; height: 54px; border-radius: 14px; background: #0B192C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Review order</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-practice */
  S() { return window.FV && window.FV.SIM; }
  n(k) { return '₦' + (k / 100).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  ch(p) { return (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%'; }
  up(p) { return p >= 0; }
  ab(t) { return t.slice(0, 3); }
  tk() { const m = /[?&]t=([A-Z]+)/.exec(location.search); return m ? m[1] : 'ZENITHBANK'; }
  constructor(p) { super(p); const m = /[?&]q=(\d+)/.exec(location.search); this.state = { q: m ? +m[1] : 100, err: '' }; this.key = 'k-' + Date.now(); }
  renderVals() {
    const S = this.S(); if (!S) return {}; const t = this.tk(), c = S.company(t), p = S.price(t), q = this.state.q, g = q * p, fee = S.fee(g), tot = g + fee, cash = S.get().cashKobo;
    let max = Math.floor(cash / p); while (max > 0 && max * p + S.fee(max * p) > cash) max--;
    const setQ = (x) => this.setState({ q: Math.max(1, x), err: '' });
    return { t, name: c.name, ab: this.ab(t), cash: this.n(cash), price: this.n(p), chg: this.ch(S.change(t)), q: q.toLocaleString('en-NG'), fee: this.n(fee), total: this.n(tot),
      dec: () => setQ(q - 1), inc: () => setQ(q + 1), set10: () => setQ(10), set50: () => setQ(50), set100: () => setQ(100), set500: () => setQ(500),
      hasErr: !!this.state.err || tot > cash, err: this.state.err || (tot > cash ? (max > 0 ? 'Not enough cash for ' + q.toLocaleString('en-NG') + ' shares. You can buy up to ' + max.toLocaleString('en-NG') + '.' : 'Not enough cash to buy this share.') : ''),
      go: (e) => { e.preventDefault(); if (tot > cash) return;
        if (!S.isOpen()) { location.href = 'MarketClosedNavy.dc.html?side=buy&t=' + t + '&q=' + q; return; }
        const r = S.trade('buy', t, q, this.key); if (r.ok) location.href = 'PracticeDoneNavy.dc.html'; else this.setState({ err: 'The order did not go through. Check the amount and try again.' }); } };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change interest</title>
<script src="./support.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8F9FA"><meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="./responsive.css">
<script src="./responsive.js"></script>
<script src="./fvd.js"></script>
<script src="./fv.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#0B192C}@media (hover: hover) and (pointer: fine){a:hover{color: #047857}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; ">
<div style="padding: 10px 16px 0 8px; display: flex; align-items: center; gap: 4px; flex: none"><a href="SettingsNavy.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Interest</h1></div><p style="margin: 8px 24px 0; font-size: 14px; line-height: 1.6; color: #334155; flex: none">This changes what you see first on Home.</p><div role="radiogroup" aria-label="Interest" style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 10px; flex: none"><sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 12px; border: {{o.bd}}; background: #FFFFFF; font: inherit; font-size: 16px; text-align: left; color: #0B192C; cursor: pointer"><span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #5B6577; width: 16px">{{o.l}}</span><span style="flex: 1">{{o.t}}</span></button></sc-for></div><div style="margin-top: auto; padding: 16px 24px 28px; display: flex; flex-direction: column; gap: 10px; flex: none"><a onClick="{{save}}" href="SettingsNavy.dc.html" style="height: 52px; flex: none; border-radius: 12px; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; background-color: #0B192C">Save</a></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* navy-me */
  constructor(p) { super(p); const g = window.FV ? window.FV.AUTH.get().goal : null; this.state = { g: g || 'Investing' }; }
  renderVals() { return { opts: ['Money basics', 'Investing', 'Nigerian market'].map((t, i) => ({ l: 'ABC'[i], t, on: String(t === this.state.g), bd: t === this.state.g ? '2px solid #0B192C' : '1px solid #D5D9E0', pick: () => this.setState({ g: t }) })), save: () => { if (window.FV) window.FV.AUTH.setGoal(this.state.g); } }; }
}
</script>
</body>
</html>

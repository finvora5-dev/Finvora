<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F8F9FA; color: #0B192C; font-family: 'Geist', system-ui, sans-serif; display: flex; overflow: hidden">
  
  <main style="flex: 1; min-width: 0; padding: 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 0; width: 100%"><div style="padding: 12px 0 0; flex: none"><h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2">When were you born?</h1><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #5B6577">You need to be 18 or older to use Finvora.</p></div><div style="padding: 24px 0 0; display: grid; grid-template-columns: 1fr 1.4fr 1.2fr; gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Day<span style="height: 50px; border: 1px solid #D5D9E0; border-radius: 12px; display: flex; align-items: center; padding: 0 14px; font-size: 16px; font-family: 'Geist Mono', monospace">14</span></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Month<span style="height: 50px; border: 1px solid #D5D9E0; border-radius: 12px; display: flex; align-items: center; padding: 0 14px; font-size: 16px; font-family: 'Geist Mono', monospace">March</span></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Year<span style="height: 50px; border: 1px solid #D5D9E0; border-radius: 12px; display: flex; align-items: center; padding: 0 14px; font-size: 16px; font-family: 'Geist Mono', monospace">2001</span></label></div><p style="margin: 14px 0 0; font-size: 13px; line-height: 1.6; color: #334155; flex: none">We only use this to check your age. It is never shown to anyone.</p><div style="margin-top: auto; padding: 16px 0 28px; display: flex; flex-direction: column; gap: 10px; flex: none"><a href="GoalNavy.dc.html" style="height: 52px; flex: none; border-radius: 12px; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; background-color: #0B192C">Continue</a></div></div>
  </main>
</div>
